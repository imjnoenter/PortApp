<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portfolio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a2a1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<script>
  document.documentElement.dataset.lang = localStorage.getItem('lang') || 'EN';
  document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
  document.documentElement.setAttribute('data-tone', localStorage.getItem('tone') || 'warm');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=DM+Sans:wght@400;500;600;700&Intel+One+Mono:ital,wght@0,300..700;1,300..700&family=Kanit:wght@400;500;600;700&display=swap">
<style>

:root {
  /* Cozy "Hearth & Hand" — warm cream parchment */
  --bg: #efe5d0;
  --bg-grain: radial-gradient(circle at 20% 10%, rgba(196,106,74,.04), transparent 40%), radial-gradient(circle at 90% 80%, rgba(107,142,90,.05), transparent 40%);
  --card: #faf3e0;
  --card-edge: #e6d8b8;
  --ink: #3a2a1c;
  --ink-soft: #5a432e;
  --muted: #8a7458;
  --muted-2: #a89178;
  --line: #e6d8b8;
  --line-soft: #ede0c4;
  --radius: 18px;
  --radius-sm: 12px;
  --radius-pill: 999px;
  --shadow: 0 1px 2px rgba(58,42,28,.05), 0 6px 18px rgba(58,42,28,.07);
  --shadow-lg: 0 2px 4px rgba(58,42,28,.06), 0 16px 36px rgba(58,42,28,.12);
  --track: #ede0c4;
  --hover: #f5ebd2;
  --grid: #e6d8b8;
  --tooltip-bg: #3a2a1c;

  /* Accents */
  --terracotta: #c46a4a;
  --sage: #6b8e5a;
  --clay: #bb4d3c;
  --honey: #c79038;
  --peri: #6b7eb8;
  --plum: #8a5a7e;

  --gain: #6b8e5a;
  --loss: #bb4d3c;
  --badge-up-bg: rgba(107,142,90,.16);
  --badge-up-fg: #5a7a4b;
  --badge-dn-bg: rgba(187,77,60,.14);
  --badge-dn-fg: #a04030;

  --btn-bg: #3a2a1c;
  --btn-fg: #faf3e0;
  --spark-ok: #6b8e5a;
  --logo-bg: #f5ebd2;

  --z-sticky: 100;
  --z-dropdown: 200;
  --z-overlay: 1000;
  --z-modal: 1100;
  --z-popover: 1200;
  --z-toast: 2000;
  --z-tooltip: 2100;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-7: 32px;
  --sp-8: 48px;
  --sp-9: 64px;

  --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);

  --font-display: 'Newsreader', Georgia, serif;
  --font-ui: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
/* ── Cool tone (light) — misty seafoam, eucalyptus, dusty teal ── */
[data-tone="cool"] {
  --bg: #dde7e4;
  --bg-grain: radial-gradient(circle at 20% 10%, rgba(90,143,163,.06), transparent 40%), radial-gradient(circle at 90% 80%, rgba(122,154,130,.06), transparent 40%);
  --card: #eef3ef;
  --card-edge: #c8d4cf;
  --ink: #25393a;
  --ink-soft: #3e5253;
  --muted: #6b8488;
  --muted-2: #8aa1a4;
  --line: #c8d4cf;
  --line-soft: #d6e0db;
  --shadow: 0 1px 2px rgba(37,57,58,.05), 0 6px 18px rgba(37,57,58,.08);
  --shadow-lg: 0 2px 4px rgba(37,57,58,.07), 0 16px 36px rgba(37,57,58,.13);
  --track: #d6e0db;
  --hover: #e3ece8;
  --grid: #c8d4cf;
  --tooltip-bg: #25393a;

  --terracotta: #5a8fa3;
  --sage: #7a9a82;
  --clay: #b56a6e;
  --honey: #b89c5a;
  --peri: #7a8cb8;
  --plum: #8a7aa3;

  --gain: #7a9a82;
  --loss: #b56a6e;
  --badge-up-bg: rgba(122,154,130,.18);
  --badge-up-fg: #5a7a64;
  --badge-dn-bg: rgba(181,106,110,.16);
  --badge-dn-fg: #8e4a52;

  --btn-bg: #25393a;
  --btn-fg: #eef3ef;
  --spark-ok: #7a9a82;
  --logo-bg: #e3ece8;
}

/* ── Cool tone (dark) — deep ocean ── */
[data-tone="cool"][data-theme="dark"] {
  --bg: #1a2628;
  --bg-grain: radial-gradient(circle at 20% 10%, rgba(90,143,163,.08), transparent 40%), radial-gradient(circle at 90% 80%, rgba(122,154,130,.06), transparent 40%);
  --card: #243335;
  --card-edge: #344547;
  --ink: #d8e8e6;
  --ink-soft: #b8c8c6;
  --muted: #8a9ea1;
  --muted-2: #6b8488;
  --line: #344547;
  --line-soft: #2d3d3f;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.4);
  --shadow-lg: 0 2px 4px rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.5);
  --track: #2d3d3f;
  --hover: #2f4143;
  --grid: #344547;
  --tooltip-bg: #0d1718;

  --terracotta: #7ab2c6;
  --sage: #9ab8a3;
  --clay: #d08a90;
  --honey: #d6b87a;
  --peri: #9aa8d0;
  --plum: #a89bbf;

  --gain: #9ab8a3;
  --loss: #d08a90;
  --badge-up-bg: rgba(154,184,163,.18);
  --badge-up-fg: #b8d0bf;
  --badge-dn-bg: rgba(208,138,144,.18);
  --badge-dn-fg: #e0a4a8;
  --btn-bg: #d8e8e6;
  --btn-fg: #1a2628;
  --logo-bg: #2d3d3f;
}

[data-theme="dark"] {
  /* Cozy dark — cocoa & embers */
  --bg: #211912;
  --bg-grain: radial-gradient(circle at 20% 10%, rgba(196,106,74,.06), transparent 40%), radial-gradient(circle at 90% 80%, rgba(107,142,90,.04), transparent 40%);
  --card: #2c2218;
  --card-edge: #3d2f22;
  --ink: #f0e4cd;
  --ink-soft: #d8c8a8;
  --muted: #a89178;
  --muted-2: #8a7458;
  --line: #3d2f22;
  --line-soft: #36281c;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.35);
  --shadow-lg: 0 2px 4px rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.45);
  --track: #36281c;
  --hover: #3a2c1f;
  --grid: #3d2f22;
  --tooltip-bg: #15100a;

  --terracotta: #d4825e;
  --sage: #8aa978;
  --clay: #d56b58;
  --honey: #d8a84b;
  --peri: #8a9bcb;
  --plum: #a3759a;

  --gain: #8aa978;
  --loss: #d56b58;
  --badge-up-bg: rgba(138,169,120,.18);
  --badge-up-fg: #a3c08e;
  --badge-dn-bg: rgba(213,107,88,.18);
  --badge-dn-fg: #e58a78;
  --btn-bg: #f0e4cd;
  --btn-fg: #211912;
  --spark-ok: #8aa978;
  --logo-bg: #36281c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; }
body {
  font: 14px/1.55 var(--font-ui);
  background: var(--bg);
  background-image: var(--bg-grain);
  color: var(--ink);
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
  touch-action: pan-x pan-y;
  font-feature-settings: "ss01", "cv11";
}

/* ── Layout ── */
.app { display: grid; grid-template-columns: 1fr 380px; gap: var(--sp-5); padding: max(var(--sp-4), env(safe-area-inset-top)) max(var(--sp-4), env(safe-area-inset-right)) max(var(--sp-4), env(safe-area-inset-bottom)) max(var(--sp-4), env(safe-area-inset-left)); min-height: 100vh; align-items: start; align-content: start; width: 100%; }
.main-panel, .side-panel { min-width: 0; width: 100%; }

/* ── Header (redesigned — no white-stripe overlay, dark-mode safe) ── */
.header {
  grid-column: 1/-1;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card);
  background-image:
    radial-gradient(ellipse 600px 200px at 0% 50%, rgba(196,106,74,.10), transparent 60%),
    radial-gradient(ellipse 500px 180px at 100% 50%, rgba(107,142,90,.07), transparent 60%);
  border: 1px solid var(--card-edge);
  border-radius: var(--radius);
  padding: var(--sp-3) var(--sp-5); box-shadow: var(--shadow); gap: var(--sp-3);
  position: relative; overflow: visible;
}
.header::before {
  /* Warm seal stripe — tints with theme, no white wash */
  content: ''; position: absolute; left: 0; top: 22%; bottom: 22%;
  width: 3px; border-radius: 0 3px 3px 0;
  background: linear-gradient(180deg, var(--terracotta), var(--honey));
  pointer-events: none; opacity: .9;
}
[data-tone="cool"] .header {
  background-image:
    radial-gradient(ellipse 600px 200px at 0% 50%, rgba(90,143,163,.12), transparent 60%),
    radial-gradient(ellipse 500px 180px at 100% 50%, rgba(122,154,130,.08), transparent 60%);
}
[data-theme="dark"] .header {
  background-image:
    radial-gradient(ellipse 600px 200px at 0% 50%, rgba(212,130,94,.10), transparent 60%),
    radial-gradient(ellipse 500px 180px at 100% 50%, rgba(154,184,138,.07), transparent 60%);
}
[data-theme="dark"][data-tone="cool"] .header {
  background-image:
    radial-gradient(ellipse 600px 200px at 0% 50%, rgba(122,178,198,.12), transparent 60%),
    radial-gradient(ellipse 500px 180px at 100% 50%, rgba(154,184,163,.08), transparent 60%);
}

.header-left { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
.header-title-group { min-width: 0; }
.header-title {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 600; letter-spacing: -.5px;
  font-style: italic; line-height: 1.05;
  color: var(--ink);
  cursor: pointer; user-select: none;
}
.header-title:hover { opacity: .75; }
.header-title.open  { opacity: .75; }
.header-title-input {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 600; letter-spacing: -.5px;
  font-style: italic; line-height: 1.05;
  color: var(--ink); background: transparent;
  border: none; border-bottom: 2px solid var(--terracotta);
  outline: none; width: 120px; padding: 0;
}
.header-sub {
  font-family: var(--font-mono);
  font-size: 10px; color: var(--muted); margin-top: 4px;
  letter-spacing: .8px; text-transform: uppercase;
  display: flex; align-items: center; gap: 5px;
}
.header-sub::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: var(--sage);
  box-shadow: 0 0 0 2px rgba(107,142,90,.22);
  animation: live-pulse 2.4s ease-in-out infinite;
}
@keyframes live-pulse {
  0%, 100% { box-shadow: 0 0 0 2px rgba(107,142,90,.22); }
  50%      { box-shadow: 0 0 0 6px rgba(107,142,90,0); }
}

.brand-mark {
  width: 42px; height: 42px; border-radius: 14px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(196,106,74,.32);
  position: relative; overflow: hidden;
  cursor: pointer;
}
@media (min-width: 769px) {
  .brand-mark { width: 88px; height: 88px; border-radius: 22px; }
}
.brand-mark::after {
  content: ''; position: absolute; inset: 2px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,.18); pointer-events: none;
}
.brand-mark:hover .pic-change-hint { opacity: 1; }
.pic-change-hint {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.45); border-radius: inherit; opacity: 0;
  transition: opacity .18s; font-size: 10px; color: #fff; font-weight: 600; letter-spacing: .3px;
  pointer-events: none; text-align: center; line-height: 1.3; padding: 4px;
}

/* ── Profile picture picker popover ── */
.pic-picker-backdrop {
  position: fixed; inset: 0; z-index: var(--z-tooltip); background: rgba(0,0,0,.18);
  backdrop-filter: blur(2px); display: none; align-items: flex-start; justify-content: flex-start;
}
.pic-picker-backdrop.open { display: flex; animation: overlayIn .2s var(--ease-out-quint); }
.pic-picker-backdrop.open .pic-picker { animation: modalIn .25s var(--ease-out-quint); }
.pic-picker {
  position: fixed; z-index: calc(var(--z-tooltip) + 1);
  background: var(--card); border: 1px solid var(--card-edge);
  border-radius: 16px; box-shadow: var(--shadow-lg); padding: 14px;
  min-width: 200px;
}
.pic-picker-title {
  font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 10px;
}
.pic-picker-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.pic-picker-item {
  aspect-ratio: 1; border-radius: 12px; overflow: hidden;
  cursor: pointer; border: 2px solid transparent;
  transition: border-color .15s, transform .1s;
  box-shadow: 0 1px 4px rgba(0,0,0,.12);
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
}
.pic-picker-item:hover { transform: scale(1.08); }
.pic-picker-item.active { border-color: var(--terracotta); }
.pic-picker-item img, .pic-picker-item svg { width: 100%; height: 100%; object-fit: cover; display: block; }
[data-tone="cool"] .brand-mark {
  background: linear-gradient(135deg, var(--terracotta) 0%, var(--plum) 100%);
  box-shadow: 0 2px 8px rgba(90,143,163,.32), inset 0 1px 0 rgba(255,255,255,.28);
}

.header-divider {
  width: 1px; align-self: stretch; margin: 8px 0; flex-shrink: 0;
  background: linear-gradient(180deg, transparent, var(--line) 25%, var(--line) 75%, transparent);
}

.market-clock-pill {
  display: flex; align-items: center; gap: 12px;
  padding: 7px 16px 7px 9px;
  background: var(--track);
  border: 1px solid var(--line);
  border-radius: 16px;
  flex-shrink: 0;
}
.market-clock-pill canvas { display: block; flex-shrink: 0; }
.mc-status {
  font-family: var(--font-ui);
  font-size: 13px; font-weight: 700;
  letter-spacing: .15px; line-height: 1.1;
  display: inline-flex; align-items: center; gap: 6px;
}
.mc-status::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%;
  background: currentColor; flex-shrink: 0;
  box-shadow: 0 0 0 3px color-mix(in oklab, currentColor 22%, transparent);
  animation: live-pulse 2.4s ease-in-out infinite;
}
.mc-et {
  font-family: var(--font-mono);
  font-size: 10.5px; color: var(--muted);
  margin-top: 4px; letter-spacing: .6px; text-transform: uppercase;
  font-weight: 500;
}

.header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-left: auto; }

/* ── Language toggle (EN / TH segmented) ── */
.lang-toggle {
  display: flex; border: 1px solid var(--line); border-radius: var(--radius-pill);
  overflow: hidden; height: 30px; flex-shrink: 0;
}
.lang-seg {
  border: none; background: transparent; padding: 0 11px;
  font-size: 11px; font-weight: 700; letter-spacing: .5px;
  cursor: pointer; color: var(--muted); font-family: var(--font-ui);
  transition: background .15s, color .15s;
}
.lang-seg.active { background: var(--btn-bg); color: var(--btn-fg); }
.lang-seg:not(.active):hover { background: var(--hover); color: var(--ink); }

/* ── Settings gear ── */
.settings-gear-wrap { position: relative; flex-shrink: 0; }
.settings-gear-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--track); border: 1px solid var(--line);
  cursor: pointer; color: var(--muted);
  transition: background .15s, color .15s, transform .3s;
}
.settings-gear-btn:hover { background: var(--hover); color: var(--ink); transform: rotate(30deg); }
.settings-gear-btn svg { width: 18px; height: 18px; }
.settings-dropdown {
  display: none; position: absolute; top: calc(100% + 8px); right: 0;
  background: var(--card); border: 1px solid var(--card-edge);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 10px 14px; min-width: 200px; z-index: calc(var(--z-tooltip) + 2);
  transform-origin: top right;
}
.settings-dropdown.open { display: block; animation: dropdownIn .18s var(--ease-out-quint); }
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; gap: 12px;
}
.settings-row + .settings-row { border-top: 1px solid var(--line); }
.settings-row-label {
  font-size: 12px; font-weight: 600; color: var(--ink);
  font-family: var(--font-ui); letter-spacing: .2px;
}
.settings-row .lang-toggle { height: 28px; }
.settings-row .lang-seg { padding: 0 10px; font-size: 10px; }
.settings-row .currency-btn { height: 28px; }
.settings-row .currency-btn span { line-height: 28px; padding: 0 10px; font-size: 12px; }
.settings-row .theme-btn { width: 28px; height: 28px; }
.settings-row .theme-btn svg { width: 14px; height: 14px; }

/* ── IRR info popover ── */
.irr-info-wrap { position: relative; display: inline-flex; }
.irr-info-btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0; background: none; border: none; cursor: pointer;
  color: var(--muted); line-height: 0; transition: color .15s;
}
.irr-info-btn:hover { color: var(--terracotta); }
.irr-breakdown {
  display: none; position: fixed;
  z-index: var(--z-tooltip); min-width: 240px; max-width: calc(100vw - var(--sp-4));
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow-lg); padding: var(--sp-3);
  font-size: 12px; text-align: left; white-space: normal;
}
.irr-breakdown.open { display: block; animation: dropdownIn .18s var(--ease-out-quint); }
.bd-title { font-weight: 700; margin-bottom: var(--sp-2); }
.bd-row { display: flex; justify-content: space-between; gap: var(--sp-3); padding: 2px 0; }
.bd-label { color: var(--muted); }
.bd-val { font-variant-numeric: tabular-nums; }
.bd-total { font-weight: 700; color: var(--ink); }
.bd-mwr { color: var(--terracotta); font-weight: 600; }
.bd-sub { color: var(--muted); font-size: 11px; }
.bd-explain { color: var(--muted); font-size: 11px; margin-top: var(--sp-2); line-height: 1.4; }
.bd-divider { height: 1px; background: var(--line); margin: var(--sp-2) 0; }

/* ── Portfolio toggle ── */
.port-toggle {
  display: flex; border: 1px solid var(--line); border-radius: var(--radius-pill);
  overflow: hidden; height: 30px; flex-shrink: 0; background: var(--track);
}
.port-toggle-btn {
  --port-accent: var(--btn-bg);
  border: none; background: transparent; padding: 0 13px;
  font-size: 11px; font-weight: 700; letter-spacing: .3px;
  cursor: pointer; color: var(--muted); font-family: var(--font-ui);
  white-space: nowrap; transition: background .15s, color .15s;
}
.port-toggle-btn.active { background: var(--port-accent); color: var(--btn-fg); }
.port-toggle-btn:not(.active):hover { background: var(--hover); color: var(--ink); }

/* ── Thai font (Kanit) — applied to every element ── */
[data-lang="TH"],
[data-lang="TH"] * {
  --font-ui: 'Kanit', system-ui, sans-serif;
  --font-display: 'Kanit', Georgia, serif;
  font-family: 'Kanit', system-ui, sans-serif !important;
}
/* Numbers: keep the original mono font in Thai mode */
[data-lang="TH"] .sc-value,
[data-lang="TH"] .sc-sub,
[data-lang="TH"] .mc-et,
[data-lang="TH"] .header-sub,
[data-lang="TH"] [class*="font-mono"],
[data-lang="TH"] [style*="font-mono"],
[data-lang="TH"] canvas {
  font-family: 'JetBrains Mono', ui-monospace, monospace !important;
}

.refresh-btn {
  display: flex; align-items: center; gap: 6px; padding: 8px 14px;
  background: var(--btn-bg); color: var(--btn-fg);
  border: none; border-radius: var(--radius-pill); cursor: pointer;
  font-family: var(--font-ui); font-size: 12px; font-weight: 600;
  transition: transform .15s, box-shadow .15s, opacity .15s;
  white-space: nowrap; min-height: 36px;
  box-shadow: 0 2px 6px rgba(58,42,28,.18);
}
.refresh-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(58,42,28,.22); }
.refresh-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
.refresh-btn.refreshing { opacity: .6; pointer-events: none; }
.refresh-btn.refreshing svg { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes overlayIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes dropdownIn {
  from { opacity: 0; transform: scale(0.96) translateY(-4px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
:focus-visible {
  outline: 2px solid var(--terracotta);
  outline-offset: 2px;
  border-radius: 4px;
}
button:focus-visible, .theme-btn:focus-visible, .currency-btn:focus-visible,
.settings-gear-btn:focus-visible, .refresh-btn:focus-visible {
  outline-offset: 2px;
}
input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline-offset: 0;
}

.theme-btn, .currency-btn {
  display: flex; align-items: center; justify-content: center;
  height: 36px; background: var(--track);
  border: 1px solid var(--line); border-radius: var(--radius-pill);
  cursor: pointer; color: var(--muted);
  transition: background .15s, color .15s, border-color .15s;
  flex-shrink: 0;
}
.theme-btn { width: 36px; }
.theme-btn:hover { background: var(--hover); color: var(--ink); border-color: var(--terracotta); }
.theme-btn svg { width: 16px; height: 16px; }

.currency-btn { gap: 0; overflow: hidden; padding: 0; }
.currency-btn span {
  padding: 0 12px; font-size: 13px; font-weight: 600; color: var(--muted);
  line-height: 36px; transition: background .15s, color .15s;
  font-family: var(--font-display); font-style: italic;
}
.currency-btn span.active { background: var(--terracotta); color: var(--btn-fg); }

.last-updated {
  font-size: 11px; color: var(--muted); white-space: nowrap;
  font-family: var(--font-mono); letter-spacing: .2px;
}

/* ── Card ── */
.card {
  background: var(--card);
  border: 1px solid var(--card-edge);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: var(--sp-4);
  position: relative;
  transition: box-shadow .2s, border-color .2s;
}
.card:hover { box-shadow: var(--shadow-lg); }
.card-title {
  font-family: var(--font-display);
  font-size: 15px; font-weight: 600; color: var(--ink);
  letter-spacing: -.2px; margin-bottom: 14px;
  text-transform: none;
  display: flex; align-items: center; gap: 8px;
}
.card-title::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--terracotta); flex-shrink: 0;
  box-shadow: 0 0 0 3px rgba(196,106,74,.18);
}

/* ── Main / side panel ── */
.main-panel, .side-panel { display: flex; flex-direction: column; gap: var(--sp-5); }

/* Gauge + Allocation panel */
.alloc-card { padding-bottom: 14px; }
.gauge-wrap { position: relative; height: 92px; margin: 0 auto 2px; width: 100%; max-width: 320px; display: flex; justify-content: center; align-items: flex-start; }
.gauge-wrap canvas { width: 100%; height: 100%; display: block; }
.gauge-center { display: none; }

.alloc-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin: 10px 0 14px;
}
.alloc-stat {
  display: flex; align-items: center; gap: 8px;
  background: var(--track); border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm); padding: 8px 10px;
}
.alloc-stat-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.alloc-stat-label {
  font-family: var(--font-mono); font-size: 9px;
  color: var(--muted); text-transform: uppercase; letter-spacing: .8px;
  margin-bottom: 1px;
}
.alloc-stat-value {
  font-family: var(--font-display); font-size: 14px;
  font-weight: 600; letter-spacing: -.2px; line-height: 1.05;
  color: var(--ink);
}

/* Risk & Concentration panel */
.risk-panel { display: flex; flex-direction: column; gap: 7px; }
.risk-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.risk-row-label {
  font-family: var(--font-mono); font-size: 9.5px;
  color: var(--muted); text-transform: uppercase; letter-spacing: .6px;
  display: flex; flex-direction: column; line-height: 1.25;
}
.risk-row-sub { font-size: 8.5px; color: var(--muted-2); text-transform: none; letter-spacing: .2px; }
.risk-row-value { font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: -.2px; text-align: right; white-space: nowrap; }
.risk-divider { height: 1px; background: var(--line-soft); margin: 3px 0; opacity: .7; }
.risk-bar-track { width: 110px; height: 5px; background: var(--track); border-radius: 3px; overflow: hidden; }
.risk-bar-fill { height: 100%; border-radius: 3px; width: 100%; transform-origin: left; transition: transform .4s var(--ease-out-quint); }

.alloc-list-head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 6px 0 8px;
  border-top: 1px dashed var(--line-soft);
  margin-bottom: 4px;
}
.alloc-list-head > span:first-child {
  font-family: var(--font-mono); font-size: 9.5px;
  color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
  font-weight: 600;
}
.alloc-list-head > span:last-child {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--muted-2); letter-spacing: .3px;
}

.alloc-note {
  font-size: 10px; color: var(--muted-2); letter-spacing: .2px;
  margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--line-soft);
}

/* Position list */
.pos-list { display: flex; flex-direction: column; gap: 2px; max-height: 380px; overflow-y: auto; padding-right: 4px; }
.pos-list::-webkit-scrollbar { width: 6px; }
.pos-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.pos-list::-webkit-scrollbar-track { background: transparent; }
.pos-row {
  display: grid;
  grid-template-columns: 10px 44px 1fr auto;
  align-items: center; gap: 9px;
  padding: 6px 4px; border-radius: 8px;
  transition: background .15s;
}
.pos-row:hover { background: var(--hover); }
.pos-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 2px var(--card); }
.pos-sym { font-size: 12px; font-weight: 700; font-family: var(--font-ui); letter-spacing: -.1px; color: var(--ink); }
.pos-bar-bg { height: 7px; background: var(--track); border-radius: 4px; overflow: hidden; box-shadow: inset 0 1px 1px rgba(58,42,28,.06); }
.pos-bar { height: 100%; border-radius: 4px; background-image: linear-gradient(180deg, rgba(255,255,255,.18), transparent); transform-origin: left center; }
@keyframes posBarGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.pos-bar.bar-anim { animation: posBarGrow .5s ease-out both; }
.pos-meta { text-align: right; line-height: 1.1; min-width: 64px; }
.pos-pct { font-size: 11px; color: var(--ink); font-family: var(--font-mono); font-weight: 600; }
.pos-val { font-size: 9.5px; color: var(--muted); font-family: var(--font-mono); margin-top: 1px; letter-spacing: .2px; }

/* Hero (legacy — kept for safety) */
.hero { padding: var(--sp-5); }
.hero-main { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.hero-value { font-family: var(--font-display); font-size: 34px; font-weight: 600; letter-spacing: -1px; }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 11px; border-radius: var(--radius-pill);
  font-size: 12px; font-weight: 600;
  font-family: var(--font-ui);
}
.badge.up   { background: var(--badge-up-bg); color: var(--badge-up-fg); }
.badge.down { background: var(--badge-dn-bg); color: var(--badge-dn-fg); }

/* Positions table */
.pos-table { width: 100%; border-collapse: collapse; font-size: 13px; font-family: var(--font-ui); }
.pos-table th {
  text-align: right; color: var(--muted); font-weight: 500;
  padding: 9px 8px; border-bottom: 1px solid var(--line);
  white-space: nowrap; cursor: pointer; user-select: none;
  font-size: 10px; text-transform: uppercase; letter-spacing: -0.3px;
}
.pos-table th:first-child { text-align: left; position: sticky; left: 0; z-index: 3; background: var(--card); max-width: 150px; }
.pos-table th:hover { color: var(--terracotta); }
.pos-table td {
  padding: 10px 8px; border-bottom: 1px solid var(--line-soft);
  vertical-align: middle; text-align: right;
}
.pos-table td:first-child { text-align: left; position: sticky; left: 0; z-index: 1; background: var(--card); max-width: 150px; }
.pos-table tr:last-child td { border-bottom: none; }
.pos-table tr:hover td { background: var(--hover); }
.pos-table tr:hover td:first-child { background: var(--hover); }
/* ── Top 20 Stock Holdings table ── */
.top-holdings-tbl { font-size: 12px; }
.top-holdings-tbl th,
.top-holdings-tbl td { text-align: left; position: static; }
.top-holdings-tbl th { cursor: default; }
.top-holdings-tbl th:first-child,
.top-holdings-tbl td:first-child { position: static; max-width: none; text-align: center; }
.top-holdings-tbl .thold-rank { font-family: var(--font-mono); color: var(--muted); text-align: center; }
.top-holdings-tbl .thold-ticker { font-family: var(--font-ui); font-weight: 600; }
.top-holdings-tbl .thold-name { overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.top-holdings-tbl .thold-weight { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.top-holdings-tbl .thold-breakdown { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.top-holdings-tbl .thold-sector { color: var(--muted); font-size: 11px; white-space: nowrap; }

.asset-cell { display: flex; align-items: center; gap: 9px; }
.logo-wrap {
  width: 32px; height: 32px; border-radius: 10px; overflow: hidden;
  flex-shrink: 0; background: var(--logo-bg);
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line);
}
.logo-img { width: 32px; height: 32px; object-fit: contain; padding: 3px; display: block; }
.logo-fb  { width: 32px; height: 32px; border-radius: 10px; display: none; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--btn-fg); flex-shrink: 0; }
.asset-sym  { font-weight: 600; font-size: 13px; letter-spacing: -.1px; }
.asset-name { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; margin-top: 1px; }
.tag { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: var(--radius-pill); letter-spacing: .4px; text-transform: uppercase; }
.tag.treasury { background: rgba(138,116,88,.18); color: var(--muted); }
.tag.watch    { background: rgba(199,144,56,.18);  color: var(--honey); }
.gain { color: var(--gain); font-weight: 600; }
.loss { color: var(--loss); font-weight: 600; }

/* Two-line cells */
.cell-main { font-size: 13px; font-weight: 600; white-space: nowrap; font-family: var(--font-ui); }
.cell-sub  { font-size: 10px; margin-top: 0px; white-space: nowrap; font-family: var(--font-mono); }
.cell-up   { color: var(--gain); }
.cell-dn   { color: var(--loss); }
.cell-mut  { color: var(--muted); }

/* Allocation sparkline */
.alloc-spark { min-width: 130px; }
.spark-track { position: relative; height: 6px; background: var(--track); border-radius: 4px; margin-bottom: 4px; }
.spark-fill  { height: 100%; border-radius: 4px; position: absolute; top: 0; left: 0; }
.spark-tick  { position: absolute; top: -4px; width: 2px; height: 14px; border-radius: 1px; background: var(--ink); opacity: .7; }
.spark-meta  { display: flex; justify-content: space-between; font-size: 10px; line-height: 1; font-family: var(--font-mono); }
.spark-curr  { color: var(--muted); }
.spark-diff  { font-weight: 700; }
.spark-diff.over  { color: var(--honey); }
.spark-diff.under { color: var(--peri); }
.spark-diff.ok    { color: var(--spark-ok); }

.to-add { font-size: 11px; font-weight: 700; white-space: nowrap; font-family: var(--font-mono); }
.to-add.buy  { color: var(--peri); }
.to-add.over { color: var(--honey); }
.to-add.none { color: var(--muted); }

/* 52-week range bar */
.w52-wrap { min-width: 120px; }
.w52-track { position: relative; height: 5px; background: var(--track); border-radius: 4px; margin-bottom: 4px; }
.w52-fill  { height: 100%; border-radius: 4px; position: absolute; top: 0; left: 0; opacity: 0.45; }
.w52-dot   { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--card); }
.w52-labels { display: flex; justify-content: space-between; font-size: 9px; font-family: var(--font-mono); white-space: nowrap; }

/* ── Position sub-tabs ── */
.pos-sub-tabs {
  display: flex; gap: 2px; margin-bottom: 8px;
  background: var(--track); border-radius: var(--radius-pill);
  padding: 2px; width: fit-content;
}
.pos-sub-tab {
  border: none; background: transparent; padding: 5px 16px;
  border-radius: var(--radius-pill); font-size: 11px; font-weight: 700;
  font-family: var(--font-ui); color: var(--muted); cursor: pointer;
  transition: background .15s, color .15s; white-space: nowrap; letter-spacing: .2px;
}
.pos-sub-tab.active {
  background: var(--card); color: var(--ink);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.pos-sub-tab:not(.active):hover { color: var(--ink); }

/* ── Performance table cells ── */
.perf-ret { font-family: var(--font-ui); font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; white-space: nowrap; }
.perf-ret.up   { color: var(--gain); }
.perf-ret.dn   { color: var(--loss); }
.perf-ret.flat { color: var(--muted); }
.perf-num  { font-family: var(--font-ui); font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink); white-space: nowrap; }
.perf-muted { font-family: var(--font-ui); font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }

/* ── 1Y sparkline ── */
.perf-spark { display: inline-block; vertical-align: middle; }
.perf-spark-line { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* Donut */
.donut-wrap { position: relative; }
.chart-wrap { position: relative; }
.chart-wrap.donut-h { height: 260px; width: 100%; }

/* ── Full-screen donut modal ── */
.card-expand-btn {
  margin-left: auto; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: none; border: none; padding: 2px; cursor: pointer;
  color: var(--ink); opacity: .35; border-radius: 6px;
  transition: opacity .15s, color .15s;
}
.card-expand-btn:hover { opacity: 1; color: var(--terracotta); }
.card-expand-btn:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 2px; opacity: 1; }
.card-expand-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }
.card-expand-btn + .card-chevron { margin-left: 0; }

.donut-overlay {
  position: fixed; inset: 0; z-index: var(--z-overlay);
  background: rgba(58,42,28,.45); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  padding: max(var(--sp-5), env(safe-area-inset-top, 0px)) var(--sp-4) max(var(--sp-4), env(safe-area-inset-bottom, 0px));
}
.donut-overlay.open { display: flex; animation: overlayIn .2s var(--ease-out-quint); }
.donut-overlay.open > .donut-modal { animation: modalIn .25s var(--ease-out-quint); }
.donut-modal {
  background: var(--card); color: var(--ink);
  border-radius: var(--radius); border: 1px solid var(--card-edge);
  box-shadow: var(--shadow-lg);
  width: min(92vw, 1000px); max-height: 88vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.donut-modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--line-soft);
}
.donut-modal-title {
  font-family: var(--font-display); font-size: 18px; font-weight: 600;
  color: var(--ink); letter-spacing: -.2px; margin: 0;
}
.donut-modal-close {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 24px; line-height: 1; padding: 2px 8px; border-radius: 8px;
  transition: color .15s, background .15s;
}
.donut-modal-close:hover { color: var(--ink); background: var(--hover); }
.donut-modal-close:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 2px; }
.donut-modal-body {
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(240px, .85fr);
  gap: var(--sp-5); padding: var(--sp-5); min-height: 0;
}
.donut-modal-chart { position: relative; height: clamp(300px, 52vh, 480px); min-width: 0; }
.donut-modal-chart canvas { width: 100% !important; height: 100% !important; }
.donut-modal-legend {
  overflow-y: auto; min-height: 0; max-height: clamp(300px, 52vh, 480px);
  display: flex; flex-direction: column; gap: 2px; padding-right: 4px;
}
.donut-modal-legend::-webkit-scrollbar { width: 6px; }
.donut-modal-legend::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.dm-legend-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 9px; border-radius: 8px; cursor: pointer;
  transition: background .12s;
}
.dm-legend-row:hover { background: var(--hover); }
.dm-legend-row.active { background: var(--hover); box-shadow: inset 0 0 0 1px var(--card-edge); }
.dm-swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
.dm-label { flex: 1; min-width: 0; font-family: var(--font-ui); font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dm-val { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dm-pct { font-family: var(--font-mono); font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
.dm-legend-row.residual { cursor: default; opacity: .6; }
.dm-legend-row.residual:hover { background: none; }
@media (max-width: 640px) {
  .donut-overlay { padding: 0; }
  .donut-modal { width: 100vw; max-width: 100vw; height: 100%; max-height: none; border-radius: 0; border: none; }
  .donut-modal-body { grid-template-columns: 1fr; gap: var(--sp-4); overflow-y: auto; }
  .donut-modal-chart { height: clamp(260px, 42vh, 360px); }
  .donut-modal-legend { max-height: none; overflow-y: visible; }
}
.chart-wrap.bar-h   { height: 200px; }
.donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
.donut-center .dc-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.donut-center .dc-value { font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: -.4px; margin-top: 2px; }

/* Sector legend chips */
.sector-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sector-chip {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; color: var(--ink-soft);
  background: var(--track); padding: 3px 9px; border-radius: var(--radius-pill);
  border: 1px solid var(--line);
}
.sector-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* P&L by Sector accordion panel */
.pnlsec-summary { display:flex; justify-content:space-between; align-items:baseline; padding:4px 2px 10px; border-bottom:1px solid var(--grid); margin-bottom:8px; }
.pnlsec-sum-label { font-size:12px; color:var(--muted); }
.pnlsec-sum-val { font-size:15px; font-weight:600; }
.pnlsec-sum-val small { font-size:11px; font-weight:500; opacity:.8; }
.pnlsec-row { padding:6px 2px; cursor:pointer; border-radius:6px; }
.pnlsec-row:hover { background:rgba(128,128,128,.07); }
.pnlsec-row-head { display:flex; align-items:center; gap:6px; font-size:12px; margin-bottom:4px; }
.pnlsec-caret { width:12px; color:var(--muted); font-size:10px; flex:0 0 auto; }
.pnlsec-name { flex:1 1 auto; color:var(--ink); }
.pnlsec-amt { font-weight:600; white-space:nowrap; }
.pnlsec-amt small { font-weight:500; opacity:.75; margin-left:4px; }
.pnlsec-bar-track { height:6px; border-radius:4px; background:var(--grid); overflow:hidden; }
.pnlsec-bar-fill { height:100%; border-radius:4px; width:100%; transform-origin:left; transition:transform .25s var(--ease-out-quint); }
.pnlsec-ind { margin:4px 0 4px 18px; padding:4px 2px; cursor:pointer; border-radius:6px; }
.pnlsec-ind:hover { background:rgba(128,128,128,.05); }
.pnlsec-tbl { width:100%; border-collapse:collapse; margin:6px 0 2px; font-size:11px; cursor:default; }
.pnlsec-tbl th { text-align:right; color:var(--muted); font-weight:500; padding:2px 4px; }
.pnlsec-tbl th:first-child { text-align:left; }
.pnlsec-tbl td { text-align:right; padding:2px 4px; color:var(--ink); }
.pnlsec-tbl td:first-child { text-align:left; font-weight:600; }

/* Watchlist */
.watch-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line-soft); gap: 8px; }
.watch-row:last-child { border-bottom: none; }
.watch-info  { display: flex; align-items: center; gap: 9px; min-width: 0; }
.watch-price { text-align: right; flex-shrink: 0; }
.watch-price .price  { font-size: 14px; font-weight: 600; font-family: var(--font-display); letter-spacing: -.2px; }

/* Benchmark chart */

.bench-status { color: var(--muted); font-size: 12px; text-align: center; padding: 30px 0; font-style: italic; font-family: var(--font-display); }

/* Error */
.error-banner { background: rgba(187,77,60,.12); color: var(--loss); padding: var(--sp-3) var(--sp-4); border-radius: var(--radius); font-size: 13px; border: 1px solid rgba(187,77,60,.25); }

/* ── First-load skeleton (mirrors the real shell; reuses .app/.header/.stat-grid/.card) ── */
.sk-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
.sk { position: relative; overflow: hidden; background: var(--track); border-radius: var(--radius-sm); }
.sk::after {
  content: ''; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent 0%, var(--sk-sheen) 50%, transparent 100%);
  animation: sk-sweep 1.5s var(--ease-out-quint) infinite;
  /* Negative delay keyed to --sk-d starts each block mid-cycle, so the sheen reads as one
     light raking diagonally across the page rather than every block pulsing in lockstep. */
  animation-delay: calc(var(--sk-d, 0) * -0.11s);
}
:root                              { --sk-sheen: color-mix(in oklab, var(--honey) 34%, transparent); }
[data-theme="dark"]               { --sk-sheen: color-mix(in oklab, var(--honey) 20%, transparent); }
@keyframes sk-sweep { to { transform: translateX(100%); } }

/* Diagonal stagger map (top-left → bottom-right). Scoped to #loadingSkeleton so the live app
   is untouched; --sk-d inherits into each .sk block from its nearest container here. */
#loadingSkeleton .header                          { --sk-d: 0; }
#loadingSkeleton .stat-card:nth-child(1)          { --sk-d: 1; }
#loadingSkeleton .stat-card:nth-child(2)          { --sk-d: 2; }
#loadingSkeleton .stat-card:nth-child(3)          { --sk-d: 3; }
#loadingSkeleton .stat-card:nth-child(4)          { --sk-d: 4; }
#loadingSkeleton .main-panel > .card              { --sk-d: 3; }
#loadingSkeleton .sk-posrow                        { --sk-d: 4; }
#loadingSkeleton .sk-posrow:nth-child(3)          { --sk-d: 5; }
#loadingSkeleton .sk-posrow:nth-child(4)          { --sk-d: 6; }
#loadingSkeleton .sk-posrow:nth-child(5)          { --sk-d: 7; }
#loadingSkeleton .sk-posrow:nth-child(6)          { --sk-d: 8; }
#loadingSkeleton .sk-posrow:nth-child(7)          { --sk-d: 9; }
#loadingSkeleton .side-panel > .card:nth-child(1) { --sk-d: 5; }
#loadingSkeleton .side-panel > .card:nth-child(2) { --sk-d: 7; }

.sk-brand  { width: 88px; height: 88px; border-radius: 22px; flex-shrink: 0; }
.sk-clock  { width: 152px; height: 64px; border-radius: var(--radius-pill); flex-shrink: 0; }
.sk-toggle { width: 188px; height: 38px; border-radius: var(--radius-pill); flex-shrink: 0; }
.sk-gear   { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; }
.sk-line   { border-radius: var(--radius-pill); }
.sk-circle { border-radius: 50%; flex-shrink: 0; }
.sk-donut  { width: 168px; height: 168px; border-radius: 50%; margin: 6px auto var(--sp-2); }
.sk-posrow { display: flex; align-items: center; gap: var(--sp-3); padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.sk-posrow:last-child { border-bottom: 0; }

@media (max-width: 700px) {
  .sk-brand  { width: 42px; height: 42px; border-radius: 12px; }
  .sk-clock  { order: 10; width: 100%; }
  .sk-donut  { width: 140px; height: 140px; }
}

.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }

/* ── Tablet ≤1080px ── */
@media (max-width: 1080px) {
  .app { grid-template-columns: 1fr; }
  .side-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--sp-3); }
  .side-panel .card { min-height: 0; }
}

/* ── Collapsible cards ── */
.card-title { cursor: pointer; }
.card-chevron {
  margin-left: auto;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  opacity: .35;
  transition: transform .22s ease, opacity .15s;
  pointer-events: none;
}
.card-chevron svg { width: 13px; height: 13px; stroke: var(--ink); }
.card.collapsed .card-chevron { transform: rotate(180deg); opacity: .6; }
.card.collapsed .card-title { margin-bottom: 0 !important; }
.card.collapsed > *:not(:first-child) { display: none !important; }
.card.collapsed > :first-child { margin-bottom: 0 !important; }
.card.collapsed .card-header-extra { display: none !important; }
.alloc-card .card-chevron { margin-left: 0; }

/* ── Mobile page tab bar ── */
.mob-tab-bar {
  display: none;
  grid-column: 1/-1;
  background: var(--card);
  border: 1px solid var(--card-edge);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  padding: 3px;
  gap: 2px;
}
@media (max-width: 700px) {
  .mob-tab-bar {
    position: sticky;
    top: calc(6px + env(safe-area-inset-top, 0px));
    z-index: var(--z-dropdown);
  }
}
.mob-tab {
  flex: 1;
  padding: 8px 4px 7px;
  border: none;
  border-radius: calc(var(--radius) - 3px);
  background: none;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-ui);
  text-transform: uppercase;
  letter-spacing: .4px;
  cursor: pointer;
  transition: color .15s, background .15s;
}
.mob-tab.active {
  background: var(--btn-bg);
  color: var(--btn-fg);
}

/* ── Mobile ≤700px ── */
@media (max-width: 700px) {
  body { font-size: 13px; }
  .app { grid-template-columns: 1fr; padding: var(--sp-2); gap: var(--sp-2); max-width: 100vw; }
  .stat-card { padding: var(--sp-3); }
  .sc-label  { font-size: 10px; margin-bottom: 6px; }

  .last-updated { display: none; }
  .header { padding: calc(var(--sp-3) + env(safe-area-inset-top, 0px)) var(--sp-3) var(--sp-3); flex-wrap: wrap; }
  .header-title { font-size: 18px; }
  .refresh-btn { padding: 7px 12px; }

  .header-left { flex-wrap: wrap; gap: var(--sp-2); }
  .header-left .header-divider { display: none; }
  .header-left .market-clock-pill { order: 10; width: 100%; }
  .header-left .port-toggle { order: 3; }

  .hero { padding: var(--sp-3); }
  .hero-value { font-size: 24px; }

  .gauge-wrap { max-width: 280px; height: 92px; margin-bottom: 4px; }
  .pos-list { max-height: 240px; }

  .card { padding: var(--sp-3); }
  .card-title { font-size: 14px; margin-bottom: 12px; }
  .table-scroll { overflow-x: scroll; -webkit-overflow-scrolling: touch; width: 100%; }
  .pos-table th:first-child, .pos-table td:first-child { width: 85px; min-width: 85px; max-width: 85px; }
  .pos-table { font-size: 12px; }
  .pos-table th, .pos-table td { padding: 7px 5px; white-space: nowrap; }
  .asset-cell { gap: 4px; }
  .logo-wrap, .logo-img, .logo-fb { width: 22px; height: 22px; }
  .asset-name { max-width: 50px; }
  .alloc-spark { min-width: 90px; }

  .side-panel { display: flex; flex-direction: column; gap: var(--sp-2); }

  .donut-wrap { display: flex; justify-content: center; }
  .chart-wrap.donut-h { height: 220px; width: 100%; }

  /* Tab visibility — hide sections not belonging to the active tab */
  .mob-tab-bar { display: flex; }
  .app:not(.mob-tab-overview)    [data-mob-tab="overview"]    { display: none; }
  .app:not(.mob-tab-holding)     [data-mob-tab="holding"]     { display: none; }
  .app:not(.mob-tab-transaction) [data-mob-tab="transaction"] { display: none; }
  .app:not(.mob-tab-allocation)  [data-mob-tab="allocation"]  { display: none; }
}

  .action-charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; margin-bottom: 16px; }

/* ── Stat grid ── */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-3); }
.stat-card {
  background: var(--card);
  border: 1px solid var(--card-edge);
  border-radius: var(--radius);
  padding: var(--sp-4);
  box-shadow: var(--shadow);
  min-width: 0;
  position: relative;
  overflow: visible;
  container-type: inline-size;
  min-height: 110px;
  display: flex; flex-direction: column; justify-content: space-between;
  transition: transform .15s, box-shadow .2s;
}
.stat-card::after {
  content: ''; position: absolute; top: 0; right: 0;
  width: 60px; height: 60px;
  background: radial-gradient(circle at top right, rgba(196,106,74,.08), transparent 70%);
  pointer-events: none;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.sc-label  {
  font-family: var(--font-ui);
  font-size: 10px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
}
.sc-value  {
  font-family: var(--font-display);
  font-size: clamp(18px, 12cqw, 26px); font-weight: 600; letter-spacing: -.6px;
  margin-bottom: 4px;
  white-space: nowrap; overflow: visible;
  color: var(--ink);
}
.sc-sub    { font-size: 12px; font-weight: 600; font-family: var(--font-mono); }
.sc-sub.up   { color: var(--gain); }
.sc-sub.down { color: var(--loss); }
.sc-sub.mut  { color: var(--muted); }
.sc-detail { font-size: 10px; color: var(--muted); margin-top: 4px; white-space: normal; overflow: visible; font-family: var(--font-mono); line-height: 1.2; }

/* ── Charts row + filter ── */
.charts-row { display: flex; flex-direction: column; gap: var(--sp-3); }
.chart-tf-strip {
  display: flex; gap: 4px; padding: 4px;
  background: var(--card); border: 1px solid var(--card-edge);
  border-radius: var(--radius-pill); width: fit-content;
  box-shadow: var(--shadow);
}
.tf-chart-btn {
  padding: 6px 14px; border: none; background: transparent;
  color: var(--muted); border-radius: var(--radius-pill); cursor: pointer;
  font-family: var(--font-ui); font-size: 11px; font-weight: 600;
  transition: background .15s, color .15s; letter-spacing: .3px;
}
.tf-chart-btn:hover { background: var(--hover); color: var(--ink); }
.tf-chart-btn.active { background: var(--terracotta); color: var(--btn-fg); box-shadow: 0 1px 4px rgba(196,106,74,.3); }
.nw-tf-btn { padding: 3px 9px; border: none; background: transparent; color: var(--muted); border-radius: var(--radius-pill); cursor: pointer; font-size: 11px; font-weight: 600; font-family: var(--font-ui); transition: background .15s, color .15s; letter-spacing: .3px; }
.nw-tf-btn:hover { background: var(--hover); color: var(--ink); }
.nw-tf-btn.active { background: var(--terracotta); color: var(--btn-fg); }
.charts-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.chart-half { min-width: 0; }
@media (max-width: 700px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .charts-pair { grid-template-columns: 1fr; }
}

/* ── Tx modal ── */
.tx-overlay { position: fixed; inset: 0; z-index: var(--z-overlay); background: rgba(58,42,28,.45); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; padding: max(40px, env(safe-area-inset-top, 0px)) var(--sp-4) max(var(--sp-4), env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.tx-overlay.open { display: flex; animation: overlayIn .2s var(--ease-out-quint); }
.tx-overlay.open > .tx-modal { animation: modalIn .25s var(--ease-out-quint); }
.tx-modal { background: var(--card); color: var(--ink); border-radius: var(--radius); border: 1px solid var(--card-edge); box-shadow: var(--shadow-lg); width: 100%; max-width: 440px; padding: var(--sp-6); }
.tx-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.tx-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: -.3px; }
.tx-close { display: none; }
.pm-close  { display: none; }
.tx-type-toggle { display: flex; background: var(--track); border-radius: var(--radius-pill); padding: 4px; margin-bottom: 14px; }
.tx-type-btn { flex: 1; padding: 8px; border: none; background: transparent; border-radius: var(--radius-pill); font-family: var(--font-ui); font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .15s; }
.tx-type-btn.active-buy  { background: var(--sage); color: var(--btn-fg); }
.tx-type-btn.active-sell { background: var(--clay); color: var(--btn-fg); }
.tx-type-btn.active-div  { background: var(--peri); color: var(--btn-fg); }
.tx-field { margin-bottom: 14px; }
.tx-label { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: .5px; }
.tx-input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--track); color: var(--ink); font-family: var(--font-ui); font-size: 13px; outline: none; transition: border-color .15s, background .15s; }
.tx-input:focus { border-color: var(--terracotta); background: var(--card); }
.tx-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tx-calc { font-size: 11px; color: var(--muted); margin-top: 8px; padding: 9px 11px; background: var(--track); border-radius: var(--radius-sm); display: flex; justify-content: space-between; }
.tx-submit { width: 100%; padding: 12px; background: var(--terracotta); color: var(--btn-fg); border: none; border-radius: var(--radius-pill); font-family: var(--font-ui); font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 14px; box-shadow: 0 2px 8px rgba(196,106,74,.3); transition: transform .15s, box-shadow .15s; }
.tx-submit:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(196,106,74,.4); }
.tx-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.tx-status { font-size: 12px; text-align: center; margin-top: 8px; min-height: 18px; font-family: var(--font-display); font-style: italic; }
.add-tx-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 14px 5px 6px;
  background: linear-gradient(180deg, var(--card) 0%, var(--track) 100%);
  color: var(--ink-soft); border: 1px solid var(--card-edge);
  border-radius: var(--radius-pill);
  font-family: var(--font-display); font-style: italic;
  font-size: 13px; font-weight: 600; letter-spacing: .1px;
  cursor: pointer; white-space: nowrap;
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 1px 2px rgba(58,42,28,.08);
  transition: transform .15s, box-shadow .2s, border-color .2s, color .2s, background .2s;
  position: relative;
}
.add-tx-btn .atx-plus {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--terracotta); color: var(--btn-fg);
  font-family: var(--font-ui); font-style: normal;
  font-size: 16px; font-weight: 400; line-height: 1;
  box-shadow: 0 1px 2px rgba(196,106,74,.32), inset 0 1px 0 rgba(255,255,255,.22);
  flex-shrink: 0;
  transition: transform .25s ease, background .2s, color .2s, box-shadow .2s;
}
.add-tx-btn .atx-label { padding-right: 2px; }
.add-tx-btn:hover {
  transform: translateY(-1px); color: var(--btn-fg);
  background: var(--terracotta); border-color: var(--terracotta);
  box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 6px 14px rgba(196,106,74,.32);
}
.add-tx-btn:hover .atx-plus {
  background: var(--btn-fg); color: var(--terracotta);
  transform: rotate(90deg) scale(1.05);
  box-shadow: 0 1px 3px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.6);
}
.add-tx-btn:active { transform: translateY(0); }
[data-tone="cool"] .add-tx-btn:hover {
  box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 6px 14px rgba(90,143,163,.34);
}
.add-tx-btn.refreshing { opacity: .6; pointer-events: none; }
.add-tx-btn.refreshing svg { animation: spin .7s linear infinite; }

/* ── Cash edit pill (sc-cash card) ── */
.cash-edit-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px 6px 10px;
  font-family: var(--font-display); font-style: italic;
  font-size: 12px; font-weight: 600; letter-spacing: .1px;
  color: var(--terracotta);
  background: linear-gradient(180deg, var(--card) 0%, var(--track) 100%);
  border: 1px solid var(--card-edge); border-radius: var(--radius-pill);
  cursor: pointer;
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 1px 2px rgba(58,42,28,.08);
  transition: transform .15s, box-shadow .2s, border-color .2s, color .2s, background .2s;
  position: relative; z-index: 1;
}
.cash-edit-btn svg { width: 13px; height: 13px; flex-shrink: 0; transition: transform .25s ease; }
.cash-edit-btn:hover {
  color: var(--btn-fg); background: var(--terracotta); border-color: var(--terracotta);
  transform: translateY(-1px);
  box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 6px 14px rgba(196,106,74,.32);
}
.cash-edit-btn:hover svg { transform: rotate(-12deg) scale(1.05); }
.cash-edit-btn:active { transform: translateY(0); }
[data-tone="cool"] .cash-edit-btn:hover { box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 6px 14px rgba(90,143,163,.34); }

/* ── Tx panel ── */
.tx-panel-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
.tx-panel-table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: var(--font-ui); }
.tx-panel-table th { text-align: right; color: var(--muted); font-weight: 500; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 10px; text-transform: uppercase; letter-spacing: .6px; }
.tx-panel-table th:first-child { text-align: left; }
.tx-panel-table td { padding: 9px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; text-align: right; white-space: nowrap; }
.tx-panel-table td:first-child { text-align: left; }
.tx-panel-table tr:last-child td { border-bottom: none; }
.tx-panel-table tr:hover td { background: var(--hover); }
.tx-date-main { font-size: 12px; font-weight: 600; }
.tx-date-sub { font-size: 10px; color: var(--muted); margin-top: 1px; font-family: var(--font-mono); }
.tx-badge-buy  { display: inline-block; padding: 3px 9px; border-radius: var(--radius-pill); font-size: 10px; font-weight: 700; background: var(--badge-up-bg); color: var(--badge-up-fg); letter-spacing: .3px; }
.tx-badge-sell { display: inline-block; padding: 3px 9px; border-radius: var(--radius-pill); font-size: 10px; font-weight: 700; background: var(--badge-dn-bg); color: var(--badge-dn-fg); letter-spacing: .3px; }
.tx-free-yes { color: var(--gain); font-weight: 700; }
.tx-free-no  { color: var(--muted); }
.tx-actions { display: flex; gap: 5px; justify-content: flex-end; }
.tx-action-btn { width: 28px; height: 28px; border: 1px solid var(--line); background: var(--track); border-radius: var(--radius-sm); cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; padding: 0; transition: color .15s, border-color .15s, background .15s; }
.tx-action-btn:hover { color: var(--terracotta); border-color: var(--terracotta); background: var(--hover); }
.tx-action-btn.danger:hover { color: var(--loss); border-color: var(--loss); }
.tx-action-btn svg { width: 13px; height: 13px; }
.tx-confirm-row { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; color: var(--muted); }
.tx-confirm-yes { padding: 4px 10px; border: none; background: var(--loss); color: var(--btn-fg); border-radius: var(--radius-pill); font-size: 11px; font-weight: 600; cursor: pointer; }
.tx-confirm-no  { padding: 4px 10px; border: 1px solid var(--line); background: var(--track); color: var(--ink); border-radius: var(--radius-pill); font-size: 11px; font-weight: 600; cursor: pointer; }
.tx-count-badge { display: inline-block; margin-left: 8px; padding: 2px 9px; background: var(--track); color: var(--muted); border-radius: var(--radius-pill); font-size: 10px; font-weight: 600; font-family: var(--font-mono); }
.tx-panel-status { padding: 30px 0; text-align: center; color: var(--muted); font-size: 13px; font-family: var(--font-display); font-style: italic; }

/* ── Plan modal ── */
.plan-overlay { position: fixed; inset: 0; z-index: var(--z-overlay); background: rgba(58,42,28,.45); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; padding: max(40px, env(safe-area-inset-top, 0px)) var(--sp-4) max(var(--sp-4), env(safe-area-inset-bottom, 0px)); overflow-y: auto; -webkit-overflow-scrolling: touch; }
@media (max-width: 600px) { .plan-overlay { padding-top: max(59px, env(safe-area-inset-top, 0px)); } }
.plan-overlay.open { display: flex; animation: overlayIn .2s var(--ease-out-quint); }
.plan-overlay.open > .plan-modal { animation: modalIn .25s var(--ease-out-quint); }

}
.gc-input-row { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); flex-shrink: 0; }
.gc-input { flex: 1; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--track); color: var(--ink); font-family: var(--font-ui); font-size: 13px; outline: none; }
.gc-input:focus { border-color: var(--terracotta); }
.gc-send { padding: 8px 16px; background: var(--terracotta); color: var(--btn-fg); border: none; border-radius: var(--radius-pill); font-family: var(--font-ui); font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0; }

.gc-gemini-btn { background: none; border: none; cursor: pointer; padding: 0 0 0 5px; line-height: 1; vertical-align: middle; opacity: .75; display: inline-flex; align-items: center; }

@media (max-width: 480px) { #geminiChatPanel { bottom: 0; right: 0; left: 0; width: auto; border-radius: var(--radius) var(--radius) 0 0; height: calc(100vh - 59px); max-height: calc(100vh - 59px); } }
.plan-bar-wrap { margin: 16px 0 20px; }

.plan-bar-seg { position: absolute; top: 0; bottom: 0; }

.plan-bar-labels { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 10px; color: var(--muted); }
.pbl-item { display: inline-flex; align-items: center; gap: 5px; }
.pbl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.tranche-row { display: grid; grid-template-columns: 48px 1fr 1fr 1fr 1fr 30px 30px; align-items: center; gap: 8px; margin-bottom: 8px; }
.tranche-label { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 13px; font-weight: 600; }

}
[id^="tranche-avg-"] { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tranche-remove, .tranche-clear { width: 30px; height: 30px; border: none; background: transparent; color: var(--muted); cursor: pointer; border-radius: var(--radius-sm); font-size: 16px; line-height: 1; }
.tranche-remove:hover:not(:disabled) { background: var(--track); color: var(--loss); }
.tranche-clear:hover { background: var(--track); color: var(--honey); }
.tranche-remove:disabled { opacity: .25; cursor: not-allowed; }
.plan-add-btn { width: 100%; padding: 10px; margin-top: 4px; background: transparent; border: 1px dashed var(--line); border-radius: var(--radius-sm); color: var(--muted); font-family: var(--font-ui); font-size: 12px; font-weight: 600; cursor: pointer; transition: border-color .15s, color .15s; }
.plan-add-btn:hover { border-color: var(--terracotta); color: var(--terracotta); }
.tranche-row.rebalfund-active { background: rgba(196,106,74,.08); border-radius: var(--radius-sm); box-shadow: inset 3px 0 0 var(--terracotta); }
.rebalfund-panel { margin: 0 0 14px; padding: var(--sp-3); background: var(--track); border-radius: var(--radius-sm); border-left: 3px solid var(--terracotta); }
.rebalfund-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.rebalfund-title { font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: .5px; font-size: 10px; }
.rebalfund-target { font-size: 11px; color: var(--muted); }
.rebalfund-bar-track { position: relative; height: 10px; background: var(--card); border-radius: var(--radius-pill); overflow: hidden; margin-bottom: 6px; }
.rebalfund-bar-fill { height: 100%; width: 0%; background: var(--sage); border-radius: var(--radius-pill); transition: width .2s var(--ease-out-quint); }
.rebalfund-remaining { font-size: 11px; color: var(--muted); margin-bottom: 10px; }

.rebalfund-cash-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.rebalfund-cash-row .tx-label { margin: 0; white-space: nowrap; }
.rebalfund-cash-row input { max-width: 120px; }
.rebalfund-warn { font-size: 11px; color: var(--honey); margin-bottom: 8px; }
.plan-actions { display: flex; gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.pa-save { flex: 1; padding: 11px 16px; background: var(--terracotta); color: var(--btn-fg); border: none; border-radius: var(--radius-pill); font-family: var(--font-ui); font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(196,106,74,.3); transition: transform .15s; }
.pa-save:hover { transform: translateY(-1px); }
.pa-clear { padding: 11px 16px; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius-pill); font-family: var(--font-ui); font-size: 12px; font-weight: 600; cursor: pointer; }
.pa-clear:hover { color: var(--loss); border-color: var(--loss); }
/* ── Plan button — base (shared) ── */
.plan-btn { display: inline-flex; align-items: center; justify-content: center; margin-left: 6px; cursor: pointer; vertical-align: middle; transition: all .2s ease; position: relative; }
.plan-btn .pb-label { display: none; }

/* ── V1: Compact circle ── */
[data-plan-btn="compact"] .plan-btn {
  width: 22px; height: 22px; padding: 0;
  background: var(--track); border: 1px solid var(--line-soft);
  border-radius: 50%; color: var(--muted-2);
}
[data-plan-btn="compact"] .plan-btn svg { width: 12px; height: 4px; }
[data-plan-btn="compact"] .plan-btn:hover {
  background: rgba(196,106,74,.12); border-color: var(--terracotta); color: var(--terracotta);
  transform: scale(1.12);
}
[data-plan-btn="compact"] .plan-btn.saved {
  background: var(--terracotta); border-color: var(--terracotta); color: var(--btn-fg);
  box-shadow: 0 2px 8px rgba(196,106,74,.35);
}
[data-plan-btn="compact"] .plan-btn.saved:hover {
  transform: scale(1.15); box-shadow: 0 3px 12px rgba(196,106,74,.45);
}
/* Notification ping on saved */
[data-plan-btn="compact"] .plan-btn.saved::after {
  content: ''; position: absolute; top: -2px; right: -2px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--honey); border: 1.5px solid var(--card);
  box-shadow: 0 0 0 1px rgba(199,144,56,.3);
}

/* ── V2: Serif pill (matches cash-edit-btn) ── */
[data-plan-btn="pill"] .plan-btn {
  gap: 5px; padding: 3px 9px 3px 7px;
  font-family: var(--font-display); font-style: italic;
  font-size: 10px; font-weight: 600; letter-spacing: .1px;
  color: var(--muted);
  background: linear-gradient(180deg, var(--card) 0%, var(--track) 100%);
  border: 1px solid var(--card-edge); border-radius: var(--radius-pill);
  box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 1px 2px rgba(58,42,28,.06);
}
[data-plan-btn="pill"] .plan-btn .pb-label { display: inline; }
[data-plan-btn="pill"] .plan-btn svg { width: 10px; height: 3px; }
[data-plan-btn="pill"] .plan-btn:hover {
  color: var(--btn-fg); background: var(--terracotta); border-color: var(--terracotta);
  transform: translateY(-1px);
  box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 4px 10px rgba(196,106,74,.28);
}
[data-plan-btn="pill"] .plan-btn:hover svg { transform: rotate(-12deg); }
[data-plan-btn="pill"] .plan-btn.saved {
  color: var(--terracotta); border-color: rgba(196,106,74,.5);
  background: linear-gradient(180deg, rgba(196,106,74,.08) 0%, rgba(196,106,74,.16) 100%);
}
[data-plan-btn="pill"] .plan-btn.saved::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: var(--terracotta); flex-shrink: 0;
  box-shadow: 0 0 4px rgba(196,106,74,.5);
}
[data-plan-btn="pill"] .plan-btn.saved:hover {
  color: var(--btn-fg); background: var(--terracotta);
}

/* ── V3: Squircle badge ── */
[data-plan-btn="badge"] .plan-btn {
  width: 24px; height: 20px; padding: 0;
  background: linear-gradient(135deg, var(--card) 0%, var(--track) 100%);
  border: 1px solid var(--card-edge); border-radius: 6px;
  color: var(--muted-2);
  box-shadow: 0 1px 3px rgba(58,42,28,.08);
}
[data-plan-btn="badge"] .plan-btn svg { width: 12px; height: 4px; transition: transform .2s; }
[data-plan-btn="badge"] .plan-btn:hover {
  background: linear-gradient(135deg, var(--terracotta) 0%, var(--honey) 100%);
  border-color: var(--terracotta); color: var(--btn-fg);
  transform: translateY(-1px); box-shadow: 0 3px 10px rgba(196,106,74,.3);
}
[data-plan-btn="badge"] .plan-btn:hover svg { transform: scale(1.15); }
[data-plan-btn="badge"] .plan-btn.saved {
  background: linear-gradient(135deg, rgba(196,106,74,.15) 0%, rgba(199,144,56,.1) 100%);
  border-color: var(--terracotta); color: var(--terracotta);
}
[data-plan-btn="badge"] .plan-btn.saved::after {
  content: ''; position: absolute; top: -3px; right: -3px;
  width: 6px; height: 6px; border-radius: 50%;

}

@keyframes action-pulse { 0%,100% { opacity: 1; } 50% { opacity: .15; } }
.action-pulse { animation: action-pulse 1.1s ease-in-out infinite; font-weight: 700; }
.action-tab-btn { flex: 1; padding: 8px 4px; border: none; background: transparent; border-radius: var(--radius-pill); font-family: var(--font-ui); font-size: 10px; font-weight: 700; color: var(--muted); cursor: pointer; transition: all .15s; letter-spacing: .4px; text-transform: uppercase; }

<script>
// Snapshot the instant-paint loading skeleton (static in <body>) before anything mutates #root,
// so init() can re-inject it after the setup-modal path (which replaces #root pre-first-load).
const _skeletonHTML = document.getElementById('loadingSkeleton')?.outerHTML || '';
function showLoadingSkeleton() {
  const root = document.getElementById('root');
  if (root && !document.getElementById('loadingSkeleton')) root.innerHTML = _skeletonHTML;
}

// ── Config — multi-profile, stored in localStorage, never in code ────────────
const PALETTE = ["#c46a4a","#6b7eb8","#8a5a7e","#c79038","#6b8e5a","#7aa3b8","#b56a8a","#9ca85a","#d4825e","#8a7458","#9a7aa3","#7a9a82"];

const _CFG_KEY = 'portfolioConfig.v1';
function _loadCfg() {
  try {
    const raw = localStorage.getItem(_CFG_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    // Migrate: old single-profile format → multi-profile
    if (d.sheetId && !d.profiles) {
      const migrated = { profiles: [{ id: 'p1', profileName: d.profileName || 'Portfolio', sheetId: d.sheetId, recordUrl: d.recordUrl, writeKey: d.writeKey }], activeProfileId: 'p1' };
      localStorage.setItem(_CFG_KEY, JSON.stringify(migrated));
      return migrated;
    }
    return d?.profiles?.length ? d : null;
  } catch { return null; }
}
function _saveCfg(d) { localStorage.setItem(_CFG_KEY, JSON.stringify(d)); }
function _activeProfile() {
  if (!_cfg?.profiles?.length) return null;
  return _cfg.profiles.find(p => p.id === _cfg.activeProfileId) || _cfg.profiles[0];
}
const _PIC_PRESETS = [
  { key: 'juno',    src: 'juno.png',     label: 'Juno' },
  { key: 'hygieia', src: 'hygieia.png',  label: 'Hygieia' },
  { key: 'hector',  src: 'hector.png',   label: 'Hector' },
];
function profileIconSrc() {
  const p = _activeProfile();
  if (p?.profilePicKey) {
    const found = _PIC_PRESETS.find(x => x.key === p.profilePicKey);
    if (found) return found.src;
  }
  const name = (p?.profileName || '').toLowerCase().trim();
  if (name === 'juno')    return 'juno.png';
  if (name === 'hygieia') return 'hygieia.png';
  if (name === 'hector')  return 'hector.png';
  return 'icon.png';
}
function _setProfilePic(key) {
  if (!_cfg) return;
  const idx = _cfg.profiles.findIndex(p => p.id === _cfg.activeProfileId);
  if (idx < 0) return;
  _cfg.profiles[idx].profilePicKey = key;
  _saveCfg(_cfg);
  const img = document.querySelector('.brand-mark img');
  if (img) img.src = profileIconSrc();
  closePicPicker();
}
function openPicPicker(e) {
  e.stopPropagation();
  let backdrop = document.getElementById('picPickerBackdrop');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.id = 'picPickerBackdrop';
    backdrop.className = 'pic-picker-backdrop';
    backdrop.onclick = e2 => { if (e2.target === backdrop) closePicPicker(); };
    document.body.appendChild(backdrop);
  }
  const current = _activeProfile()?.profilePicKey || profileIconSrc().replace('.png','');
  const items = _PIC_PRESETS.map(p => `
    <div class="pic-picker-item${p.key === current ? ' active' : ''}" onclick="_setProfilePic('${p.key}')" title="${p.label}">
      <img src="${p.src}" alt="${p.label}">
    </div>`).join('');
  backdrop.innerHTML = `
    <div class="pic-picker" id="picPickerBox">
      <div class="pic-picker-title">Choose Avatar</div>
      <div class="pic-picker-grid">${items}</div>
    </div>`;
  backdrop.classList.add('open');
  const bm = document.querySelector('.brand-mark');
  const box = document.getElementById('picPickerBox');
  if (bm && box) {
    const r = bm.getBoundingClientRect();
    const bw = box.offsetWidth || 200;
    let left = r.left;
    if (left + bw > window.innerWidth - 8) left = window.innerWidth - bw - 8;
    box.style.top = (r.bottom + 6) + 'px';
    box.style.left = left + 'px';
  }
}
function closePicPicker() {
  const b = document.getElementById('picPickerBackdrop');
  if (b) b.classList.remove('open');
}
function isReadOnly() {
  const p = _activeProfile();
  return !!(p && (!p.recordUrl || !p.writeKey));
}
function _buildUrls(c) {
  const b = `https://docs.google.com/spreadsheets/d/${c.sheetId}/gviz/tq?tqx=out:json&sheet=`;
  return { SHEET_URL: b+'Claude', TRANSACTION_URL: b+'transactions', TX_LIST_URL: b+'transactions',
           HISTORY_URL: b+'History', CALENDAR_URL: b+'Calendar', PLAN_URL: b+'Plan',
           QUOTES_URL: b+'Quotes', RETURNS_URL: b+'Returns', PORTFOLIOS_URL: b+'Portfolios',
           RECORD_URL: c.recordUrl, WRITE_KEY: c.writeKey };
}
function _applyActiveProfile() {
  const a = _activeProfile();
  if (!a) return;
  const u = _buildUrls(a);
  SHEET_URL = u.SHEET_URL; TRANSACTION_URL = u.TRANSACTION_URL; TX_LIST_URL = u.TX_LIST_URL;
  HISTORY_URL = u.HISTORY_URL; CALENDAR_URL = u.CALENDAR_URL; PLAN_URL = u.PLAN_URL;
  QUOTES_URL = u.QUOTES_URL; RETURNS_URL = u.RETURNS_URL; PORTFOLIOS_URL = u.PORTFOLIOS_URL;
  RECORD_URL = u.RECORD_URL; _WRITE_KEY = u.WRITE_KEY;
  _staticQuoteCache = {};
}

function _syncProfilePrefsToStorage() {
  const p = _activeProfile();
  if (!p) return;
  if (p.theme)    localStorage.setItem('theme', p.theme);
  if (p.lang)     localStorage.setItem('lang', p.lang);
  if (p.currency) localStorage.setItem('currency', p.currency);
  if (p.tone)     localStorage.setItem('tone', p.tone);
}

// #reset hash clears config (escape hatch)
if (location.hash === '#reset') { localStorage.removeItem(_CFG_KEY); history.replaceState(null, '', location.pathname); }

// Share-link onboarding: ?sheet=ID&name=Name auto-creates a Level 1 (read-only) profile
(function() {
  const sp = new URLSearchParams(location.search);
  const sheetParam = sp.get('sheet');
  const nameParam  = sp.get('name') || 'Portfolio';
  if (!sheetParam || !/^[A-Za-z0-9_-]{20,}$/.test(sheetParam)) return;
  const existing = _loadCfg();
  if (existing?.profiles?.some(p => p.sheetId === sheetParam)) {
    history.replaceState(null, '', location.pathname);
    return;
  }
  const newProfile = { id: 'p' + Date.now(), profileName: nameParam, sheetId: sheetParam };
  const newCfg = existing
    ? { ...existing, profiles: [...existing.profiles, newProfile], activeProfileId: newProfile.id }
    : { profiles: [newProfile], activeProfileId: newProfile.id };
  localStorage.setItem(_CFG_KEY, JSON.stringify(newCfg));
  history.replaceState(null, '', location.pathname);
})();

let _cfg = _loadCfg();
_syncProfilePrefsToStorage();
let _u   = (() => { const a = _activeProfile(); return a ? _buildUrls(a) : {}; })();
let SHEET_URL       = _u.SHEET_URL       || '';
let TRANSACTION_URL = _u.TRANSACTION_URL || '';

let PLAN_URL        = _u.PLAN_URL        || '';
let RECORD_URL      = _u.RECORD_URL      || '';
let _WRITE_KEY      = _u.WRITE_KEY       || '';
let QUOTES_URL      = _u.QUOTES_URL      || '';
let RETURNS_URL     = _u.RETURNS_URL     || '';
let PORTFOLIOS_URL  = _u.PORTFOLIOS_URL  || '';

let _lastQuoteSource  = null; // { type: 'sheet'|'yahoo', updatedAt?: unixSec }
