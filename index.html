// ── Plan modal ────────────────────────────────────────────────────────────────
const TRANCHE_COLORS = ['#6b7eb8','#8a5a7e','#b56a8a','#c79038','#6b8e5a','#7aa3b8','#9a7aa3','#9ca85a'];
let planState = { symbol: null, name: '', tranches: [], model: null, sl: null, note: '', pendingTarget: null, pendingCategory: null };
let planCache = {}; // { [portfolio]: { [sym]: { tranches, sl, note, trimTranches } } } — loaded at startup

// Plan lookup. With an explicit port → that port's plan. Without → the active view's port;
// in ALL view, prefer Long-Term then any port that has a plan for the symbol.
function getPlan(sym, port) {
  const p = port || (activePortfolio === 'ALL' ? null : activePortfolio);
  if (p) return planCache[p]?.[sym];
  if (planCache[DEFAULT_PORT]?.[sym]) return planCache[DEFAULT_PORT][sym];
  for (const k of Object.keys(planCache)) if (planCache[k]?.[sym]) return planCache[k][sym];
  return undefined;
}
function setPlan(sym, port, data) { const p = port || DEFAULT_PORT; (planCache[p] = planCache[p] || {})[sym] = data; }
function deletePlan(sym, port) { const p = port || DEFAULT_PORT; if (planCache[p]) delete planCache[p][sym]; }

function planKey(sym) { return `plan_${sym}`; }
function hasSavedPlan(sym, port) {
  const d = getPlan(sym, port);
  if (!d) return false;
  const hasEntries = d.tranches?.some(tr => (tr.price != null && tr.price !== '') || (tr.cumPct ?? 0) > 0);
  const hasTp = d.trimTranches?.some(t => t.price > 0);
  return !!(hasEntries || hasTp || d.sl || d.note);
}

// ── Plan sheet helpers ────────────────────────────────────────────────────────
function parsePlanTable(table) {
  if (!table?.rows?.length) return {};
  const result = {};
  for (const row of table.rows) {
    const c = row.c || [];
    const sym = c[0]?.v || null;
    if (!sym || sym === 'Symbol') continue; // skip header row
    const tranches = [];
    for (let i = 3; i <= 15; i++) {
      const val = c[i]?.v;
      if (val == null || val === '') { tranches.push({ price: null, dollar: 0, cumPct: 0 }); continue; }
      const parts = String(val).split(':');
      tranches.push({ price: parts[0] ? parseFloat(parts[0]) : null, dollar: parts.length >= 3 ? parseFloat(parts[1]) || 0 : 0, cumPct: parseFloat(parts[parts.length-1]) || 0 });
    }
    while (tranches.length > 0 && tranches[tranches.length-1].price == null && (tranches[tranches.length-1].cumPct ?? 0) === 0) tranches.pop();
    const trimTranches = [16, 17, 18].map(col => {
      const cell = c[col];
      if (!cell || (cell.v == null && !cell.f)) return {};
      // Sheets auto-converts "70:50" → duration numeric. Use formatted string (f) to recover.
      const raw = (typeof cell.v === 'number') ? (cell.f || '') : String(cell.v || '');
      if (!raw) return {};
      const parts = raw.split(/[:/]/);  // handle "70:50:00" (old) or "70/50" (new)
      const price = parseFloat(parts[0]), pct = parseFloat(parts[1]);
      return { price: isNaN(price) ? null : price, pct: isNaN(pct) ? 0 : pct };
    });
    // Portfolio column appended LAST (c[19]) so the positional T/TP indices above are unaffected.
    const port = c[19]?.v || DEFAULT_PORT;
    (result[port] = result[port] || {})[sym] = { tranches, sl: c[1]?.v || null, note: c[2]?.v || '', trimTranches };
  }
  return result;
}

async function loadAllPlansFromSheet() {
  try {
    const res  = await fetch(PLAN_URL);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('(') + 1, text.lastIndexOf(')')));
    planCache = parsePlanTable(json.table);
  } catch(e) { console.error('loadAllPlansFromSheet:', e); }
}

async function savePlanToSheet(sym, tranches, sl, note, trimTranches = [], portfolio = DEFAULT_PORT) {
  const hasAnyReal = tranches.some(t => (t.price != null && t.price !== '') || (t.cumPct ?? 0) > 0);
  const realTrims  = trimTranches.filter(t => t.price > 0 || t.pct > 0);
  if (!hasAnyReal && !sl && !note && !realTrims.length) {
    return clearPlanFromSheet(sym, portfolio);
  }
  const pos     = currentModel?.positions.find(p => p.symbol === sym);
  const td      = getTargetDollar(pos, currentModel);
  const currPct = getCurrentPct(pos, currentModel);
  // Trim trailing blank tranches but preserve blank ones mid-sequence (cleared = executed)
  const writeTranches = [...tranches];
  while (writeTranches.length > 0 && writeTranches[writeTranches.length-1].price == null && (writeTranches[writeTranches.length-1].cumPct ?? 0) === 0) writeTranches.pop();
  const trancheStr = writeTranches.map((t, i) => {
    if ((t.price == null || t.price === '') && (t.cumPct ?? 0) === 0) return '';
    const dollar = getTrancheDollar(i, writeTranches, currPct, td);
    return `${t.price??''}:${dollar.toFixed(2)}:${t.cumPct??0}`;
  }).join(',');
  // Pad trimTranches to 3 slots
  const tp3 = [{},{},{}].map((_, i) => trimTranches[i] || {});
  const params = new URLSearchParams({
    action: 'savePlan', symbol: sym, portfolio, tranches: trancheStr, sl: sl ?? '', note: note ?? '',
    tp1: tp3[0].price ? `${tp3[0].price}/${tp3[0].pct||0}` : '',
    tp2: tp3[1].price ? `${tp3[1].price}/${tp3[1].pct||0}` : '',
    tp3: tp3[2].price ? `${tp3[2].price}/${tp3[2].pct||0}` : '',
  });
  await recordFetch(params, true);
}

async function clearPlanFromSheet(sym, portfolio = DEFAULT_PORT) {
  const params = new URLSearchParams({ action: 'clearPlan', symbol: sym, portfolio });
  await recordFetch(params, true);
}
function getTargetDollar(pos, model) {
  const pending = (planState.symbol === pos?.symbol && planState.pendingTarget != null)
    ? planState.pendingTarget : null;
  return (pending ?? pos?.target ?? 0) * (model?.investable ?? 0);
}
function getCurrentPct(pos, model) { const td = getTargetDollar(pos, model); return td > 0 ? (pos.currentValue ?? 0) / td * 100 : 0; }
function getPrevEndPct(idx, tranches, currPct) { return idx === 0 ? currPct : Math.max(currPct, tranches[idx-1]?.cumPct ?? currPct); }
function getTrancheDollar(idx, tranches, currPct, td) { const prev = getPrevEndPct(idx, tranches, currPct); return Math.max(0, ((tranches[idx]?.cumPct ?? 0) - prev) / 100 * td); }
function trancheColor(i) {
  const stockColor = planState.symbol ? colorFor(planState.symbol) : null;
  const available  = stockColor ? TRANCHE_COLORS.filter(c => c !== stockColor) : TRANCHE_COLORS;
  return available[i % available.length];
}

function calcNewAvg(pos, tranches, upToIdx) {
  const { model } = planState;
  const td = getTargetDollar(pos, model);
  const currPct = getCurrentPct(pos, model);
  let cumCost = pos.costBasis ?? 0, cumShares = pos.qty ?? 0;
  for (let i = 0; i <= upToIdx; i++) {
    const t = tranches[i];
    const dollar = getTrancheDollar(i, tranches, currPct, td);
    if (dollar <= 0) continue;
    if (!t.price || t.price <= 0) return null;
    cumCost  += dollar;
    cumShares += dollar / t.price;
  }
  return cumShares > 0 ? cumCost / cumShares : null;
}

function updateNewAvgs() {
  const { symbol, tranches, model } = planState;
  if (!symbol || !model) return;
  const pos = model.positions.find(p => p.symbol === symbol)
           || (model.sgovPos?.symbol === symbol ? model.sgovPos : null)
           || model.watchlist.find(w => w.symbol === symbol);
  if (!pos) return;
  tranches.forEach((_, i) => {
    const el = document.getElementById(`tranche-avg-${i}`);
    if (!el) return;
    const avg = calcNewAvg(pos, tranches, i);
    let label;
    if (avg != null) {
      const baseAvg = pos.avgPrice ?? 0;
      const diff$ = avg - baseAvg;
      const diffPct = baseAvg > 0 ? diff$ / baseAvg * 100 : 0;
      const up = diff$ >= 0;
      const col = `var(${up ? '--loss' : '--gain'})`;
      const sign = up ? '+' : '';
      label = `New avg: <strong>${fmtUSD(avg)}</strong>`
        + (baseAvg > 0 ? ` <span style="color:${col}">(${sign}${fmtUSD(diff$)} / ${sign}${diffPct.toFixed(2)}%)</span>` : '');
    } else {
      label = `New avg: <span style="color:var(--muted)">— (enter Entry Price)</span>`;
    }
    el.innerHTML = `T${i+1}: ${label}`;
  });
}

window.openPlan = async function(sym) {
  if (!currentModel) return;
  const pos = currentModel.positions.find(p => p.symbol === sym)
           || (currentModel.sgovPos?.symbol === sym ? currentModel.sgovPos : null);
  if (!pos) return;
  // Use cache; if not yet loaded for this symbol, re-fetch sheet
  let data = getPlan(sym);
  if (!data) {
    await loadAllPlansFromSheet();
    data = getPlan(sym);
  }
  const tranches = data?.tranches?.length ? data.tranches : [{ cumPct: 0 }];
  planState = { symbol: sym, name: pos.name || '', tranches, model: currentModel,
                sl: data?.sl ?? null, note: data?.note ?? '' };
  renderPlanModal();
  document.getElementById('planModal').classList.add('open');
};

window.closePlan = function() {
  document.getElementById('planModal')?.classList.remove('open');
  planState = { symbol: null, name: '', tranches: [], model: null, sl: null, note: '' };
};

function renderPlanModal() {
  // If action modal is open and on plan tab, re-render there instead
  if (document.getElementById('actionModal')?.classList.contains('open') && actionModalTab === 'plan') {
    renderActionTabContent(); return;
  }
  const { symbol, name, tranches, model } = planState;
  if (!symbol || !model) return;
  const pos = model.positions.find(p => p.symbol === symbol);
  if (!pos) return;
  const color = colorFor(symbol);
  const td = getTargetDollar(pos, model);
  const currPct = getCurrentPct(pos, model);

  const tranchesHtml = tranches.map((t, i) => {
    const dollar = getTrancheDollar(i, tranches, currPct, td);
    const prev = getPrevEndPct(i, tranches, currPct);
    const warn = (t.cumPct ?? 0) <= prev;
    const c2 = trancheColor(i);
    const dis = tranches.length <= 1 ? 'disabled' : '';
    const entryVal = t.price != null ? t.price : '';
    const currPrice = planState.model?.positions.find(p=>p.symbol===planState.symbol)?.price ?? '';
    const qtyValPm = (entryVal !== '' && dollar > 0) ? +(dollar / parseFloat(entryVal)).toFixed(4) : '';
    return `<div class="tranche-row" data-idx="${i}">
      <div class="tranche-label" style="color:${c2}"><span class="tl-dot" style="background:${c2}"></span>T${i+1}</div>
      <div class="tranche-input-wrap has-prefix">
        <span class="ti-prefix">$</span>
        <input class="tranche-input" type="number" step="any" min="0" placeholder="${currPrice?Number(currPrice).toFixed(2):''}" value="${entryVal}" oninput="onTranchePrice(${i},this.value)" onblur="onTranchePriceBlur()" data-role="entry" title="Entry price" aria-label="Entry price for T${i+1}">
      </div>
      <div class="tranche-input-wrap has-suffix">
        <input class="tranche-input${warn?' warn':''}" type="number" step="any" min="0" value="${(t.cumPct??0).toFixed(2)}" oninput="onTranchePct(${i},this.value)" data-role="pct" title="% of target allocation" aria-label="Target percentage for T${i+1}">
        <span class="ti-suffix">%</span>
      </div>
      <div class="tranche-input-wrap has-prefix">
        <span class="ti-prefix">$</span>
        <input class="tranche-input${warn?' warn':''}" type="number" step="any" min="0" value="${dollar>0?dollar.toFixed(2):'0'}" oninput="onTrancheDollar(${i},this.value)" data-role="dollar" title="Amount to invest" aria-label="Dollar amount for T${i+1}">
      </div>
      <div class="tranche-input-wrap">
        <input class="tranche-input" id="trancheQty_${i}" type="number" step="any" min="0" placeholder="shares" value="${qtyValPm}" oninput="onTrancheQty(${i},this.value)" data-role="qty" title="Shares to buy" aria-label="Share quantity for T${i+1}">
      </div>
      <button class="tranche-clear" onclick="clearTranche(${i})" title="Clear T${i+1}">↺</button>
      <button class="tranche-remove" ${dis} onclick="removeTranche(${i})">×</button>
    </div>
    <div id="tranche-avg-${i}" style="font-size:10px;color:var(--muted);padding:2px 0 8px 52px;margin-top:-4px">T${i+1} after: New avg cost: <span style="color:var(--muted)">— (enter Entry Price)</span></div>`;
  }).join('');

  const lastPrice = pos.price;
  const prePost = (() => {
    const ms = pos.marketState;
    if (ms === 'PRE'  && pos.preMarketPrice)  return `<span style="font-size:10px;color:var(--muted)"> · Pre-mkt ${fmtCurr(pos.preMarketPrice)}</span>`;
    if ((ms === 'POST'||ms === 'CLOSED') && pos.postMarketPrice) return `<span style="font-size:10px;color:var(--muted)"> · After-hrs ${fmtCurr(pos.postMarketPrice)}</span>`;
    return '';
  })();

  const overlay = document.getElementById('planModal');
  overlay.innerHTML = `<div class="plan-modal" onclick="event.stopPropagation()">
    <div class="plan-modal-header">
      ${logoCell(symbol, color)}
      <div class="pm-titles">
        <div class="pm-sym">${symbol}</div>
        <div class="pm-name">${name}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:15px;font-weight:700">${fmtCurr(lastPrice)}</div>
        <div style="font-size:10px;color:var(--muted)">Last Price${prePost}</div>
      </div>
      <button class="pm-close" onclick="closePlan()">×</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      <div>
        <label style="font-size:10px;font-weight:600;color:var(--loss);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">${t('stop_loss_label')}</label>
        <input class="tranche-input" id="planSL" type="number" step="any" min="0"
          value="${planState.sl||''}" placeholder="${t('optional_placeholder')}"
          style="width:100%;${planState.sl?'border-color:var(--loss);background:rgba(220,38,38,.06)':''}">
      </div>
      <div>
        <label style="font-size:10px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">${t('note_label')}</label>
        <input class="tranche-input" id="planNote" type="text"
          value="${planState.note||''}" placeholder="${t('optional_placeholder')}" style="width:100%">
      </div>
    </div>
    <div class="plan-bar-wrap">
      <div class="plan-bar-track" id="planBarTrack"></div>
      <div class="plan-bar-labels" id="planBarLabels"></div>
    </div>
    <div style="display:grid;grid-template-columns:44px 1fr 1fr 1fr 1fr 28px;gap:8px;padding:0 0 6px;border-bottom:1px solid var(--line);margin-bottom:8px">
      <div></div>
      <div style="font-size:10px;font-weight:600;color:var(--muted);text-align:center">Entry Price<div style="font-weight:400;margin-top:1px">Target buy price</div></div>
      <div style="font-size:10px;font-weight:600;color:var(--muted);text-align:center">% of Target<div style="font-weight:400;margin-top:1px">Cumulative goal</div></div>
      <div style="font-size:10px;font-weight:600;color:var(--muted);text-align:center">Amount<div style="font-weight:400;margin-top:1px">$ to invest</div></div>
      <div style="font-size:10px;font-weight:600;color:var(--muted);text-align:center">Qty<div style="font-weight:400;margin-top:1px">Shares to buy</div></div>
      <div></div>
    </div>
    <div id="planTranches">${tranchesHtml}</div>
    <button class="plan-add-btn" onclick="addTranche()">${t('add_tranche_btn')}</button>
    <div class="plan-actions">
      <button class="pa-clear" onclick="clearPlan()">${t('clear_btn')}</button>
      <button class="pa-save" onclick="savePlan()">${t('save_plan_btn')}</button>
    </div>
  </div>`;
  renderPlanBar();
  updateNewAvgs();
}

function renderPlanBar() {
  const { symbol, tranches, model } = planState;
  if (!symbol || !model) return;
  const pos = model.positions.find(p => p.symbol === symbol)
           || (model.sgovPos?.symbol === symbol ? model.sgovPos : null)
           || model.watchlist.find(w => w.symbol === symbol);
  if (!pos) return;
  const td = getTargetDollar(pos, model);
  const currPct = getCurrentPct(pos, model);
  const color = colorFor(symbol);

  const segs = [{ from: 0, to: currPct, color }];
  let prevEnd = currPct;
  tranches.forEach((t, i) => {
    const cum = Math.max(prevEnd, t.cumPct ?? prevEnd);
    if (cum > prevEnd) segs.push({ from: prevEnd, to: cum, color: trancheColor(i) });
    prevEnd = cum;
  });

  const lastEnd = segs[segs.length-1]?.to ?? 100;
  const scaleMax = lastEnd > 100 ? lastEnd * 1.1 : 100;

  const track = document.getElementById('planBarTrack');
  if (!track) return;
  track.innerHTML = segs.map(s => {
    const l = (s.from / scaleMax * 100).toFixed(2);
    const w = ((s.to - s.from) / scaleMax * 100).toFixed(2);
    return `<div class="plan-bar-seg" style="left:${l}%;width:${w}%;background:${s.color}"></div>`;
  }).join('') + `<div class="plan-bar-tick" style="left:${(100/scaleMax*100).toFixed(2)}%" title="Target: ${fmtUSD(td)}"></div>`;

  const labels = [{ color, text: `Current: ${currPct.toFixed(2)}%` }];
  let cumLbl = currPct;
  tranches.forEach((t, i) => {
    const end = Math.max(cumLbl, t.cumPct ?? cumLbl);
    labels.push({ color: trancheColor(i), text: `After T${i+1}: ${end.toFixed(2)}%` });
    cumLbl = end;
  });
  labels.push({ color: 'var(--muted)', text: `Target: ${fmtUSD(td)}` });
  document.getElementById('planBarLabels').innerHTML = labels.map(l =>
    `<span class="pbl-item"><span class="pbl-dot" style="background:${l.color}"></span>${l.text}</span>`
  ).join('');
  updateNewAvgs();
}

// ── Rebalance funding aid (plan-only, no writes) ─────────────────────────────
// Shared panel, embedded in the plan tab, that helps fund ONE active tranche by
// trimming other held positions. rebalFundActiveIdx === null means hidden.
let rebalFundActiveIdx = null;
let rebalFundSells = {}; // { sym: { checked, dollar } }
let rebalFundCashAdd = 0;
let rebalFundSortKey = 'overweight', rebalFundSortDir = -1;

function resetRebalFund() {
  rebalFundActiveIdx = null;
  rebalFundSells = {};
  rebalFundCashAdd = 0;
  rebalFundSortKey = 'overweight';
  rebalFundSortDir = -1;
}

window.setRebalFundActive = function(idx) {
  rebalFundActiveIdx = idx;
  document.querySelectorAll('#planTranches .tranche-row').forEach(row =>
    row.classList.toggle('rebalfund-active', +row.dataset.idx === idx));
  renderRebalFundPanel();
};

function rebalFundTarget() {
  const { symbol, tranches, model } = planState;
  if (rebalFundActiveIdx == null || !model) return null;
  const pos = findPosIn(model, symbol) || findPos(symbol);
  if (!pos) return null;
  const td = getTargetDollar(pos, model);
  const currPct = getCurrentPct(pos, model);
  return getTrancheDollar(rebalFundActiveIdx, tranches, currPct, td);
}

function renderRebalFundPanel() {
  const panel = document.getElementById('rebalFundPanel');
  if (!panel) return;
  const target = rebalFundTarget();
  if (target == null) { panel.style.display = 'none'; panel.innerHTML = ''; return; }
  panel.style.display = '';
  panel.innerHTML = `
    <div class="rebalfund-head">
      <span class="rebalfund-title">${t('rebalfund_title')} T${rebalFundActiveIdx+1}</span>
      <span class="rebalfund-target">${t('rebalfund_target_label')}: <strong>${fmtUSD(target)}</strong></span>
    </div>
    <div class="rebalfund-bar-track"><div class="rebalfund-bar-fill" id="rebalFundBarFill"></div></div>
    <div class="rebalfund-remaining" id="rebalFundRemaining"></div>
    <div class="rebalfund-remaining" id="rebalFundCashProj"></div>
    <div class="rebalfund-cash-row">
      <label class="tx-label">${t('rebalfund_cash_label')}</label>
      <input class="tranche-input" id="rebalFundCash" type="number" step="any" min="0" value="${rebalFundCashAdd || ''}" placeholder="0" oninput="onRebalFundCash(this.value)">
    </div>
    <div id="rebalFundCashWarn" class="rebalfund-warn" style="display:none">${t('rebalfund_cash_warn')}</div>
    <div id="rebalFundSellWrap" style="overflow-x:auto"></div>`;
  renderRebalFundSellTable();
  updateRebalFundBar();
}

function renderRebalFundSellTable() {
  const wrap = document.getElementById('rebalFundSellWrap');
  if (!wrap) return;
  const { symbol, model } = planState;
  const rows = (model?.positions || []).filter(p => p.symbol !== symbol);
  const enriched = rows.map(p => {
    const td = getTargetDollar(p, model);
    const overweight = td > 0 ? getCurrentPct(p, model) - 100 : null;
    return { p, overweight };
  });
  enriched.sort((a, b) => {
    const aChecked = rebalFundSells[a.p.symbol]?.checked ? 1 : 0;
    const bChecked = rebalFundSells[b.p.symbol]?.checked ? 1 : 0;
    if (aChecked !== bChecked) return bChecked - aChecked;
    if (rebalFundSortKey === 'overweight') {
      if (a.overweight == null && b.overweight == null) return 0;
      if (a.overweight == null) return 1;
      if (b.overweight == null) return -1;
      return rebalFundSortDir * (a.overweight - b.overweight);
    }
    return rebalFundSortDir * ((a.p.pnlPct || 0) - (b.p.pnlPct || 0));
  });
  const arrow = key => rebalFundSortKey === key ? (rebalFundSortDir > 0 ? ' ↑' : ' ↓') : '';
  wrap.innerHTML = `<table class="pos-table">
    <thead><tr>
      <th style="cursor:default">${t('th_symbol')}</th>
      <th onclick="sortRebalFundTable('overweight')">${t('rebalfund_overweight_col')}${arrow('overweight')}</th>
      <th onclick="sortRebalFundTable('pnlPct')">${t('total_ret')}${arrow('pnlPct')}</th>
      <th style="cursor:default">${t('rebalfund_sell_col')}</th>
      <th style="cursor:default">${t('rebalfund_dollar_col')}</th>
      <th style="cursor:default">${t('rebalfund_shares_col')}</th>
      <th style="cursor:default">${t('rebalfund_alloc_after_col')}</th>
    </tr></thead>
    <tbody>${enriched.map(({ p, overweight }) => rebalFundSellRow(p, overweight)).join('')}</tbody>
  </table>`;
}

function rebalFundSellRow(p, overweight) {
  const st = rebalFundSells[p.symbol] || (rebalFundSells[p.symbol] = { checked: false, dollar: null });
  const retCls = p.pnlPct >= 0 ? 'cell-up' : 'cell-dn';
  const shares = (st.checked && st.dollar && p.price > 0) ? st.dollar / p.price : 0;
  const model = planState.model;
  const owDollar = overweight == null ? null : p.currentValue - getTargetDollar(p, model);
  const owStr = overweight == null ? '—' : `${fmtPct(overweight)} (${fmtCurr(owDollar)})`;
  const sellDollar = st.checked ? (st.dollar || 0) : 0;
  const stockTotal = (model?.totalCurrent || 0) - (model?.totalCash || 0);
  const allocAfter = stockTotal > 0 ? (p.currentValue - sellDollar) / stockTotal * 100 : 0;
  return `<tr>
    <td><div class="asset-cell">${logoCell(p.symbol, colorFor(p.symbol))}<div class="asset-sym">${p.symbol}</div></div></td>
    <td class="${overweight == null ? 'cell-mut' : ''}">${owStr}</td>
    <td class="${retCls}">${fmtPct(p.pnlPct)}</td>
    <td><input type="checkbox" ${st.checked ? 'checked' : ''} onchange="onRebalFundSellToggle('${p.symbol}', this.checked)" style="width:15px;height:15px;cursor:pointer;accent-color:var(--terracotta)"></td>
    <td><input class="tranche-input" id="rebalFundDollar_${p.symbol}" type="number" step="any" min="0" style="width:100px;text-align:right" value="${st.dollar != null ? st.dollar.toFixed(2) : ''}" ${st.checked ? '' : 'disabled'} oninput="onRebalFundSellDollar('${p.symbol}', this.value)"></td>
    <td id="rebalFundShares_${p.symbol}" style="color:var(--muted)">${shares.toFixed(4)}</td>
    <td id="rebalFundAlloc_${p.symbol}" style="color:var(--muted)">${allocAfter.toFixed(1)}%</td>
  </tr>`;
}

window.onRebalFundSellToggle = function(sym, checked) {
  const model = planState.model;
  const p = model?.positions.find(x => x.symbol === sym);
  const st = rebalFundSells[sym] || (rebalFundSells[sym] = { checked: false, dollar: null });
  st.checked = checked;
  if (checked && p) {
    const target = rebalFundTarget() || 0;
    const fillExcl = (rebalFundCashAdd || 0) + Object.entries(rebalFundSells).reduce((s, [k, v]) =>
      (v.checked && k !== sym) ? s + (v.dollar || 0) : s, 0);
    st.dollar = Math.max(0, Math.min(p.currentValue, target - fillExcl));
  }
  renderRebalFundSellTable();
  updateRebalFundBar();
};

window.onRebalFundSellDollar = function(sym, value) {
  const model = planState.model;
  const p = model?.positions.find(x => x.symbol === sym);
  if (!p) return;
  const st = rebalFundSells[sym] || (rebalFundSells[sym] = { checked: true, dollar: 0 });
  const val = Math.max(0, Math.min(parseFloat(value) || 0, p.currentValue));
  st.dollar = val;
  const inp = document.getElementById('rebalFundDollar_' + sym);
  if (inp && parseFloat(inp.value) !== val) inp.value = val.toFixed(2);
  const sharesEl = document.getElementById('rebalFundShares_' + sym);
  if (sharesEl) sharesEl.textContent = (p.price > 0 ? val / p.price : 0).toFixed(4);
  const allocEl = document.getElementById('rebalFundAlloc_' + sym);
  const stockTotal = (model?.totalCurrent || 0) - (model?.totalCash || 0);
  if (allocEl) allocEl.textContent = (stockTotal > 0 ? (p.currentValue - val) / stockTotal * 100 : 0).toFixed(1) + '%';
  updateRebalFundBar();
};

window.onRebalFundCash = function(value) {
  rebalFundCashAdd = Math.max(0, parseFloat(value) || 0);
  updateRebalFundBar();
};

window.sortRebalFundTable = function(key) {
  if (rebalFundSortKey === key) rebalFundSortDir *= -1; else { rebalFundSortKey = key; rebalFundSortDir = -1; }
  renderRebalFundSellTable();
};

function updateRebalFundBar() {
  const target = rebalFundTarget();
  if (target == null) return;
  const sellTotal = Object.entries(rebalFundSells).reduce((s, [, st]) => st.checked ? s + (st.dollar || 0) : s, 0);
  const filled = (rebalFundCashAdd || 0) + sellTotal;
  const pct = target > 0 ? Math.min(100, filled / target * 100) : 0;
  const remaining = Math.max(0, target - filled);
  const surplus = Math.max(0, filled - target);
  const fillEl = document.getElementById('rebalFundBarFill');
  if (fillEl) fillEl.style.width = pct.toFixed(2) + '%';
  const remEl = document.getElementById('rebalFundRemaining');
  if (remEl) remEl.innerHTML = surplus > 0
    ? `<span class="rebalfund-surplus">+${fmtUSD(surplus)} ${t('rebalfund_over_label')}</span>`
    : `<span>${t('rebalfund_remaining_label')}: <strong>${fmtUSD(remaining)}</strong></span>`;
  const warnEl = document.getElementById('rebalFundCashWarn');
  if (warnEl) warnEl.style.display = (rebalFundCashAdd || 0) > (planState.model?.totalCash || 0) ? 'block' : 'none';
  const model = planState.model;
  const projCash = (model?.totalCash || 0) + sellTotal - (rebalFundCashAdd || 0);
  const projCashPct = model?.totalCurrent > 0 ? projCash / model.totalCurrent * 100 : 0;
  const cashProjEl = document.getElementById('rebalFundCashProj');
  if (cashProjEl) cashProjEl.innerHTML = `<span>${t('rebalfund_cash_after_label')}: <strong>${fmtCurr(projCash)}</strong> (${projCashPct.toFixed(1)}%)</span>`;
}

function sortTranchesByPrice() {
  planState.tranches.sort((a, b) => {
    if (a.price == null && b.price == null) return 0;
    if (a.price == null) return 1;
    if (b.price == null) return -1;
    return b.price - a.price;
  });
}

window.onTranchePriceBlur = function() {
  sortTranchesByPrice();
  renderPlanModal();
};

window.onTranchePrice = function(idx, val) {
  const num = parseFloat(val);
  planState.tranches[idx].price = isNaN(num) ? null : num;
  updateNewAvgs();
  updateActionTvLines();
  // Update qty display for this row based on current dollar amount
  const qIn = document.getElementById(`trancheQty_${idx}`);
  if (qIn && document.activeElement !== qIn) {
    const { symbol, tranches, model } = planState;
    const pos = model.positions.find(p => p.symbol === symbol)
             || (model.sgovPos?.symbol === symbol ? model.sgovPos : null)
             || model.watchlist.find(w => w.symbol === symbol);
    if (pos) {
      const td = getTargetDollar(pos, model);
      const currPct = getCurrentPct(pos, model);
      const dollar = getTrancheDollar(idx, tranches, currPct, td);
      qIn.value = (!isNaN(num) && num > 0 && dollar > 0) ? +(dollar / num).toFixed(4) : '';
    }
  }
};

window.onTranchePct = function(idx, val) {
  const num = parseFloat(val); if (isNaN(num)) return;
  planState.tranches[idx].cumPct = num;
  syncTrancheRow(idx);
  renderPlanBar();
};

window.onTrancheDollar = function(idx, val) {
  const dollar = parseFloat(val); if (isNaN(dollar)) return;
  const { symbol, tranches, model } = planState;
  const pos = model.positions.find(p => p.symbol === symbol)
           || (model.sgovPos?.symbol === symbol ? model.sgovPos : null)
           || model.watchlist.find(w => w.symbol === symbol);
  if (!pos) return;
  const td = getTargetDollar(pos, model);
  const currPct = getCurrentPct(pos, model);
  const prev = getPrevEndPct(idx, tranches, currPct);
  planState.tranches[idx].cumPct = td > 0 ? prev + (dollar / td * 100) : prev;
  syncTrancheRow(idx);
  renderPlanBar();
  if (idx === rebalFundActiveIdx) updateRebalFundBar();
};

window.onTrancheQty = function(idx, val) {
  const qty = parseFloat(val); if (isNaN(qty) || qty <= 0) return;
  const { symbol, tranches, model } = planState;
  const pos = model.positions.find(p => p.symbol === symbol)
           || (model.sgovPos?.symbol === symbol ? model.sgovPos : null)
           || model.watchlist.find(w => w.symbol === symbol);
  if (!pos) return;
  const price = tranches[idx]?.price || 0;
  if (price <= 0) return;
  const dollar = qty * price;
  const td = getTargetDollar(pos, model);
  const currPct = getCurrentPct(pos, model);
  const prev = getPrevEndPct(idx, tranches, currPct);
  planState.tranches[idx].cumPct = td > 0 ? prev + (dollar / td * 100) : prev;
  syncTrancheRow(idx);
  renderPlanBar();
  updateNewAvgs();
};

function syncTrancheRow(idx) {
  const { symbol, tranches, model } = planState;
  const pos = model.positions.find(p => p.symbol === symbol)
           || (model.sgovPos?.symbol === symbol ? model.sgovPos : null)
           || model.watchlist.find(w => w.symbol === symbol);
  if (!pos) return;
  const td = getTargetDollar(pos, model);
  const currPct = getCurrentPct(pos, model);
  const active = document.activeElement;
  for (let j = idx; j < tranches.length; j++) {
    const row = document.querySelector(`.tranche-row[data-idx="${j}"]`); if (!row) continue;
    const dIn = row.querySelector('[data-role="dollar"]');
    const pIn = row.querySelector('[data-role="pct"]');
    const qIn = document.getElementById(`trancheQty_${j}`);
    const t = tranches[j];
    const prev = getPrevEndPct(j, tranches, currPct);
    const dollar = Math.max(0, ((t.cumPct ?? 0) - prev) / 100 * td);
    const warn = (t.cumPct ?? 0) <= prev;
    if (active !== dIn) dIn.value = dollar > 0 ? dollar.toFixed(2) : '0';
    if (active !== pIn) pIn.value = (t.cumPct ?? 0).toFixed(2);
    if (qIn && active !== qIn) {
      const price = t.price || 0;
      qIn.value = (price > 0 && dollar > 0) ? +(dollar / price).toFixed(4) : '';
    }
    dIn.classList.toggle('warn', warn); pIn.classList.toggle('warn', warn);
  }
}

window.addTranche = function() {

window.removeTranche = function(idx) {

// ── Utilities ─────────────────────────────────────────────────────────────────
// Yahoo Finance uses BRK-B style, portfolio sheet uses BRK.B
const yahooTicker = s => s.replace(/\./g, '-');
// Display dates as DD-MM-YYYY
const fmtDate = d => d ? d.split('-').reverse().join('-') : '—';
const fmt    = n => n == null ? '—' : n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2});
const fmtPct = (n, plus=true) => n == null ? '—' : (plus && n >= 0 ? '+' : '') + n.toFixed(2) + '%';
const css    = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function fmtCurr(n) {
  if (n == null) return '—';
  if (currency === 'THB') return '฿' + Math.round(n * fxRate).toLocaleString('en-US');
  return n.toLocaleString('en-US', {style:'currency', currency:'USD', maximumFractionDigits:2});
}
function fmtUSD(n) {
  if (n == null) return '—';
  return n.toLocaleString('en-US', {style:'currency', currency:'USD', maximumFractionDigits:2});
}
function fmtCompact(n) {
  if (n == null) return '—';
  if (Math.abs(n) >= 1e12) return '$' + (n / 1e12).toFixed(1) + 'T';
  if (Math.abs(n) >= 1e9) return '$' + (n / 1e9).toFixed(1) + 'B';
  if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
  if (Math.abs(n) >= 1e3) return '$' + (n / 1e3).toFixed(0) + 'K';
  return '$' + n.toFixed(0);
}
function fmtVol(n) {
  if (n == null) return '—';
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
  return n.toString();
}

// ── Data fetching ─────────────────────────────────────────────────────────────
async function fetchSheet() {

// ── Portfolios registry ───────────────────────────────────────────────────────
const DEFAULT_PORT = 'Long-Term';
// Used pre-migration (no Portfolios sheet) so the app still loads as a single portfolio.
const _fallbackRegistry = () => [{ id: DEFAULT_PORT, name: DEFAULT_PORT, color: '#4ade80', cash: 0, cashRes: 0, fcd: 0, usd: 0, _fallback: true }];

async function fetchPortfolios() {
  if (!PORTFOLIOS_URL) return _fallbackRegistry();
  try {
    const res  = await fetch(PORTFOLIOS_URL);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('(') + 1, text.lastIndexOf(')')));
    const table = json.table;
    const idx = {};
    table.cols.forEach((c, i) => { if (c.label) { idx[c.label.trim()] = i; idx[c.label.trim().toLowerCase()] = i; } });
    const cell = (row, label) => { const i = idx[label] ?? idx[label.toLowerCase()]; if (i == null) return null; const c = row.c[i]; return c == null ? null : c.v; };
    const out = table.rows.map(r => ({
      id:      cell(r, 'id') ?? cell(r, 'Name'),
      name:    cell(r, 'Name'),
      color:   cell(r, 'Color') || '#4ade80',
      cash:    Number(cell(r, 'Cash')) || 0,
      cashRes: Number(cell(r, 'CashReserves')) || 0,
      fcd:     Number(cell(r, 'FCD')) || 0,
      usd:     Number(cell(r, 'USD')) || 0,
    })).filter(p => p.name);
    return out.length ? out : _fallbackRegistry();
  } catch (e) { console.error('fetchPortfolios:', e); return _fallbackRegistry(); }
}

// Registry row for a portfolio name (falls back to first row / zeros).
function _portRow(portId) {
  return _portfolioRegistry.find(p => p.name === portId) || _portfolioRegistry[0] || _fallbackRegistry()[0];
}

// Cash context fed into buildModel. Single port → its row; ALL → summed cash/fcd/usd + Long-Term's reserve %.
function cashCtxFor(portId) {
  if (portId === 'ALL') {
    const sum = _portfolioRegistry.reduce((a, p) => ({ cash: a.cash + p.cash, fcd: a.fcd + p.fcd, usd: a.usd + p.usd }), { cash: 0, fcd: 0, usd: 0 });
    const lt = _portfolioRegistry.find(p => p.name === DEFAULT_PORT);
    return { cash: sum.cash, fcd: sum.fcd, usd: sum.usd, cashRes: lt?.cashRes ?? (_portfolioRegistry[0]?.cashRes ?? 0) };
  }
  if (portId === 'ETF') return _portRow(DEFAULT_PORT);
  const r = _portRow(portId);
  return { cash: r.cash, fcd: r.fcd, usd: r.usd, cashRes: r.cashRes };
}

// Transfer-Out / Transfer-In rows move shares between portfolios with no realized P&L.
function isTransfer(tx) { const ty = (tx?.type || '').toLowerCase(); return ty === 'transfer-out' || ty === 'transfer-in'; }

// Slice the master tx list for a view. Single port → its rows; ALL → all rows.
function filterTxForView(allTx, portId) {
  if (!allTx) return null;
  if (portId === 'ALL') return allTx;
  return allTx.filter(t => (t.portfolio || DEFAULT_PORT) === portId);
}

// Default portfolio for a new transaction/plan on `sym`: the active port, or (in ALL) the
// portfolio holding the most of that symbol, else Long-Term.
function defaultPortFor(sym) {
  if (activePortfolio !== 'ALL') return activePortfolio;
  let best = null, bestQty = -1;
  for (const r of _allRows) {
    if (r.symbol !== sym) continue;
    const q = Number(r.qty) || 0;
    if (q > bestQty) { bestQty = q; best = r.portfolio || DEFAULT_PORT; }
  }
  return best || DEFAULT_PORT;
}

function parseRows(table) {
  const idx = {};
  table.cols.forEach((c, i) => {
    if (c.label) {
      idx[c.label.trim()]                  = i; // exact (trimmed)
      idx[c.label.trim().toLowerCase()]    = i; // lowercase fallback
    }
  });
  const cell = (row, label) => {
    const i = idx[label] ?? idx[label.trim()] ?? idx[label.toLowerCase()];
    if (i == null) return null;
    const c = row.c[i];
    return c == null ? null : c.v;
  };
  return table.rows.map(r => ({
    portfolio: cell(r, "Portfolio") || DEFAULT_PORT,
    symbol:   cell(r, "Symbol"),
    name:     cell(r, "Name"),
    sector:   cell(r, "Sector"),
    industry: cell(r, "Industry"),
    category: cell(r, "Category"),
    qty:      cell(r, "Qty"),
    avgPrice: cell(r, "Avg price"),
    target:   cell(r, "Target Allocation"),
    price:    cell(r, "Current price"),
    marketCap: cell(r, "Market Cap"),
    cash:     cell(r, "Cash"),
    cashRes:  cell(r, "Cash Reserves"),
    fcd:      cell(r, "FCD"),
    usd:      cell(r, "USD"),
  })).filter(r => r.symbol);
}

// Slice _allRows for the active view. Single port → filter; ALL → merge same-symbol rows
// (sum qty, sum cost basis, weighted avg). Keeps Long-Term's target on the merged row.
function rowsForView(portId) {
  if (portId !== 'ALL') {
    // Price/metadata are per-SYMBOL (Current price is a sheet formula on each row). A row added by a
    // transfer may lack them, so borrow from any other portfolio's row for the same symbol.
    const fill = {};
    for (const r of _allRows) {
      const f = fill[r.symbol] || (fill[r.symbol] = {});
      ['price','name','sector','industry','marketCap'].forEach(k => { if (f[k] == null && r[k] != null && r[k] !== '') f[k] = r[k]; });
    }
    return _allRows.filter(r => (r.portfolio || DEFAULT_PORT) === portId).map(r => {
      const f = fill[r.symbol] || {};
      return {
        ...r,
        price:    r.price    != null && r.price    !== '' ? r.price    : (f.price    ?? null),
        name:     r.name     != null && r.name     !== '' ? r.name     : (f.name     ?? r.name),
        sector:   r.sector   != null && r.sector   !== '' ? r.sector   : (f.sector   ?? r.sector),
        industry: r.industry != null && r.industry !== '' ? r.industry : (f.industry ?? r.industry),
        marketCap: r.marketCap != null && r.marketCap !== '' ? r.marketCap : (f.marketCap ?? null),
      };
    });
  }
  const bySym = new Map();
  for (const r of _allRows) {
    const g = bySym.get(r.symbol) || { rows: [] };
    g.rows.push(r);
    bySym.set(r.symbol, g);
  }
  const merged = [];
  for (const [symbol, g] of bySym) {
    let sumQty = 0, sumCost = 0;
    for (const r of g.rows) {
      const q = Number(r.qty) || 0, a = Number(r.avgPrice) || 0;
      sumQty += q;
      if (q > 0 && a > 0) sumCost += q * a;
    }
    const ltRow   = g.rows.find(r => (r.portfolio || DEFAULT_PORT) === DEFAULT_PORT);
    const pick    = (field) => { const r = g.rows.find(x => x[field] != null && x[field] !== ''); return r ? r[field] : null; };
    const tgtRow  = ltRow && ltRow.target != null ? ltRow : g.rows.find(r => r.target != null);
    merged.push({
      portfolio: 'ALL',
      symbol,
      name:     pick('name'),
      sector:   pick('sector'),
      industry: pick('industry'),
      category: pick('category'),
      qty:      sumQty,
      avgPrice: sumQty > 0 ? sumCost / sumQty : (pick('avgPrice') ?? null),
      target:   tgtRow ? tgtRow.target : null,
      price:    pick('price'),
      marketCap: pick('marketCap'),
    });
  }
  return merged;
}

// `rows` are already the active-portfolio slice (see rowsForView). Cash comes from cashCtx (registry),
// not rows[0] — falls back to rows[0] only when cashCtx is omitted (defensive).
function buildModel(rows, cashCtx) {
  const rawCash    = cashCtx?.cash    ?? rows[0]?.cash    ?? 0;
  const cashResPct = cashCtx?.cashRes ?? rows[0]?.cashRes ?? 0;
  const rawFcd     = cashCtx?.fcd     ?? rows[0]?.fcd     ?? 0;
  const rawUsd     = cashCtx?.usd     ?? rows[0]?.usd     ?? 0;
  const positions = [], watchlist = [];

  for (const r of rows) {
    const held = r.qty != null && r.qty > 0 && r.avgPrice != null && r.avgPrice > 0 && r.price != null;
    if (!held) { if (r.price != null || (!(r.qty > 0) && !(r.avgPrice > 0))) watchlist.push(r); continue; }
    const currentValue = r.qty * r.price;
    const costBasis    = r.qty * r.avgPrice;
    const pnl          = currentValue - costBasis;
    const pnlPct       = costBasis ? pnl / costBasis * 100 : 0;
    positions.push({ ...r, currentValue, costBasis, pnl, pnlPct });
  }

  const totalCash     = rawCash;
  const totalCurrent  = positions.reduce((s, p) => s + p.currentValue, 0) + totalCash;
  const totalInvested  = positions.reduce((s, p) => s + p.costBasis,    0) + rawCash;
  const investable    = totalCurrent * (1 - cashResPct);
  const stockTotal = positions.reduce((s,p) => s + p.currentValue, 0);
  positions.forEach(p => {
    p.weightPct      = totalCurrent > 0 ? p.currentValue / totalCurrent * 100 : 0;
    p.stockWeightPct = stockTotal  > 0 ? p.currentValue / stockTotal   * 100 : 0;
  });
  positions.sort((a, b) => b.currentValue - a.currentValue);
  positions.forEach((p, i) => p.rowNum = i + 1);

  return {
    positions, watchlist, sgovPos: null, rawCash, rawFcd, rawUsd, cashResPct,
    totalCash, totalCurrent, investable, totalInvested,
    totalPnl:    totalCurrent - totalInvested,
    totalPnlPct: totalInvested ? (totalCurrent - totalInvested) / totalInvested * 100 : 0,
  };
}

// ── Stat helpers ──────────────────────────────────────────────────────────────
function sharesHeldAt(txs, ticker, dateStr) {
  let held = 0;
  for (const t of txs) {
    if (t.ticker !== ticker || t.dateStr > dateStr) continue;
    const ty = (t.type||'').toLowerCase();
    if (ty === 'buy'  || ty === 'transfer-in')  held += Number(t.shares) || 0;
    if (ty === 'sell' || ty === 'transfer-out') held -= Number(t.shares) || 0;
  }
  return Math.max(0, held);
}

// Per-ticker withholding tax — Danish ADRs = 27%, default = 15%
const WITHHOLDING_TAX = { NVO: 0.27, NOVO: 0.27 };
const withholdingRate = ticker => WITHHOLDING_TAX[ticker] ?? 0.15;

function computeDividends(txs) {
  if (!txs?.length) return { gross: 0, net: 0, byTicker: {} };
  const divData = historyCache?.dividends || {};
  let gross = 0, net = 0;
  const byTicker = {};
  for (const [ticker, events] of Object.entries(divData)) {
    for (const [dateStr, amount] of Object.entries(events)) {
      const held = sharesHeldAt(txs, ticker, dateStr);
      if (held <= 0) continue;
      const total = held * amount;
      const totalNet = total * (1 - withholdingRate(ticker));
      gross += total;
      net   += totalNet;
      byTicker[ticker] = (byTicker[ticker] || 0) + totalNet;
    }
  }
  return { gross, net, byTicker };
}

// Money-weighted annualized return (XIRR) on invested capital.
// Folds in realized P&L, dividends, and unrealized gains by construction.
// Flows (dated): Buy = -outflow, Sell = +inflow, Transfer-Out = +inflow,
//   Transfer-In = -outflow, net Dividend = +inflow (per historyCache event,
//   withholding-adjusted, matching computeDividends), terminal = holdingsValue today.
function computeIRR(txs, holdingsValue) {
  _irrDetail = null;
  if (!txs?.length) return null;
  const YEAR = 365 * 24 * 3600 * 1000;
  const flows = [];
  let invested = 0, proceeds = 0, transfersNet = 0;
  for (const tx of txs) {
    if (!tx.ticker || !tx.dateStr) continue;
    const d  = new Date(tx.dateStr).getTime();
    if (!Number.isFinite(d)) continue;
    const sh = tx.shares || 0, px = tx.price || 0;
    const tv = tx.tradeValue != null ? tx.tradeValue : sh * px;
    if      (tx.type === 'Buy')          { flows.push({ d, amt: -tv }); invested += tv; }
    else if (tx.type === 'Sell')         { flows.push({ d, amt:  tv }); proceeds += tv; }
    else if (tx.type === 'Transfer-Out') { flows.push({ d, amt:  tv }); transfersNet += tv; }
    else if (tx.type === 'Transfer-In')  { flows.push({ d, amt: -tv }); transfersNet -= tv; }
    // 'Dividend' tx type intentionally ignored — dividends sourced below.
  }
  // Dated net dividends — same source/withholding as computeDividends().
  const divData = historyCache?.dividends || {};
  let divTotal = 0;
  for (const [ticker, events] of Object.entries(divData)) {
    for (const [dateStr, amount] of Object.entries(events)) {
      const held = sharesHeldAt(txs, ticker, dateStr);
      if (held <= 0) continue;
      const d = new Date(dateStr).getTime();
      if (!Number.isFinite(d)) continue;
      const amt = held * amount * (1 - withholdingRate(ticker));
      flows.push({ d, amt });
      divTotal += amt;
    }
  }
  if (!flows.length) return null;
  flows.push({ d: Date.now(), amt: holdingsValue || 0 });

  const t0   = Math.min(...flows.map(f => f.d));
  const tEnd = Math.max(...flows.map(f => f.d));
  if (tEnd <= t0) return null;
  if (!flows.some(f => f.amt < 0) || !flows.some(f => f.amt > 0)) return null;

  const npv = r => flows.reduce((s, f) => s + f.amt / Math.pow(1 + r, (f.d - t0) / YEAR), 0);

  const done = r => {
    _irrDetail = { invested, proceeds, dividends: divTotal, transfersNet, terminal: holdingsValue || 0, firstDateMs: t0, years: (Date.now() - t0) / YEAR, rate: r };
    return r;
  };

  let lo = -0.9999, hi = 100, fLo = npv(lo), fHi = npv(hi);
  if (fLo === 0) return done(lo * 100);
  if (fHi === 0) return done(hi * 100);
  if (fLo * fHi > 0) return null; // no sign change → no root in range
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2, fMid = npv(mid);
    if (Math.abs(fMid) < 1e-7 || (hi - lo) < 1e-12) return done(mid * 100);
    if (fLo * fMid < 0) { hi = mid; fHi = fMid; } else { lo = mid; fLo = fMid; }
  }
  return done(((lo + hi) / 2) * 100);
}

function computeRealizedPnlTotal(txs) {
  return computePnLTimeline(txs).reduce((s, t) => s + t.pnl, 0);
}

// ── Render: stat cards (replaces hero) ────────────────────────────────────────
function renderStatCards(model, txData) {
  document.getElementById('irrBreakdown')?.classList.remove('open');
  if (!model) return;
  if (txData) lastTxData = txData;
  const td = txData || lastTxData || {};

  const allForDay = [...model.positions, ...(model.sgovPos ? [model.sgovPos] : [])];
  let dayChange$ = 0, dayHasData = false;
  for (const p of allForDay) {
    if (p.dayChange != null) { dayChange$ += p.dayChange * p.qty; dayHasData = true; }
  }
  const dayBase = allForDay.filter(p => p.dayChange != null).reduce((s, p) => s + p.currentValue, 0);
  const dayPct = (dayHasData && dayBase) ? dayChange$ / dayBase * 100 : null;

  const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  const m = (v, plus=true) => v == null ? '—' : (plus && v >= 0 ? '+' : '') + fmtCurr(v);
  const p = (v, plus=true) => v == null ? '—' : (plus && v >= 0 ? '+' : '') + v.toFixed(2) + '%';
  const cl = v => v == null ? 'mut' : v >= 0 ? 'up' : 'down';

  const realized = td.realizedPnl ?? null;
  const div = td.dividends || null;
  const irr = td.irr ?? null;
  const totalRet = model.totalPnl + (realized ?? 0) + (div?.net ?? 0);
  const totalRetPct = model.totalInvested ? totalRet / model.totalInvested * 100 : 0;

  const stocksVal = model.totalCurrent - model.totalCash;
  const portValPct = stocksVal > 0 ? model.totalPnl / stocksVal * 100 : 0;
  set('sc-portVal', `<div class="sc-label">${t('port_val')}</div>
    <div class="sc-value">${fmtCurr(model.totalCurrent)}</div>
    <div class="sc-sub ${cl(model.totalPnl)}">${m(model.totalPnl)}  ${p(portValPct)}</div>
    <div class="sc-detail"><span style="display:inline-block">${t('invested')}: ${fmtCurr(stocksVal)} ·&nbsp;</span><span style="display:inline-block">${model.positions.length} ${t('holdings')}</span></div>`);

  const retLabel = [model.totalPnl !== 0 ? t('unrealized') : null, realized != null ? t('realized') : null, div?.net ? t('dividends') : null].filter(Boolean).join(' + ') || t('unrealized');
  set('sc-totalRet', `<div class="sc-label">${t('total_ret')}</div>
    <div class="sc-value ${cl(totalRet)}">${m(totalRet)}</div>
    <div class="sc-sub ${cl(totalRetPct)}">${p(totalRetPct)}</div>
    <div class="sc-detail">${retLabel}</div>`);

  set('sc-dayRet', `<div class="sc-label">${t('day_ret')}</div>
    <div class="sc-value ${cl(dayChange$)}">${dayHasData ? m(dayChange$) : '—'}</div>
    <div class="sc-sub ${cl(dayPct)}">${dayHasData ? p(dayPct) : '—'}</div>
    <div class="sc-detail">${t('today_change')}</div>`);

  set('sc-irr', `<div class="sc-label" style="display:flex;align-items:center;gap:4px">${t('irr')}${irr == null ? '' : `<span class="irr-info-wrap"><button class="irr-info-btn" aria-label="${t('irr_breakdown_aria')}" onclick="toggleIrrBreakdown(event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="13" height="13"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button></span>`}</div>
    <div class="sc-value ${cl(irr)}">${irr == null ? '—' : p(irr)}</div>
    <div class="sc-sub mut">${t('since_first_buy')}</div>
    <div class="sc-detail">${irr == null ? t('loading_msg') : t('cagr_approx')}</div>`);

  const cashPct = model.totalCurrent > 0 ? model.totalCash / model.totalCurrent * 100 : 0;
  set('sc-cash', `

    </div>
    <div class="sc-value">${fmtCurr(model.totalCash)}</div>
    <div class="sc-sub mut"><span style="display:inline-block">${cashPct.toFixed(1)}% ·&nbsp;</span><span style="display:inline-block">${t('target')} ${((model.cashResPct||0)*100).toFixed(0)}%</span></div>
    <div class="sc-detail">${t('fcd_label')}: ${fmtCurr(model.rawFcd||0)} · ${t('usd_label')}: ${fmtCurr(model.rawUsd||0)}</div>`);

  set('sc-unreal', `<div class="sc-label">${t('unrealized')}</div>
    <div class="sc-value ${cl(model.totalPnl)}">${m(model.totalPnl)}</div>

    <div class="sc-value ${cl(realized)}">${realized == null ? '—' : m(realized)}</div>

    <div class="sc-detail">${t('withholding_tax')}</div>`);
