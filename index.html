function _showToast(msg, duration = 3500) {
  let toast = document.getElementById('globalToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'globalToast';
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:var(--z-tooltip);opacity:0;transition:opacity .25s,transform .25s var(--ease-out-quint);pointer-events:none;white-space:nowrap';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  toast.style.transform = 'translate(-50%,0)';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translate(-50%,8px)'; }, duration);
}

function _showReadOnlyMsg() {
  const openOverlay = document.querySelector('.tx-overlay.open, .plan-overlay.open');
  if (openOverlay) {
    let msg = openOverlay.querySelector('.ro-inline-msg');
    if (!msg) {
      msg = document.createElement('div');
      msg.className = 'ro-inline-msg';
      msg.style.cssText = 'font-size:12px;color:var(--loss);text-align:center;padding:8px 12px;background:rgba(196,106,74,.1);border-radius:6px;margin-top:10px';
      msg.textContent = 'Read-only access — open Edit config to add Level 2 credentials and enable saving.';
      const modal = openOverlay.querySelector('.tx-modal, .plan-modal');
      if (modal) modal.appendChild(msg);
    }
    msg.style.display = 'block';
    clearTimeout(msg._t);
    msg._t = setTimeout(() => { msg.style.display = 'none'; }, 5000);
  } else {
    _showToast('Read-only — edit config to enable saving.');
  }
}

async function recordFetch(params, needsResponse = false) {
  if (isReadOnly()) { _showReadOnlyMsg(); return needsResponse ? null : undefined; }
  const p = params instanceof URLSearchParams ? params : new URLSearchParams(params);
  p.set('key', _WRITE_KEY);
  const url = `${RECORD_URL}?${p}`;
  if (needsResponse) {
    try { const r = await fetch(url); if (r.ok) return await r.json(); } catch (_) {}
    try { await fetch(url, { mode: 'no-cors' }); } catch (_) {}
    return null;
  }
  try { await fetch(url, { mode: 'no-cors' }); } catch (_) {}
}

  if (sab) sab.style.display = t === 'Sell' ? 'inline' : 'none';

function updateTxAllocationBars(shares, price) {
  const barsEl = document.getElementById('txAllocBars');
  if (!barsEl || !currentModel) return;
  const tickerEl = document.getElementById('txTicker');
  const sym = tickerEl?.value === '__custom__'
    ? (document.getElementById('txTickerCustom')?.value?.trim()?.toUpperCase() || '')
    : (tickerEl?.value || '');
  if (!sym || sym === '__custom__') { barsEl.innerHTML = ''; return; }

  const pos       = currentModel.positions.find(p => p.symbol === sym)
                 || (currentModel.sgovPos?.symbol === sym ? currentModel.sgovPos : null);
  const currValue = pos?.currentValue ?? 0;
  const isSell    = txType === 'Sell';
  const tradeVal  = shares * price;
  const addValue  = isSell ? -Math.min(tradeVal, currValue) : tradeVal;
  const newValue  = Math.max(0, currValue + addValue);
  const currTotal = currentModel.totalCurrent;
  const newTotal  = isSell ? currTotal : currTotal + tradeVal; // sell: cash absorbs, total same
  const investable = currentModel.investable;
  const target    = pos?.target != null ? pos.target * 100 : null;
  const targetAmt = target != null ? (pos.target * investable) : null;

  const currW = currTotal > 0 ? currValue / currTotal * 100 : 0;
  const newW  = newTotal  > 0 ? newValue  / newTotal  * 100 : 0;
  const color = colorFor(sym);

  // Bar 1: weight bar (current → projected)
  const scaleW  = Math.max(newW, currW, target ?? 0, 1);
  const bar = (val, opacity='1') => `<div style="position:absolute;left:0;top:0;height:100%;width:100%;transform:scaleX(${Math.min(val/scaleW,1).toFixed(4)});transform-origin:left;background:${color};opacity:${opacity};border-radius:4px;transition:transform .3s var(--ease-out-quint)"></div>`;
  const tick = pct => pct != null ? `<div style="position:absolute;top:-3px;height:12px;width:2px;background:var(--ink);opacity:.7;left:${Math.min(pct/scaleW*100,100).toFixed(1)}%;border-radius:1px"></div>` : '';

  // Bar 2: vs target (0–100% of target)
  const tBar = target != null ? (() => {
    const currPT = target > 0 ? Math.min(currValue/(targetAmt||1)*100, 150) : 0;
    const newPT  = target > 0 ? Math.min(newValue /(targetAmt||1)*100, 150) : 0;
    const scaleT = Math.max(newPT, currPT, 100);
    const needMore = addValue > 0 ? targetAmt - newValue : targetAmt - currValue;
    const msg = currValue >= (targetAmt??0)
      ? `<span style="color:#a8762a">Overweight ${fmtCurr(currValue-(targetAmt??0))}</span>`
      : addValue > 0 && newValue >= (targetAmt??0)
        ? `<span style="color:var(--gain)">${t('reaches_target_msg')}</span>`
        : `<span>${t('still_need_msg')} ${fmtCurr(Math.max(0,needMore))} ${t('to_reach_target_msg')}</span>`;
    return `<div style="margin-top:8px">
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:3px">
        <span>vs Target (${target.toFixed(1)}% · ${fmtCurr(targetAmt)})</span>
        ${tradeVal>0?`<span style="color:${isSell?'var(--loss)':color};font-weight:600">${(newValue/(targetAmt||1)*100).toFixed(0)}% of target</span>`:''}
      </div>
      <div style="position:relative;height:6px;background:var(--line);border-radius:4px;overflow:hidden">
        ${bar(currPT,'0.35')}${tradeVal>0?bar(newPT):''}
        <div style="position:absolute;top:-3px;height:12px;width:2px;background:var(--ink);opacity:.7;left:${(100/scaleT*100).toFixed(1)}%;border-radius:1px"></div>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:3px">${msg}</div>
    </div>`;
  })() : '';

  // Determine if new weight exceeds target (show red overflow)
  const overTarget  = target != null && newW > target;
  const barNewColor = overTarget ? 'var(--loss)' : (isSell ? 'var(--loss)' : color);

  // Bar 1: portfolio weight bar with split (normal fill + red overflow)
  const scaleW2 = Math.max(newW, currW, target ?? 0, 1);
  const barSeg  = (pct, col, opacity='1') =>
    `<div style="position:absolute;left:0;top:0;height:100%;width:100%;transform:scaleX(${Math.min(pct/scaleW2,1).toFixed(4)});transform-origin:left;background:${col};opacity:${opacity};border-radius:4px;transition:transform .3s var(--ease-out-quint)"></div>`;
  const tickMark = pct => pct != null
    ? `<div style="position:absolute;top:-3px;height:12px;width:2px;background:var(--ink);opacity:.7;left:${Math.min(pct/scaleW2*100,100).toFixed(1)}%;border-radius:1px"></div>`
    : '';

  // current value / new value display
  const valueRow = `<div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:6px">
    <div><span style="color:var(--muted)">Current </span><span style="font-weight:600">${fmtCurr(currValue)}</span> <span style="color:var(--muted);font-size:9px">(${currW.toFixed(1)}%)</span></div>
    ${tradeVal>0?`<div><span style="color:var(--muted)">${isSell?'After sell ':'After buy '}</span><span style="font-weight:600;color:${barNewColor}">${fmtCurr(newValue)}</span> <span style="color:var(--muted);font-size:9px">(${newW.toFixed(1)}%)</span></div>`:''}
  </div>`;

  // Realized P/L for sell
  let realizedPnlHtml = '';
  if (isSell && tradeVal > 0 && pos?.avgPrice > 0) {
    const { comm, tax } = calcFees(tradeVal);
    const grossPnl = (price - pos.avgPrice) * shares;
    const netPnl   = grossPnl - comm - tax;
    const up       = netPnl >= 0;
    const clr      = up ? 'var(--gain)' : 'var(--loss)';
    realizedPnlHtml = `
    <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="color:var(--muted)">Realized P/L</span>
        <span style="font-weight:700;color:${clr}">${up?'+':''}${fmtCurr(netPnl)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px">
        <span>Avg cost ${fmtCurr(pos.avgPrice)} · Sell ${fmtCurr(price)}</span>
        <span>Gross ${up?'+':''}${fmtCurr(grossPnl)}</span>
      </div>
    </div>`;
  }

  barsEl.innerHTML = `<div style="margin-top:10px;padding:10px;background:var(--track);border-radius:8px;font-size:11px">
    <div style="font-weight:600;color:var(--muted);margin-bottom:8px;font-size:10px;text-transform:uppercase;letter-spacing:.5px">${t('allocation_preview_label')} · ${sym}</div>
    ${valueRow}
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:3px">
      <span>${t('portfolio_weight_label')}</span>
      <span>${currW.toFixed(1)}%${tradeVal>0?` → <strong style="color:${barNewColor}">${newW.toFixed(1)}%</strong>`:''}</span>
    </div>
    <div style="position:relative;height:6px;background:var(--line);border-radius:4px;overflow:hidden">
      ${barSeg(currW, color, '0.35')}
      ${tradeVal>0 ? (overTarget
        ? barSeg(target??newW, color) + barSeg(newW, 'var(--loss)')
        : barSeg(newW, barNewColor))
      : ''}
      ${tickMark(target)}
    </div>
    ${tBar}
    ${realizedPnlHtml}
  </div>`;
}

window.setSellAll = function() {
  const tickerEl = document.getElementById('txTicker');
  const sym = tickerEl?.value === '__custom__'
    ? document.getElementById('txTickerCustom')?.value?.trim()?.toUpperCase()
    : tickerEl?.value;
  const allPos = [...(currentModel?.positions||[]), ...(currentModel?.sgovPos?[currentModel.sgovPos]:[])];

    updateTxCalc();
  }

window.updateTxCalc = function() {
  const shares = parseFloat(document.getElementById('txShares')?.value) || 0;
  const price  = parseFloat(document.getElementById('txPrice')?.value)  || 0;
  const el = document.getElementById('txTradeValue');
  if (el) el.textContent = fmtCurr(shares * price);
  updateTxAllocationBars(shares, price);
  updateTxCashPreview();
};

window.selectTxCash = function(src) {
  document.getElementById('txCashSource').value = src;
  ['FCD','USD'].forEach(s => {
    const opt = document.getElementById('txCashOpt'+s);
    const dot = document.getElementById('txCashDot'+s);
    if (opt) opt.style.borderColor = s===src ? 'var(--terracotta)' : 'var(--line)';
    if (dot) { dot.style.background = s===src ? 'var(--terracotta)' : 'transparent'; dot.style.borderColor = s===src ? 'var(--terracotta)' : 'var(--muted)'; }
  });
  updateTxCashPreview();
};

function calcFees(tv) {
  const noComm = document.getElementById('txNoCommission')?.checked;
  const comm = noComm ? 0 : tv * 0.0015;
  const tax  = comm * 0.07;
  return { comm, tax, buyTotal: tv + comm + tax, sellNet: tv - comm - tax };
}

window.updateTxCashPreview = function() {
  const shares = parseFloat(document.getElementById('txShares')?.value) || 0;
  const price  = parseFloat(document.getElementById('txPrice')?.value)  || 0;
  const tv     = shares * price;
  const isSell = txType === 'Sell';
  const { comm, tax, buyTotal, sellNet } = calcFees(tv);
  const amount = isSell ? sellNet : buyTotal;
  const { fcd, usd } = txPortCash();
  ['FCD','USD'].forEach(s => {
    const el = document.getElementById('txCashInfo'+s);
    if (!el) return;
    const bal = s==='FCD' ? fcd : usd;
    if (tv <= 0) { el.innerHTML = `<span style="color:var(--muted)">Balance: ${fmtCurr(bal)}</span>`; return; }
    const feeNote = (comm+tax) > 0
      ? `<span style="color:var(--muted);font-size:9px"> (fee ${fmtCurr(comm+tax)})</span>` : '';
    if (isSell) {
      el.innerHTML = `<span style="color:var(--muted)">Balance: ${fmtCurr(bal)}</span><br><span style="color:var(--gain)">+${fmtCurr(sellNet)} → ${fmtCurr(bal+sellNet)}</span>${feeNote}`;
    } else {
      const after = bal - buyTotal;
      el.innerHTML = `<span style="color:var(--muted)">Balance: ${fmtCurr(bal)}</span><br><span style="color:${after<0?'var(--loss)':'var(--muted)'}">−${fmtCurr(buyTotal)} → ${fmtCurr(after)}</span>${feeNote}`;

async function postTransactionUpdates(ticker, shares, price, txTypeVal, portfolio) {
  const port = portfolio || DEFAULT_PORT;
  // Use the raw (portfolio, symbol) holding row — NOT currentModel, which is the active view slice.
  const row = _allRows.find(r => r.symbol === ticker && (r.portfolio || DEFAULT_PORT) === port);
  const curQty = Number(row?.qty) || 0, curAvg = Number(row?.avgPrice) || 0;
  // 1. Recalculate Qty and Avg Cost (upsert — creates row if symbol is new)
  if (txTypeVal === 'Buy' || txTypeVal === 'Sell') {
    let newQty, newAvg;
    if (txTypeVal === 'Buy') {
      newQty = curQty + shares;
      newAvg = newQty > 0 ? (curQty*curAvg + shares*price) / newQty : price;
    } else {
      newQty = Math.max(0, curQty - shares);
      newAvg = curAvg;
    }
    // Sell All: if qty reaches 0, delete from Claude sheet
    if (txSellAll && txTypeVal === 'Sell' && newQty < 0.0001) {
      recordFetch({ action:'removeSymbol', symbol:ticker, portfolio:port });
      txSellAll = false;
    } else {
      recordFetch({ action:'updateSymbol', symbol:ticker, portfolio:port, qty:newQty.toFixed(6), avgPrice:newAvg.toFixed(6) });
      txSellAll = false;
    }
  }
  // 2. Deduct / add cash from this portfolio's registry balances (including commission + tax)
  const src  = document.getElementById('txCashSource')?.value || 'USD';
  const tv   = shares * price;
  const { buyTotal, sellNet } = calcFees(tv);
  const amount = txTypeVal === 'Buy' ? buyTotal : sellNet;
  const cashPort = port === 'ETF' ? DEFAULT_PORT : port;
  const reg = _portRow(cashPort);
  const fcd  = Number(reg?.fcd) || 0;
  const usd  = Number(reg?.usd) || 0;
  let nFcd = fcd, nUsd = usd;
  if (txTypeVal === 'Buy')  { if (src==='FCD') nFcd = fcd-amount; else nUsd = usd-amount; }
  if (txTypeVal === 'Sell') { if (src==='FCD') nFcd = fcd+amount; else nUsd = usd+amount; }
  recordFetch({ action:'updateCash', portfolio: cashPort, fcd:nFcd.toFixed(4), usd:nUsd.toFixed(4) });
}

// Move shares between portfolios — no cash change, no realized P&L. Apps Script writes the
// Transfer-Out + Transfer-In pair (at source avg cost) and updates both holding rows atomically.
async function transferShares(sym, shares, fromPort, toPort) {
  if (!sym || !shares || shares <= 0 || fromPort === toPort) return false;
  const fromRow = _allRows.find(r => r.symbol === sym && (r.portfolio || DEFAULT_PORT) === fromPort);
  const avg = Number(fromRow?.avgPrice) || 0;
  await recordFetch({ action:'transferShares', symbol:sym, shares:Number(shares).toFixed(6),
                      fromPortfolio:fromPort, toPortfolio:toPort, price:avg.toFixed(6) });
  _allTxCache = null;
  return true;
}

async function fetchTxList() {
  const res  = await fetch(TX_LIST_URL);
  const text = await res.text();
  const json = JSON.parse(text.substring(text.indexOf('(') + 1, text.lastIndexOf(')')));
  const table = json.table;
  const idx = {};
  table.cols.forEach((c, i) => { if (c.label) idx[c.label] = i; });
  const cell = (row, label) => { const i = idx[label]; if (i == null) return null; const c = row.c[i]; return c == null ? null : c.v; };

  const parseDate = raw => {
    if (!raw) return null;
    if (typeof raw === 'string' && raw.startsWith('Date(')) {
      const p = raw.slice(5,-1).split(',').map(Number);
      return new Date(Date.UTC(p[0], p[1], p[2])).toISOString().slice(0,10);
    }
    return new Date(raw).toISOString().slice(0,10);
  };
  const parseTime = raw => {
    if (raw == null) return '';
    if (typeof raw === 'string' && raw.startsWith('Date(')) {
      const p = raw.slice(5,-1).split(',').map(Number);
      return `${String(p[3]||0).padStart(2,'0')}:${String(p[4]||0).padStart(2,'0')}:${String(p[5]||0).padStart(2,'0')}`;
    }
    return String(raw);
  };

  const out = table.rows.map((r, i) => ({
    row:            i + 2,
    date:           parseDate(cell(r, 'Date')),
    time:           parseTime(cell(r, 'Time')),
    type:           cell(r, 'Type') || 'Buy',
    ticker:         cell(r, 'Ticker') || '',
    shares:         Number(cell(r, 'Shares')) || 0,
    price:          Number(cell(r, 'Price_Per_Share')) || 0,
    tradeValue:     Number(cell(r, 'Trade_Value')) || 0,
    portfolio:      cell(r, 'Portfolio') || DEFAULT_PORT,
    com:            Number(cell(r, 'Com')) || 0,
    tax:            Number(cell(r, 'Tax')) || 0,
    total:          Number(cell(r, 'Trade_Value+Fee') ?? cell(r, 'Trade_Value Fee') ?? 0),
    commissionFree: cell(r, 'Commission_Free') === true || cell(r, 'Commission_Free') === 'TRUE',
  })).filter(x => x.date && x.ticker);

  return out;
}

window.openSymbolDetail = function(sym) {

  const plan  = getPlan(sym) || {};
  const { tranches=[], sl, note } = plan;
  const td      = getTargetDollar(pos, currentModel);
  const currPct = getCurrentPct(pos, currentModel);

  const trancheRows = tranches.map((t, i) => {
    const dollar = getTrancheDollar(i, tranches, currPct, td);
    return `<tr style="border-bottom:1px solid var(--line-soft)">

    </tr>`;
  }).join('');

  // Build plan progress bar
  const localTrancheColor = i => {
    const available = TRANCHE_COLORS.filter(c => c !== color);
    return available[i % available.length];
  };
  const segs = [{ from: 0, to: currPct, color }];
  let prevEnd = currPct;
  tranches.forEach((t, i) => {
    const cum = Math.max(prevEnd, t.cumPct ?? prevEnd);
    if (cum > prevEnd) segs.push({ from: prevEnd, to: cum, color: localTrancheColor(i) });
    prevEnd = cum;
  });
  const lastEnd  = segs[segs.length - 1]?.to ?? 0;
  const scaleMax = lastEnd > 100 ? lastEnd * 1.1 : 100;
  const tickLeft = (100 / scaleMax * 100).toFixed(2);
  const planBarHtml = (td > 0) ? `
    <div style="position:relative;height:22px;background:var(--track);border-radius:6px;overflow:hidden;margin-bottom:12px">
      ${segs.map(s => {
        const l = (s.from / scaleMax * 100).toFixed(2);
        const w = ((s.to - s.from) / scaleMax * 100).toFixed(2);
        return `<div style="position:absolute;left:${l}%;width:${w}%;top:0;height:100%;background:${s.color};display:flex;align-items:center;justify-content:center;overflow:hidden">

        </div>`;
      }).join('')}
      <div style="position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.7;left:${tickLeft}%;border-radius:1px"></div>
    </div>` : '';

  const realizedPnl  = (pnlData || []).filter(t => t.ticker === sym).reduce((s,t) => s + t.pnl, 0);
  const hasRealizedPnl = (pnlData || []).some(t => t.ticker === sym);

  const overlay = document.getElementById('symbolDetailModal');

          <div style="font-size:11px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap">
            ${pos.price    != null    ? `<span style="color:var(--muted)">Last <strong style="color:var(--ink)">${fmtCurr(pos.price)}</strong></span>` : ''}
            ${(pos.qty||0)  > 0       ? `<span style="color:var(--muted)">Qty <strong style="color:var(--ink)">${pos.qty.toFixed(4)}</strong></span>` : ''}

    <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin-bottom:12px;padding:8px 10px;background:var(--track);border-radius:var(--radius-sm)">

      ${pos.industry   ? `<span style="color:var(--muted)">${t('industry_label')} <strong style="color:var(--ink)">${pos.industry}</strong></span>` : ''}

        </div>
      </div>
    </div>
    <div id="sdTxPane" style="display:none">
      <div style="overflow-x:auto;max-height:360px;overflow-y:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)">

      </div>

  </div>`;
  overlay.classList.add('open');

  setTimeout(async () => {
    const positions = currentModel.positions;

    const mkChart   = (id, items) => {

      const bg     = items.map(p => p.symbol === sym ? colorFor(p.symbol) : colorFor(p.symbol) + '55');
      const border = items.map(p => p.symbol === sym ? '#fff' : 'transparent');
      const bw     = items.map(p => p.symbol === sym ? 2 : 0);
      return new Chart(el.getContext('2d'), {
        type: 'doughnut',
        data: { labels: items.map(p=>p.symbol), datasets: [{ data: items.map(p=>p.currentValue||0), backgroundColor: bg, borderColor: border, borderWidth: bw, hoverBorderWidth: 0 }] },
        options: { responsive:true, maintainAspectRatio:false, cutout:'65%', animation:false,
          plugins: { legend:{display:false}, tooltip:{ callbacks:{ label: c=>`  ${c.label}: ${total>0?(c.raw/total*100).toFixed(1):0}%` },

        const fresh = await readHistory();
        if (fresh?.prices?.[sym]) { historyCache = fresh; priceMap = fresh.prices[sym]; }
      }
      // Fallback: fetch 2Y of daily closes from Yahoo Finance
      if (!priceMap) {
        const p2 = Math.floor(Date.now() / 1000);
        const p1 = p2 - 2 * 365 * 86400;
        priceMap = await fetchYahooPrices(sym, p1, p2);
      }

      const clrInk = css('--ink'), clrTrack = css('--track'), clrCard = css('--card'),
            clrMuted = css('--ink-soft'), clrGain = css('--gain');
      const symColor  = colorFor(sym);

      // Legend overlay (clear any leftover content from a previous open)
      tvEl.innerHTML = '';
      tvEl.style.position = 'relative';
      tvEl.style.touchAction = 'none';
      const legend = document.createElement('div');
      legend.style.cssText = 'position:absolute;top:8px;left:10px;z-index:10;pointer-events:none;line-height:1.4';
      legend.innerHTML = `<span style="font-size:13px;font-weight:700;color:${symColor}">${sym}</span>`;
      tvEl.appendChild(legend);

      const { chart: tvChart, series: areaSeries } = createTvAreaChart(tvEl, 260, symColor, clrTrack, clrMuted);

      let seriesData = [];
      if (priceMap && Object.keys(priceMap).length) {
        seriesData = buildTvSeriesData(sym, priceMap);
        areaSeries.setData(seriesData);
        tvChart.timeScale().fitContent();

        // Last price dashed line
        const lastPx = seriesData[seriesData.length - 1]?.value;
        if (lastPx) {
          areaSeries.createPriceLine({
            price: lastPx, color: symColor,
            lineWidth: 2, lineStyle: LightweightCharts.LineStyle.LargeDashed,
            axisLabelVisible: false, title: '',
          });
        }

        // Tranche & SL price lines
        const available = TRANCHE_COLORS.filter(c => c !== symColor);
        tranches.forEach((t, i) => {
          if (!t.price || t.price <= 0) return;
          areaSeries.createPriceLine({
            price: t.price,
            color: available[i % available.length],
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: `T${i + 1}`,
          });
        });
        if (sl) {
          areaSeries.createPriceLine({
            price: sl,
            color: '#bb4d3c',
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: 'SL',
          });
        }
        if (pos?.avgPrice > 0) {
          areaSeries.createPriceLine({
            price: pos.avgPrice,
            color: '#ffffff',
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: 'Avg',
          });
        }

        // Show last price in legend by default
        const lastPoint = seriesData[seriesData.length - 1];
        if (lastPoint) legend.innerHTML =
          `<span style="font-size:13px;font-weight:700;color:${symColor}">${sym}</span>` +
          `<span style="font-size:12px;font-weight:600;color:${clrInk};margin-left:8px">${fmtCurr(lastPoint.value)}</span>`;

        // Update legend on crosshair move
        tvChart.subscribeCrosshairMove(param => {
          if (!param.time || !param.seriesData?.size) {
            const last = seriesData[seriesData.length - 1];
            legend.innerHTML =
              `<span style="font-size:13px;font-weight:700;color:${symColor}">${sym}</span>` +
              `<span style="font-size:12px;font-weight:600;color:${clrInk};margin-left:8px">${fmtCurr(last?.value)}</span>`;
            return;
          }
          const d = param.seriesData.get(areaSeries);
          if (d) legend.innerHTML =
            `<span style="font-size:13px;font-weight:700;color:${symColor}">${sym}</span>` +
            `<span style="font-size:12px;font-weight:600;color:${clrInk};margin-left:8px">${fmtCurr(d.value)}</span>`;
        });
      } else {
        tvEl.insertAdjacentHTML('beforeend',
          `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)">${t('no_price_data')}</div>`);
      }

      // Resize observer
      const ro = new ResizeObserver(() => tvChart.resize(tvEl.clientWidth, 260));
      ro.observe(tvEl);

      // Range switcher
      window._sdTvChart     = tvChart;
      window._sdTvSeries    = areaSeries;
      window._sdTvPriceMap  = priceMap || {};
      window._sdTvSym       = sym;
      sdSetRange('1Y');

      symbolDetailCharts.push({ destroy: () => { try { ro.disconnect(); tvChart.remove(); } catch(_) {} } });
    }

    // Populate transactions table
    const txs  = txList.filter(t => t.ticker === sym).sort((a,b) => b.date.localeCompare(a.date));
    const body = document.getElementById('sdTxBody');
    const empty = document.getElementById('sdTxEmpty');
    if (body) {
      if (txs.length) {
        body.innerHTML = txs.map(t => `<tr style="border-bottom:1px solid var(--line-soft)">
          <td style="padding:5px 8px;color:var(--muted);font-size:11px">${fmtDate(t.date)}</td>
          <td style="padding:5px 8px"><span class="${t.type==='Sell'?'tx-badge-sell':'tx-badge-buy'}">${t.type}</span></td>
          <td style="padding:5px 8px;text-align:right">${t.shares}</td>
          <td style="padding:5px 8px;text-align:right">${fmtCurr(t.price)}</td>
          <td style="padding:5px 8px;text-align:right">${fmtCurr(t.tradeValue)}</td>
          <td style="padding:5px 8px;text-align:right;font-weight:600">${fmtCurr(t.total||t.tradeValue)}</td>
        </tr>`).join('');
      } else {
        body.innerHTML = '';
        if (empty) empty.style.display = 'block';
      }
    }
  }, 0);
};

window.sdSwitchTab = function(tab) {
  const chartsPane = document.getElementById('sdChartsPane');
  const txPane     = document.getElementById('sdTxPane');
  const chartsBtn  = document.getElementById('sdTabCharts');
  const txBtn      = document.getElementById('sdTabTx');
  const isCharts   = tab === 'charts';
  if (chartsPane) chartsPane.style.display = isCharts ? '' : 'none';
  if (txPane)     txPane.style.display     = isCharts ? 'none' : '';
  if (chartsBtn)  { chartsBtn.style.background = isCharts ? 'var(--terracotta)' : 'transparent'; chartsBtn.style.color = isCharts ? 'var(--btn-fg)' : 'var(--muted)'; }
  if (txBtn)      { txBtn.style.background     = isCharts ? 'transparent' : 'var(--terracotta)'; txBtn.style.color     = isCharts ? 'var(--muted)' : 'var(--btn-fg)'; }
};

window.closeSymbolDetail = function() {
  destroySymbolDetailCharts();
  window._sdTvChart = window._sdTvSeries = window._sdTvPriceMap = null;
  document.getElementById('symbolDetailModal')?.classList.remove('open');
};

window.sdSetRange = async function(range) {
  const chart    = window._sdTvChart;
  const priceMap = window._sdTvPriceMap;
  if (!chart || !priceMap) return;

  // Highlight active button
  ['1M','3M','6M','YTD','1Y','ALL'].forEach(r => {
    const btn = document.getElementById('sdRange_' + r);
    if (!btn) return;
    const active = r === range;
    btn.style.background  = active ? 'var(--ink)' : 'transparent';
    btn.style.color       = active ? 'var(--card)' : 'var(--muted)';
    btn.style.borderColor = active ? 'var(--ink)'  : 'var(--line)';
  });

  if (range === 'ALL') { chart.timeScale().fitContent(); return; }

  const now   = new Date();
  let   from;
  if (range === 'YTD') {
    from = new Date(now.getFullYear(), 0, 1);
  } else {
    const months = { '1M': 1, '3M': 3, '6M': 6, '1Y': 12 };
    from = new Date(now);
    from.setMonth(from.getMonth() - months[range]);
  }
  const fromStr = from.toISOString().slice(0,10);
  const toStr   = now.toISOString().slice(0,10);

  let dates = Object.keys(priceMap).sort();
  let clipped = dates.filter(d => d >= fromStr && d <= toStr);
  const needsYahoo = clipped.length < 2 || dates[0] > fromStr;
  if (needsYahoo) {
    const sym = window._sdTvSym;
    const series = window._sdTvSeries;
    if (sym && series) {
      const p2 = Math.floor(Date.now() / 1000);
      const p1 = p2 - 2 * 365 * 86400;
      const yahoo = await fetchYahooPrices(sym, p1, p2);
      if (yahoo) {
        const merged = Object.assign({}, yahoo, priceMap);
        if (!historyCache) historyCache = { prices: {}, dividends: {} };
        if (!historyCache.prices) historyCache.prices = {};
        historyCache.prices[sym] = merged;
        window._sdTvPriceMap = merged;
        const livePrice = findPos(sym)?.price;
        const todayStr  = new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Bangkok'});
        let seriesData = Object.entries(merged)
          .map(([date, value]) => ({ time: date, value }))
          .sort((a, b) => a.time.localeCompare(b.time));
        if (livePrice && todayStr >= (seriesData[seriesData.length-1]?.time || '')) {
          seriesData = [...seriesData.filter(d => d.time !== todayStr), { time: todayStr, value: livePrice }];
        }
        series.setData(seriesData);
        dates   = seriesData.map(d => d.time);
        clipped = dates.filter(d => d >= fromStr && d <= toStr);
      }
    }
    if (clipped.length < 2) { chart.timeScale().fitContent(); return; }
  }

  chart.timeScale().setVisibleRange({ from: clipped[0], to: clipped[clipped.length - 1] });
};

    </div>
    ${rows ? `<div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)">

let actionChart1 = null, actionChart2 = null;
let actionTvChart = null, actionTvSeries = null, actionTvLines = [], actionTvRo = null;

function findPos(sym) {
  return currentModel?.positions.find(p => p.symbol === sym)
      || (currentModel?.sgovPos?.symbol === sym ? currentModel.sgovPos : null)
      || currentModel?.watchlist.find(w => w.symbol === sym)
      || null;
}

function destroyActionTvChart() {
  if (actionTvRo) { try { actionTvRo.disconnect(); } catch(_) {} actionTvRo = null; }
  actionTvLines.forEach(l => { try { actionTvSeries?.removePriceLine(l); } catch(_) {} });
  actionTvLines = [];
  if (actionTvChart) { try { actionTvChart.remove(); } catch(_) {} actionTvChart = null; actionTvSeries = null; }
}

function destroyActionCharts() {
  if (actionChart1) { actionChart1.destroy(); actionChart1 = null; }
  if (actionChart2) { actionChart2.destroy(); actionChart2 = null; }
  destroyActionTvChart();
}

// Shared Lightweight-Charts setup for the two area charts (symbol-detail +
// action PLAN tab). Both use identical chart/series config bar the height.
function createTvAreaChart(el, height, symColor, clrTrack, clrMuted) {
  const chart = LightweightCharts.createChart(el, {
    width: el.clientWidth, height,
    layout: { background: { color: 'transparent' }, textColor: clrMuted, fontSize: 11 },
    grid:   { vertLines: { color: clrTrack }, horzLines: { color: clrTrack } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: clrTrack },
    timeScale: { borderColor: clrTrack, timeVisible: false },
    handleScroll: true, handleScale: true,
  });
  const series = chart.addAreaSeries({
    lineColor: symColor, topColor: symColor + '55', bottomColor: symColor + '00',
    lineWidth: 2, priceLineVisible: false, lastValueVisible: true,
  });
  return { chart, series };
}

// Build sorted {time,value} series from a date→price map, splicing today's live
// price onto the tail when newer than the last cached point.
function buildTvSeriesData(sym, priceMap) {
  let seriesData = Object.entries(priceMap)
    .map(([date, value]) => ({ time: date, value }))
    .sort((a, b) => a.time.localeCompare(b.time));
  const livePrice = findPos(sym)?.price;
  const todayStr  = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
  if (livePrice && todayStr >= (seriesData[seriesData.length - 1]?.time || '')) {
    seriesData = [...seriesData.filter(d => d.time !== todayStr), { time: todayStr, value: livePrice }];
  }
  return seriesData;
}

async function buildActionTvChart(sym) {
  const el = document.getElementById('actionTvChartEl');
  if (!el || typeof LightweightCharts === 'undefined') return;
  destroyActionTvChart();
  el.innerHTML = '';

  const clrInk = css('--ink'), clrTrack = css('--track'), clrMuted = css('--ink-soft');
  const symColor = colorFor(sym);

  el.style.position = 'relative';
  el.style.touchAction = 'none';
  ({ chart: actionTvChart, series: actionTvSeries } = createTvAreaChart(el, 220, symColor, clrTrack, clrMuted));

  const legend = document.createElement('div');
  legend.style.cssText = 'position:absolute;top:8px;left:10px;z-index:10;pointer-events:none';
  el.appendChild(legend);

  let priceMap = historyCache?.prices?.[sym] ? { ...historyCache.prices[sym] } : null;
  const p2 = Math.floor(Date.now() / 1000);
  const p1 = p2 - 2 * 365 * 86400;
  const yahoo = await fetchYahooPrices(sym, p1, p2);
  if (yahoo) {
    priceMap = Object.assign({}, yahoo, priceMap || {});
    if (!historyCache) historyCache = { prices: {}, dividends: {} };
    if (!historyCache.prices) historyCache.prices = {};
    historyCache.prices[sym] = priceMap;
  }
  if (priceMap && Object.keys(priceMap).length) {
    const seriesData = buildTvSeriesData(sym, priceMap);
    actionTvSeries.setData(seriesData);

    const fromStr = new Date(Date.now() - 365*86400000).toISOString().slice(0,10);
    const clipped = seriesData.filter(d => d.time >= fromStr);
    if (clipped.length > 1) actionTvChart.timeScale().setVisibleRange({ from: clipped[0].time, to: clipped[clipped.length-1].time });
    else actionTvChart.timeScale().fitContent();

    const last = seriesData[seriesData.length - 1];
    const setLegend = val => {
      legend.innerHTML = `<span style="font-size:12px;font-weight:700;color:${symColor}">${sym}</span>`
        + `<span style="font-size:11px;font-weight:600;color:${clrInk};margin-left:8px">${fmtCurr(val)}</span>`;
    };
    if (last) setLegend(last.value);
    actionTvChart.subscribeCrosshairMove(param => {
      const d = param.seriesData?.get(actionTvSeries);
      setLegend(d ? d.value : last?.value);
    });
  } else {
    legend.innerHTML = `<span style="font-size:12px;font-weight:700;color:${symColor}">${sym}</span>`
      + `<span style="font-size:10px;color:var(--muted);margin-left:8px">${t('no_history_msg')}</span>`;
  }

  actionTvRo = new ResizeObserver(() => { if (actionTvChart) actionTvChart.resize(el.clientWidth, 220); });
  actionTvRo.observe(el);
  updateActionTvLines();
}

function updateActionTvLines() {
  if (!actionTvSeries) return;
  actionTvLines.forEach(l => { try { actionTvSeries.removePriceLine(l); } catch(_) {} });
  actionTvLines = [];
  const _lastPx = findPos(planState.symbol)?.price;
  if (_lastPx) {
    actionTvLines.push(actionTvSeries.createPriceLine({
      price: _lastPx, color: colorFor(planState.symbol),
      lineWidth: 2, lineStyle: LightweightCharts.LineStyle.LargeDashed,
      axisLabelVisible: false, title: '',
    }));
  }
  const available = TRANCHE_COLORS.filter(c => c !== colorFor(planState.symbol));
  (planState.tranches || []).forEach((t, i) => {
    if (!t.price || t.price <= 0) return;
    actionTvLines.push(actionTvSeries.createPriceLine({
      price: t.price, color: available[i % available.length],
      lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: `T${i+1}`,
    }));
  });
  if (planState.sl) {
    actionTvLines.push(actionTvSeries.createPriceLine({
      price: planState.sl, color: '#bb4d3c',
      lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: 'SL',
    }));
  }
  const _avgPos = findPos(planState.symbol);
  if (_avgPos?.avgPrice > 0) {
    actionTvLines.push(actionTvSeries.createPriceLine({
      price: _avgPos.avgPrice, color: '#ffffff',
      lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: 'Avg',
    }));
  }
}

// previewValue: optional override for currentValue; overrideCat: optional category for chart 2
function renderActionCharts(sym, previewValue, overrideCat) {
  if (!currentModel) return;
  destroyActionCharts();
  const pos = findPos(sym);
  if (!pos) return;

  const isAllocMode = actionModalTab === 'allocation';
  const category    = overrideCat ?? pos.category ?? 'Other';
  const t2el = document.getElementById('actionChart2Title');
  if (t2el) t2el.textContent = category;

  if (isAllocMode) {
    // ── Allocation mode: use target % values ──────────────────────────────
    const investable = currentModel.investable;
    const editedTgt  = previewValue != null && investable > 0
      ? previewValue / investable * 100
      : (pos.target || 0) * 100;

    // Build items: each stock's target %, override edited symbol + its category
    // Include watchlist item if it's not already in positions
    const inPositions = currentModel.positions.some(p => p.symbol === sym);
    let allItems = currentModel.positions.map(p => ({
      symbol:   p.symbol,
      tgtPct:   p.symbol === sym ? editedTgt : (p.target || 0) * 100,
      category: p.symbol === sym ? category  : (p.category || 'Other'),
    }));
    if (!inPositions && editedTgt > 0) {
      allItems.push({ symbol: sym, tgtPct: editedTgt, category });
    }
    allItems = allItems.filter(p => p.tgtPct > 0);

    const totalPct  = allItems.reduce((s,p) => s + p.tgtPct, 0);
    const available = Math.max(0, 100 - totalPct);

    // Chart 1: all stocks by target + Available slice
    const c1items = [...allItems, ...(available > 0.01 ? [{symbol:'Available', tgtPct:available, category:''}] : [])];
    const c2items = allItems.filter(p => p.category === category);

    const editedPct1 = editedTgt.toFixed(1);
    const c2tot = c2items.reduce((s,p) => s+p.tgtPct, 0);
    const editedPct2 = c2tot > 0 ? (editedTgt/c2tot*100).toFixed(1) : editedTgt.toFixed(1);

    const lbl1 = document.getElementById('actionLbl1');
    const lbl2 = document.getElementById('actionLbl2');
    const avEl = document.getElementById('actionChart1Avail');
    if (lbl1) lbl1.textContent = `${sym}  ${editedPct1}%`;
    if (lbl2) lbl2.textContent = `${sym}  ${editedPct2}%`;
    if (avEl) {
      const color = available > 0.01 ? 'var(--gain)' : 'var(--loss)';
      avEl.innerHTML = `Available: <strong style="color:${color}">${available.toFixed(1)}%</strong>`;
    }

    const mkAllocChart = (id, items) => {
      const el = document.getElementById(id);
      if (!el) return null;
      const total  = items.reduce((s,p) => s+p.tgtPct, 0);
      const labels = items.map(p => p.symbol);
      const data   = items.map(p => p.tgtPct);
      const bg     = items.map(p => p.symbol==='Available' ? 'rgba(100,116,139,0.25)' : p.symbol===sym ? colorFor(p.symbol) : colorFor(p.symbol)+'55');
      const border = items.map(p => p.symbol===sym ? '#fff' : 'transparent');
      const bw     = items.map(p => p.symbol===sym ? 3 : 0);
      return new Chart(el.getContext('2d'), {
        type: 'doughnut',
        data: { labels, datasets: [{ data, backgroundColor: bg, borderColor: border, borderWidth: bw, hoverBorderWidth:0 }] },
        options: { responsive:true, maintainAspectRatio:false, cutout:'62%', animation:false,
          plugins: { legend:{display:false},
            tooltip: { callbacks:{ label: c => ` ${c.label}: ${c.raw.toFixed(1)}% of portfolio` },
              backgroundColor: css('--tooltip-bg'), bodyColor: css('--card'), padding:8, cornerRadius:8 }}}
      });
    };
    actionChart1 = mkAllocChart('actionChart1', c1items);
    actionChart2 = mkAllocChart('actionChart2', c2items.length ? c2items : c1items);
    return;
  }

  // ── Edit mode: use current value ─────────────────────────────────────────
  const usedValue = previewValue != null ? previewValue : (pos.currentValue ?? 0);
  const positions = currentModel.positions.map(p =>
    p.symbol === sym ? { ...p, currentValue: usedValue, category } : p
  );
  const catPos = positions.filter(p => (p.category||'Other') === category);
  const total1 = positions.reduce((s,p) => s + p.currentValue, 0);
  const total2 = catPos.reduce((s,p) => s + p.currentValue, 0);
  const lbl1 = document.getElementById('actionLbl1');
  const lbl2 = document.getElementById('actionLbl2');
  if (lbl1) lbl1.textContent = `${sym}  ${total1>0?(usedValue/total1*100).toFixed(1):0}%`;
  if (lbl2) lbl2.textContent = `${sym}  ${total2>0?(usedValue/total2*100).toFixed(1):0}%`;

  const mkChart = (id, items) => {
    const el = document.getElementById(id);
    if (!el) return null;
    const total  = items.reduce((s,p) => s + p.currentValue, 0);
    const labels = items.map(p => p.symbol);
    const data   = items.map(p => p.currentValue);
    const bg     = items.map(p => p.symbol===sym ? colorFor(p.symbol) : colorFor(p.symbol)+'55');
    const border = items.map(p => p.symbol===sym ? '#ffffff' : 'transparent');
    const bw     = items.map(p => p.symbol===sym ? 3 : 0);
    return new Chart(el.getContext('2d'), {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: bg, borderColor: border, borderWidth: bw, hoverBorderWidth:0 }] },
      options: { responsive:true, maintainAspectRatio:false, cutout:'62%', animation:false,
        plugins: { legend:{display:false},
          tooltip: { callbacks:{ label: c => ` ${c.label}: ${total>0?(c.raw/total*100).toFixed(1):0}%` },
            backgroundColor: css('--tooltip-bg'), bodyColor: css('--card'), padding:8, cornerRadius:8 }}}
    });
  };
  actionChart1 = mkChart('actionChart1', positions);
  actionChart2 = mkChart('actionChart2', catPos);
}

window.updateActionCategoryChange = function() {

window.updateActionChartsPreview = function() {
  const sym = actionModalSym;
  const pos = findPos(sym);
  if (!pos || !actionChart1) return;

  if (actionModalTab === 'allocation') {
    // Allocation mode: full re-render (Available slice must update too)
    const tgt = parseFloat(document.getElementById('editTargetPct')?.value);
    const planned = (!isNaN(tgt) && currentModel?.investable > 0)
      ? (tgt / 100) * currentModel.investable : null;
    renderActionCharts(sym, planned);
    return;
  }

  // Edit mode: in-place patch (no Available slice to worry about)
  const qty = parseFloat(document.getElementById('editQty')?.value);
  const usedValue = !isNaN(qty) ? qty * (pos.price || 0) : (pos.currentValue ?? 0);
  [actionChart1, actionChart2].forEach(chart => {
    if (!chart) return;
    const idx = chart.data.labels.indexOf(sym);
    if (idx < 0) return;
    chart.data.datasets[0].data[idx] = usedValue;
    chart.update('none');
  });
  const allItems = currentModel.positions.map(p => p.symbol===sym ? {...p,currentValue:usedValue} : p);
  const catItems = allItems.filter(p => (p.category||'Other') === (pos.category||'Other'));
  const t1 = allItems.reduce((s,p) => s+p.currentValue, 0);
  const t2 = catItems.reduce((s,p) => s+p.currentValue, 0);
  const lbl1 = document.getElementById('actionLbl1');
  const lbl2 = document.getElementById('actionLbl2');
  if (lbl1) lbl1.textContent = `${sym}  ${t1>0?(usedValue/t1*100).toFixed(1):0}%`;
  if (lbl2) lbl2.textContent = `${sym}  ${t2>0?(usedValue/t2*100).toFixed(1):0}%`;
};

  actionModalSym = sym;
  actionModalTab = 'plan';
  actionModalPort = port || defaultPortFor(sym);
  tabDraft = {};
  resetRebalFund();
  // Clear standalone txModal to avoid duplicate ID conflicts (txAllocBars, txTicker, etc.)
  const txOverlay = document.getElementById('txModal');
  if (txOverlay) txOverlay.innerHTML = '';
  const portModel = modelForPort(actionModalPort);
  const pos   = findPosIn(portModel, sym) || findPos(sym);
  const color = colorFor(sym);
  // Init plan state from cache (this portfolio's plan)
  if (pos) {
    const cached = getPlan(sym, actionModalPort) || {};
    const tr = cached.tranches?.length ? cached.tranches : [{cumPct:0}];
    const tp = cached.trimTranches?.length === 3 ? cached.trimTranches : [{},{},{}];
    planState = {symbol:sym, name:pos.name||'', tranches:tr, trimTranches:tp, model:portModel,
                 sl:cached.sl??null, note:cached.note??'',
                 pendingTarget:null, pendingCategory:null};
  }
  const overlay = document.getElementById('actionModal');
  if (!overlay) return;
  const tabs = ['plan','transaction','edit','allocation'];
  const portSelector = _portfolioRegistry.length > 1
    ? `<select onchange="setActionPort(this.value)" title="Portfolio" style="font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--track);color:var(--ink);cursor:pointer">
        ${_portfolioRegistry.map(p=>`<option value="${p.name}"${p.name===actionModalPort?' selected':''}>${p.name}</option>`).join('')}
      </select>` : '';
  overlay.innerHTML = `<div class="tx-modal" style="max-width:800px;max-height:calc(100vh - 80px);overflow-y:auto" onclick="event.stopPropagation()">
    <div class="tx-header">
      <div style="display:flex;align-items:center;gap:10px">
        ${logoCell(sym, color)}
        <div>
          <div style="font-size:15px;font-weight:700">${sym}${_activeProfile()?.geminiKey ? `<button class="gc-gemini-btn" onclick="openGeminiChat('${sym}')" title="Chat with Gemini">${GEMINI_ICON}</button>` : ''}</div>
          <div style="font-size:11px;color:var(--muted)">${pos?.name||''}</div>
          ${(pos?.price||pos?.qty||pos?.avgPrice) ? `<div style="font-size:10px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap">
            ${pos.price  != null ? `<span>Last&nbsp;<strong style="color:var(--ink)">${fmtUSD(pos.price)}</strong></span>` : ''}
            ${pos.qty    >  0    ? `<span>Qty&nbsp;<strong style="color:var(--ink)">${pos.qty.toFixed(4)}</strong></span>` : ''}
            ${pos.avgPrice > 0  ? `<span>Avg&nbsp;<strong style="color:var(--ink)">${fmtUSD(pos.avgPrice)}</strong></span>` : ''}

        ${portSelector}
        ${!currentModel?.positions.find(p=>p.symbol===sym) && currentModel?.watchlist.find(w=>w.symbol===sym)
          ? `<button onclick="removeFromWatchlist('${sym}')" style="padding:4px 10px;font-size:11px;font-weight:600;color:var(--loss);background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.3);border-radius:6px;cursor:pointer">Remove</button>`
          : ''}

      </div>
    </div>
    <div style="display:flex;background:var(--track);border-radius:8px;padding:3px;margin-bottom:16px;gap:2px">
      ${tabs.map(tab=>`<button class="action-tab-btn${tab===actionModalTab?' active':''}" data-tab="${tab}" onclick="switchActionTab('${tab}')">${t('tab_'+tab)}</button>`).join('')}
    </div>
    <div id="actionTabContent"></div>
  </div>`;
  overlay.classList.add('open');
  renderActionTabContent();
};

// Switch the portfolio the action modal operates on; rebuild it on the same symbol/tab.
window.setActionPort = function(port) {
  if (port === actionModalPort) return;
  const sym = actionModalSym, tab = actionModalTab;
  openActionModal(sym, port);
  // openActionModal resets tab to 'plan'; restore the tab the user was on (if still valid for this port).
  if (tab && tab !== 'plan') switchActionTab(tab === 'allocation' && port === 'Trade' ? 'plan' : tab);
};

window.onPlanTargetChange = function(val) {
  const tgt = parseFloat(val);
  planState.pendingTarget = !isNaN(tgt) ? tgt / 100 : null;
  const sym = planState.symbol;
  const pos = findPos(sym);
  const dollarEl = document.getElementById('planTargetDollar');
  if (dollarEl) dollarEl.textContent = planState.pendingTarget && planState.model
    ? fmtUSD(getTargetDollar(pos, planState.model)) : '— set % to calculate';
  syncTrancheRow(0);
  renderPlanBar();
};

function saveTabDraft() {
  const tab = actionModalTab;
  if (tab === 'plan') {
    // Store directly into planState so re-render picks them up
    const sl = parseFloat(document.getElementById('planSL')?.value);
    planState.sl   = isNaN(sl) ? null : sl;
    planState.note = document.getElementById('planNote')?.value?.trim() || '';
  } else if (tab === 'transaction') {
    tabDraft.transaction = {
      date:   document.getElementById('txDate')?.value   || '',
      time:   document.getElementById('txTime')?.value   || '',
      shares: document.getElementById('txShares')?.value || '',
      price:  document.getElementById('txPrice')?.value  || '',
      noComm: document.getElementById('txNoCommission')?.checked || false,
    };
  } else if (tab === 'edit') {
    tabDraft.edit = {
      qty: document.getElementById('editQty')?.value     || '',
      avg: document.getElementById('editAvgCost')?.value || '',
    };
  } else if (tab === 'allocation') {
    const tgt = document.getElementById('editTargetPct')?.value || '';
    const cat = document.getElementById('editCategory')?.value  || '';
    tabDraft.allocation = { tgt, cat };
    // Mirror into planState so plan tab calculations use the new target
    const tgtNum = parseFloat(tgt);
    planState.pendingTarget   = !isNaN(tgtNum) ? tgtNum / 100 : null;
    planState.pendingCategory = cat || null;
  }
}

function restoreTabDraft() {
  const tab = actionModalTab;
  const d = tabDraft[tab];
  if (!d) return;
  const set = (id, val) => { if (val) { const el = document.getElementById(id); if (el) el.value = val; } };
  if (tab === 'transaction') {
    set('txDate',   d.date);
    set('txTime',   d.time);
    set('txShares', d.shares);
    set('txPrice',  d.price);
    const nc = document.getElementById('txNoCommission');
    if (nc) nc.checked = d.noComm;
    updateTxCalc();
  } else if (tab === 'edit') {
    set('editQty',     d.qty);
    set('editAvgCost', d.avg);
  } else if (tab === 'allocation') {
    set('editTargetPct', d.tgt);
    if (d.cat !== undefined) { const el = document.getElementById('editCategory'); if (el) el.value = d.cat; }
    updateActionChartsPreview();
  }
}

window.switchActionTab = function(tab) {
  saveTabDraft();
  destroyActionCharts();
  actionModalTab = tab;
  document.querySelectorAll('.action-tab-btn').forEach(b =>
    b.className = 'action-tab-btn' + (b.dataset.tab === tab ? ' active' : ''));
  renderActionTabContent();
  setTimeout(restoreTabDraft, 0);
};

// Plan save/clear from within action modal
const TRIM_COLORS = ['#6b8e5a','#c79038','#6b7eb8'];

function _trimCalcData() {
  const { symbol, trimTranches = [{},{},{}], model } = planState;
  const pos = model ? (model.positions.find(p=>p.symbol===symbol) || (model.sgovPos?.symbol===symbol?model.sgovPos:null) || model.watchlist.find(w=>w.symbol===symbol)) : null;
  const qty  = pos?.qty || 0, avg = pos?.avgPrice || 0, curPx = pos?.price || 0;
  const invest = model?.investable || 0;
  const target = (planState.pendingTarget ?? pos?.target) || 0;
  const targetDollar = target * invest;
  const curPctOfTarget = targetDollar > 0 ? qty * curPx / targetDollar * 100 : 0;
  let totalSharesSold = 0, totalNetPnL = 0, anyValid = false;
  const rows = trimTranches.map((t, i) => {
    const P = t.price || 0, trimPct = t.pct || 0;
    const qtyRemaining = Math.max(0, qty - totalSharesSold);
    const pctAtP = targetDollar > 0 && P > 0 ? qtyRemaining * P / targetDollar * 100 : curPctOfTarget;
    const sellPct = trimPct; const afterPct = Math.max(0, pctAtP - trimPct);
    const shares = (P > 0 && trimPct > 0 && targetDollar > 0 && sellPct > 0) ? Math.min(qtyRemaining, (sellPct / 100 * targetDollar) / P) : 0;
    const tv = shares * P, fees = tv * 0.0015 * 1.07;
    const gross = shares > 0 && avg > 0 ? (P - avg) * shares : 0;
    const net = gross - fees;
    const hasData = P > 0 && trimPct > 0;
    if (hasData) { totalSharesSold += shares; totalNetPnL += net; anyValid = true; }
    return { net, tv, hasData, pctAtP, afterPct, sellPct, shares };
  });
  const remQty = Math.max(0, qty - totalSharesSold);
  const remVal = remQty * curPx;
  const remPct = targetDollar > 0 ? remVal / targetDollar * 100 : 0;
  return { curPctOfTarget, rows, totalNetPnL, anyValid, remVal, remPct, scaleMax: Math.max(curPctOfTarget, remPct, 100), targetDollar, curPx, symbol };
}

// Called once when tab renders — builds input HTML
function renderTrimSection() {
  const { symbol, trimTranches = [{},{},{}], model } = planState;

      <div class="tranche-input-wrap has-prefix"><span class="ti-prefix">$</span>

// Called on every input — updates P&L cells, bar, summary WITHOUT touching input elements
function updateTrimCalcs() {
  const d = _trimCalcData();
  const { curPctOfTarget, rows, totalNetPnL, anyValid, remVal, remPct, scaleMax, symbol } = d;

  rows.forEach((r, i) => {
    const el = document.getElementById(`trimPnl_${i}`);
    if (el) el.innerHTML = r.hasData
      ? `<div style="text-align:center">
           <span style="font-size:11px;font-weight:700;color:${r.net>=0?'var(--gain)':'var(--loss)'}">${r.net>=0?'+':''}${fmtUSD(r.net)}</span>
           <span style="font-size:11px;color:var(--muted)"> ($${Math.round(r.tv).toLocaleString()})</span>
           <div style="font-size:9px;color:var(--muted)">${r.pctAtP.toFixed(2)}% → ${r.afterPct.toFixed(2)}%</div>
         </div>`
      : '<span style="color:var(--muted)">—</span>';
    const qEl = document.getElementById(`trimQty_${i}`);
    if (qEl && document.activeElement !== qEl) {
      qEl.value = r.hasData && r.shares > 0 ? +(r.shares).toFixed(4) : '';
    }
  });

  const fillW    = (remPct / scaleMax * 100).toFixed(1);
  const tickL    = (100 / scaleMax * 100).toFixed(1);
  const barColor = remPct > 100 ? 'var(--gain)' : 'var(--loss)';
  const barEl = document.getElementById('trimBar');
  if (barEl) barEl.innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:3px">
      <span>Now: <strong>${curPctOfTarget.toFixed(2)}%</strong> of target</span>
      ${anyValid ? `<span>After trim: <strong style="color:${barColor}">${remPct.toFixed(2)}%</strong> of target</span>` : ''}
    </div>
    <div style="position:relative;height:6px;background:var(--line);border-radius:4px;overflow:visible">
      <div style="height:100%;width:${Math.min(curPctOfTarget/scaleMax*100,100).toFixed(1)}%;background:${colorFor(symbol)};opacity:.3;border-radius:4px"></div>
      <div style="position:absolute;left:0;top:0;height:100%;width:100%;transform:scaleX(${(remPct/scaleMax).toFixed(4)});transform-origin:left;background:${barColor};border-radius:4px;transition:transform .15s var(--ease-out-quint)"></div>
      <div style="position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.7;left:${tickL}%;border-radius:1px"></div>
    </div>`;

  const sumEl = document.getElementById('planTrimSummary');
  if (sumEl) sumEl.innerHTML = anyValid
    ? `Total P&L <strong style="color:${totalNetPnL>=0?'var(--gain)':'var(--loss)'}">${totalNetPnL>=0?'+':''}${fmtUSD(totalNetPnL)}</strong> · ${fmtUSD(remVal)} remaining`
    : `<span style="color:var(--muted)">Now: <strong>${curPctOfTarget.toFixed(1)}%</strong> of target · enter exit price and % to trim</span>`;
}

window.onTrimPrice = function(idx, val) {
  if (!planState.trimTranches) planState.trimTranches = [{},{},{}];
  planState.trimTranches[idx].price = parseFloat(val) || null;
  updateTrimCalcs();
};
window.onTrimPct = function(idx, val) {
  if (!planState.trimTranches) planState.trimTranches = [{},{},{}];
  planState.trimTranches[idx].pct = parseFloat(val) || 0;
  updateTrimCalcs();
};

window.onTrimQty = function(idx, val) {
  const sharesInput = parseFloat(val); if (isNaN(sharesInput) || sharesInput <= 0) return;
  if (!planState.trimTranches) planState.trimTranches = [{},{},{}];
  const { symbol, trimTranches, model } = planState;
  const pos = model ? (model.positions.find(p=>p.symbol===symbol) || (model.sgovPos?.symbol===symbol?model.sgovPos:null) || model.watchlist.find(w=>w.symbol===symbol)) : null;
  if (!pos) return;
  const qty = pos.qty || 0;
  const invest = model?.investable || 0;
  const target = (planState.pendingTarget ?? pos?.target) || 0;
  const targetDollar = target * invest;
  const P = trimTranches[idx]?.price || 0;
  if (P <= 0 || targetDollar <= 0) return;
  // Compute shares already sold before this tranche
  let totalSharesSoldBefore = 0;
  for (let i = 0; i < idx; i++) {
    const t = trimTranches[i];
    const tP = t.price || 0, trimP = t.pct || 0;
    if (!tP || !trimP) continue;
    const sellP = trimP;
    totalSharesSoldBefore += (sellP / 100 * targetDollar) / tP;
  }
  const trimPct = sharesInput * P / targetDollar * 100;
  planState.trimTranches[idx].pct = trimPct;
  const pctEl = document.getElementById(`trimPct_${idx}`);
  if (pctEl && document.activeElement !== pctEl) pctEl.value = trimPct.toFixed(2);
  updateTrimCalcs();
};

window.clearTrimRow = function(idx) {
  if (!planState.trimTranches) planState.trimTranches = [{},{},{}];
  planState.trimTranches[idx] = {};
  const p = document.getElementById(`trimPrice_${idx}`);
  const pct = document.getElementById(`trimPct_${idx}`);
  const qty = document.getElementById(`trimQty_${idx}`);
  if (p) p.value = '';
  if (pct) pct.value = '';
  if (qty) qty.value = '';
  updateTrimCalcs();
};

window.savePlanInAction = function() {
  const { symbol, tranches } = planState;
  if (!symbol) return;
  // SL is kept live in planState.sl via oninput — read directly
  // Note has no oninput so read from DOM, then sync
  planState.note = document.getElementById('planNote')?.value?.trim() || '';
  const sl   = planState.sl;
  const note = planState.note;
  // Read target from plan tab input if present
  const tgtEl = document.getElementById('planTargetPct');
  if (tgtEl) {
    const tgt = parseFloat(tgtEl.value);
    if (!isNaN(tgt)) planState.pendingTarget = tgt / 100;
  }
  const tp = planState.trimTranches || [{},{},{}];
  const port = actionModalPort || DEFAULT_PORT;
  setPlan(symbol, port, { tranches, sl, note, trimTranches: tp });
  savePlanToSheet(symbol, tranches, sl, note, tp, port);
  // Also save pending allocation/category if changed
  const params = new URLSearchParams({ action: 'updateSymbol', symbol, portfolio: actionModalPort || DEFAULT_PORT });
  let hasAlloc = false;
  if (planState.pendingTarget !== null)   { params.set('target',   planState.pendingTarget.toFixed(6)); hasAlloc = true; }
  if (planState.pendingCategory !== null) { params.set('category', planState.pendingCategory);          hasAlloc = true; }

  document.getElementById('actionModal')?.classList.remove('open');

};
window.clearTranchesInAction = function() {

  if (tgtEl) { const tgt = parseFloat(tgtEl.value); if (!isNaN(tgt)) planState.pendingTarget = tgt / 100; }
