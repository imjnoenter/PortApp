// ── Render: gauge ─────────────────────────────────────────────────────────────
let _gaugeAnimRaf = null;
function renderGauge(model) {
  const wrap = document.querySelector('.gauge-wrap');
  if (wrap && wrap.clientWidth === 0) {
    requestAnimationFrame(() => renderGauge(model));
    return;
  }
  const invested = model.totalCurrent - model.totalCash;
  const pct = model.totalCurrent > 0 ? invested / model.totalCurrent * 100 : 0;
  const pctEl = document.getElementById('gauge-pct');
  if (pctEl) pctEl.textContent = pct.toFixed(1) + '%';

  // Update stat strip under the gauge
  const statsEl = document.getElementById('allocStats');
  if (statsEl) {
    statsEl.innerHTML = `
      <div class="alloc-stat">
        <span class="alloc-stat-dot" style="background:var(--terracotta)"></span>
        <div>
          <div class="alloc-stat-label">Invested</div>
          <div class="alloc-stat-value">${fmtCurr(invested)}</div>
        </div>
      </div>
      <div class="alloc-stat">
        <span class="alloc-stat-dot" style="background:var(--muted-2)"></span>
        <div>
          <div class="alloc-stat-label">Cash</div>
          <div class="alloc-stat-value">${fmtCurr(model.totalCash)}</div>
        </div>
      </div>`;
  }

  const oldCv = document.getElementById('gaugeChart');
  if (!oldCv) return;
  cancelAnimationFrame(_gaugeAnimRaf);
  try { Chart.getChart(oldCv)?.destroy(); } catch(_) {}
  const cv = document.createElement('canvas');
  cv.id = 'gaugeChart';
  oldCv.parentNode.replaceChild(cv, oldCv);

  // ── roundRect polyfill ──────────────────────────────────────────
  function rrect(ctx2, x, y, w, h, rad) {
    const r = Math.min(rad, w / 2, h / 2);
    ctx2.beginPath();
    ctx2.moveTo(x + r, y);
    ctx2.arcTo(x + w, y,     x + w, y + h, r);
    ctx2.arcTo(x + w, y + h, x,     y + h, r);
    ctx2.arcTo(x,     y + h, x,     y,     r);
    ctx2.arcTo(x,     y,     x + w, y,     r);
    ctx2.closePath();
  }

  const RESERVE = model.cashResPct || 0;   // cash reserve threshold (from portfolio settings)
  const target  = Math.max(0, Math.min(100, pct)) / 100;
  const startTs = performance.now();
  const dur     = 900;

  // Resolve CSS variables once — getComputedStyle is expensive at 60fps
  const monoFont    = css('--font-mono')    || 'monospace';
  const displayFont = css('--font-display') || 'serif';
  const C = {
    track:      css('--track'),
    peri:       css('--peri'),
    terracotta: css('--terracotta'),
    honey:      css('--honey'),
    cardEdge:   css('--card-edge'),
    clay:       css('--clay'),
    sage:       css('--sage'),
    muted:      css('--muted'),
    ink:        css('--ink'),
    line:       css('--line'),
  };

  function draw(now) {
    const t      = Math.min(1, (now - startTs) / dur);
    const eased  = 1 - Math.pow(1 - t, 3);
    const cur    = target * eased;           // animated stock fraction 0-1
    const cashCur = (1 - cur) * 100;        // animated cash %

    const dpr = window.devicePixelRatio || 1;
    const W   = cv.clientWidth  || 300;
    const H   = cv.clientHeight || 130;
    cv.width  = W * dpr;
    cv.height = H * dpr;
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);

    // ── Layout constants ─────────────────────────────────────────
    const padH  = 10;
    const barH  = 26;
    const barX  = padH;
    const barW  = W - padH * 2;
    const barR  = barH / 2;
    const gaugeStyle = window.donutTweaks?.gaugeLabels || 'stacked';
    const barY  = gaugeStyle === 'badge' ? 46 : gaugeStyle === 'inline' ? 42 : 56;

    // ── Bar track ────────────────────────────────────────────────
    ctx.save();
    rrect(ctx, barX, barY, barW, barH, barR);
    ctx.fillStyle = C.track;
    ctx.fill();
    ctx.restore();

    // ── Stock fill (clipped to bar shape) ────────────────────────
    if (cur > 0.003) {
      ctx.save();
      rrect(ctx, barX, barY, barW, barH, barR);
      ctx.clip();
      const fillW = barW * cur;
      const grad  = ctx.createLinearGradient(barX, 0, barX + barW, 0);
      grad.addColorStop(0,    C.peri);
      grad.addColorStop(0.55, C.terracotta);
      grad.addColorStop(1,    C.honey);
      ctx.fillStyle = grad;
      ctx.fillRect(barX, barY, fillW, barH);
      // Sheen highlight
      ctx.fillStyle = 'rgba(255,255,255,0.11)';
      ctx.fillRect(barX, barY, fillW, barH * 0.42);
      ctx.restore();
    }

    // ── Bar inner border ─────────────────────────────────────────
    ctx.save();
    rrect(ctx, barX, barY, barW, barH, barR);
    ctx.strokeStyle = C.cardEdge;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.5;
    ctx.stroke();
    ctx.restore();

    // ── Reserve threshold marker ───────────────────────────
    const reserveX  = barX + barW * (1 - RESERVE);
    const overLimit = cur > (1 - RESERVE);   // cash below reserve target = warning
    const mrkCol    = overLimit ? C.clay : C.sage;

    // Vertical dashed line spanning above + through bar
    ctx.save();
    ctx.setLineDash([3, 3]);
    ctx.lineWidth   = 1.5;
    ctx.strokeStyle = mrkCol;
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.moveTo(reserveX, barY - 26);
    ctx.lineTo(reserveX, barY + barH + 12);
    ctx.stroke();
    ctx.restore();

    // Small downward-pointing triangle above bar
    const triH = 7, triW = 6;
    ctx.save();
    ctx.fillStyle = mrkCol;
    ctx.beginPath();
    ctx.moveTo(reserveX - triW, barY - 26);
    ctx.lineTo(reserveX + triW, barY - 26);
    ctx.lineTo(reserveX,        barY - 26 + triH);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // "X% RESERVE" label below bar
    ctx.save();
    ctx.font          = `500 7.5px ${monoFont}`;
    ctx.fillStyle     = C.muted;
    ctx.textAlign     = 'center';
    ctx.textBaseline  = 'top';
    ctx.letterSpacing = '0.6px';
    ctx.fillText(`${(RESERVE * 100).toFixed(0)}% RESERVE`, reserveX, barY + barH + 5);
    ctx.restore();

    // ── Labels above bar — 3 designs ──────────────────────────────
    const stockPctStr = (cur * 100).toFixed(1) + '%';
    const cashPctStr  = cashCur.toFixed(1) + '%';
    const cashColor   = overLimit ? C.clay : C.ink;
    const investedAmt = model.totalCurrent * cur;
    const cashAmt     = model.totalCurrent * (1 - cur);
    const fmtShort = n => {
      if (n >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
      if (n >= 1e3) return '$' + (n/1e3).toFixed(1) + 'K';
      return '$' + n.toFixed(0);
    };

    if (gaugeStyle === 'inline') {
      // ── V1: Inline — % rendered inside bar ends ───────────────
      const inY = barY + barH / 2;
      // Stock % inside left
      ctx.save();
      ctx.textBaseline = 'middle';
      ctx.textAlign    = 'left';
      ctx.font         = `700 13px ${monoFont}`;
      ctx.fillStyle    = cur > 0.12 ? 'rgba(250,243,224,.95)' : C.ink;
      ctx.fillText(stockPctStr, barX + 12, inY);
      ctx.restore();
      // Cash % inside right
      ctx.save();
      ctx.textBaseline = 'middle';
      ctx.textAlign    = 'right';
      ctx.font         = `700 13px ${monoFont}`;
      ctx.fillStyle    = cur < 0.88 ? C.muted : 'rgba(250,243,224,.95)';
      if (overLimit) ctx.fillStyle = C.clay;
      ctx.fillText(cashPctStr, barX + barW - 12, inY);
      ctx.restore();
      // Subtle labels above bar
      ctx.save();
      ctx.font         = `500 8px ${monoFont}`;
      ctx.fillStyle    = C.muted;
      ctx.globalAlpha  = 0.6;
      ctx.textBaseline = 'bottom';
      ctx.textAlign    = 'left';
      ctx.fillText('INVESTED', barX, barY - 5);
      ctx.textAlign    = 'right';
      ctx.fillText('CASH', barX + barW, barY - 5);
      ctx.restore();

    } else if (gaugeStyle === 'badge') {
      // ── V2: Badge — pill badges floating above bar ────────────
      const badgeH = 26, badgeR = 8, badgePad = 10;
      const badgeY = barY - badgeH - 8;

      // Stock badge (left)
      const stockLbl = stockPctStr + ' Invested';
      ctx.font = `600 11px ${monoFont}`;
      const sw = ctx.measureText(stockLbl).width + badgePad * 2;
      // Badge bg
      ctx.save();
      rrect(ctx, barX, badgeY, sw, badgeH, badgeR);
      ctx.fillStyle = C.terracotta;
      ctx.shadowColor = 'rgba(196,106,74,.25)';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.restore();
      // Badge text
      ctx.save();
      ctx.font         = `600 11px ${monoFont}`;
      ctx.fillStyle    = '#faf3e0';
      ctx.textBaseline = 'middle';
      ctx.textAlign    = 'left';
      ctx.fillText(stockLbl, barX + badgePad, badgeY + badgeH / 2);
      ctx.restore();

      // Cash badge (right)
      const cashLbl = cashPctStr + ' Cash';
      ctx.font = `600 11px ${monoFont}`;
      const cw = ctx.measureText(cashLbl).width + badgePad * 2;
      ctx.save();
      rrect(ctx, barX + barW - cw, badgeY, cw, badgeH, badgeR);
      ctx.fillStyle = overLimit ? C.clay : C.track;
      ctx.strokeStyle = overLimit ? C.clay : C.cardEdge;
      ctx.lineWidth = 1;
      if (!overLimit) ctx.fill();
      else { ctx.shadowColor = 'rgba(187,77,60,.2)'; ctx.shadowBlur = 6; ctx.fill(); }
      if (!overLimit) ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.font         = `600 11px ${monoFont}`;
      ctx.fillStyle    = overLimit ? '#faf3e0' : C.muted;
      ctx.textBaseline = 'middle';
      ctx.textAlign    = 'right';
      ctx.fillText(cashLbl, barX + barW - badgePad, badgeY + badgeH / 2);
      ctx.restore();

    } else {
      // ── V3: Stacked (default) — large %, small $ amount, divider ──
      // Left — Stock
      ctx.save();
      ctx.textBaseline = 'top';
      ctx.textAlign    = 'left';
      ctx.font         = `600 22px ${displayFont}`;
      ctx.fillStyle    = C.ink;
      ctx.fillText(stockPctStr, barX, 4);
      const pctW = ctx.measureText(stockPctStr).width;
      // Thin vertical divider
      ctx.fillStyle = C.line;
      ctx.fillRect(barX + pctW + 8, 8, 1, 18);
      // Currency amount
      ctx.font      = `500 11px ${monoFont}`;
      ctx.fillStyle = C.muted;
      ctx.fillText(fmtShort(investedAmt), barX + pctW + 16, 7);
      // Label
      ctx.font      = `500 8.5px ${monoFont}`;
      ctx.fillStyle = C.muted;
      ctx.globalAlpha = 0.65;
      ctx.fillText('INVESTED', barX + pctW + 16, 21);
      ctx.restore();

      // Right — Cash
      ctx.save();
      ctx.textBaseline = 'top';
      ctx.textAlign    = 'right';
      ctx.font         = `600 22px ${displayFont}`;
      ctx.fillStyle    = cashColor;
      ctx.fillText(cashPctStr, barX + barW, 4);
      const cashW = ctx.measureText(cashPctStr).width;
      // Thin vertical divider
      ctx.fillStyle = C.line;
      ctx.fillRect(barX + barW - cashW - 9, 8, 1, 18);
      // Currency amount
      ctx.font      = `500 11px ${monoFont}`;
      ctx.fillStyle = overLimit ? C.clay : C.muted;
      ctx.textAlign = 'right';
      ctx.fillText(fmtShort(cashAmt), barX + barW - cashW - 16, 7);
      // Label
      ctx.font      = `500 8.5px ${monoFont}`;
      ctx.fillStyle = C.muted;
      ctx.globalAlpha = 0.65;
      ctx.textAlign = 'right';
      ctx.fillText('CASH', barX + barW - cashW - 16, 21);
      ctx.restore();
    }

    if (t < 1) _gaugeAnimRaf = requestAnimationFrame(draw);
  }

  _gaugeAnimRaf = requestAnimationFrame(draw);
}

// ── Render: left position list ────────────────────────────────────────────────
function renderPosList(model) {
  // Allocation panel weights include cash in the denominator (unlike the
  // positions table / risk panel, which weight against equity only), so every
  // row here — stocks and cash — is a slice of the whole portfolio and sums to 100%.
  const items = model.positions
    .map(p => ({
      symbol: p.symbol,
      currentValue: p.currentValue,
      weightPct: model.totalCurrent > 0 ? p.currentValue / model.totalCurrent * 100 : 0,
      isCash: false,
    }))
    .concat([{
      symbol: 'Cash',
      currentValue: model.totalCash,
      weightPct: model.totalCurrent > 0 ? model.totalCash / model.totalCurrent * 100 : 0,
      isCash: true,
    }])
    .sort((a, b) => b.currentValue - a.currentValue);

  const head = document.getElementById('allocListCount');
  if (head) head.textContent = model.positions.length + ' holdings';

  document.getElementById('posList').innerHTML = items.map(p => {
    const c = colorFor(p.symbol);
    return `
      <div class="pos-row">
        <div class="pos-dot" style="background:${c}"></div>
        <div class="pos-sym">${p.symbol}</div>
        <div class="pos-bar-bg"><div class="pos-bar" style="width:${Math.min(p.weightPct,100).toFixed(2)}%;background:${c}"></div></div>
        <div class="pos-meta">
          <div class="pos-pct">${p.weightPct.toFixed(1)}%</div>
          <div class="pos-val">${fmtCurr(p.currentValue)}</div>
        </div>
      </div>`;
  }).join('');
}

// ── Quotes sheet reader (Apps Script → Finnhub → sheet, refreshed every 1 min) ──
async function fetchSheetQuotes() {
  if (!QUOTES_URL) return null;
  try {
    const res = await fetch(QUOTES_URL);
    if (!res.ok) return null;
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('(') + 1, text.lastIndexOf(')')));
    const table = json?.table;
    if (!table?.rows?.length) return null;
    const cols = table.cols.map(c => c.label?.trim() || '');
    const iSym = cols.indexOf('Symbol'), iPrice = cols.indexOf('Price');
    const iChg = cols.indexOf('Change'),  iPct  = cols.indexOf('ChangePct');
    const iAt  = cols.indexOf('UpdatedAt');
    if (iSym < 0 || iPrice < 0 || iChg < 0 || iPct < 0 || iAt < 0) return null;
    const firstAt = table.rows[0]?.c?.[iAt]?.v; // Unix seconds written by Apps Script
    if (!firstAt || Date.now() - firstAt * 1000 > 3 * 60 * 1000) return null; // stale > 3 min
    const quotes = {};
    table.rows.forEach(row => {
      const c = row.c;
      const sym = c[iSym]?.v; if (!sym) return;
      quotes[sym] = {
        regularMarketPrice:         c[iPrice]?.v ?? null,
        regularMarketChange:        c[iChg]?.v   ?? null,
        regularMarketChangePercent: c[iPct]?.v   ?? null,
        marketState: 'REGULAR',
      };
    });
    return Object.keys(quotes).length ? { quotes, updatedAt: firstAt } : null;
  } catch { return null; }
}

// ── Yahoo v7 batch fetch (used for index symbols + fallback) ──────────────────
async function fetchYahooBatch(syms) {
  if (!syms.length) return {};
  const yahooToOrig = {};
  syms.forEach(s => { yahooToOrig[yahooTicker(s)] = s; });
  const sym = syms.map(yahooTicker).join(',');
  for (const base of ['https://query1.finance.yahoo.com','https://query2.finance.yahoo.com']) {
    const url = `${base}/v7/finance/quote?symbols=${sym}`;
    for (const u of [url, `https://corsproxy.io/?url=${encodeURIComponent(url)}`]) {
      try {
        const r = await fetch(u, { headers: { Accept: 'application/json' } });
        if (!r.ok) continue;
        const d = await r.json();
        const results = d?.quoteResponse?.result || [];
        if (results.length) {
          const out = {};
          results.forEach(q => {
            const origSym = yahooToOrig[q.symbol] || q.symbol;
            out[origSym] = q;
            _staticQuoteCache[origSym] = {
              fiftyTwoWeekHigh:     q.fiftyTwoWeekHigh     ?? null,
              fiftyTwoWeekLow:      q.fiftyTwoWeekLow      ?? null,
              earningsTimestamp:    q.earningsTimestamp     ?? null,
              earningsTimestampEnd: q.earningsTimestampEnd  ?? null,
              exDividendDate:       q.exDividendDate        ?? null,
              fiftyDayAverage:              q.fiftyDayAverage              ?? null,
              twoHundredDayAverage:         q.twoHundredDayAverage         ?? null,
              regularMarketVolume:          q.regularMarketVolume           ?? null,
              trailingAnnualDividendYield:  q.trailingAnnualDividendYield  ?? null,
              netExpenseRatio:              q.annualReportExpenseRatio      ?? null,
              netAssets:                    q.totalAssets                  ?? null,
              ytdReturn:                    q.ytdReturn != null ? q.ytdReturn / 100 : null,
            };
          });
          return out;
        }
      } catch {}
    }
  }
  return {};
}

// ── Live quotes (day change + pre/post market) ────────────────────────────────
// Volume source for stocks AND ETFs — CNBC batch quote (CORS-open, no key, no proxy, no Apps Script).
async function fetchCnbcVolumes(symbols) {
  const syms = [...new Set(symbols.filter(s => s && !s.startsWith('^')))];
  if (!syms.length) return {};
  const url = `https://quote.cnbc.com/quote-html-webservice/quote.htm?symbols=${encodeURIComponent(syms.join('|'))}&output=json`;
  try {
    const r = await fetch(url);
    if (!r.ok) return {};
    const j = await r.json();
    let arr = j?.QuickQuoteResult?.QuickQuote ?? j?.FormattedQuoteResult?.FormattedQuote ?? [];
    if (!Array.isArray(arr)) arr = [arr];
    const out = {};
    arr.forEach(q => {
      const v = Number(q.fullVolume ?? q.volume);
      if (q.symbol && Number.isFinite(v)) out[q.symbol] = v;
    });
    return out;
  } catch { return {}; }
}

// Thin wrapper: merges CNBC volume into every quote-source path of _fetchQuotesBase.
async function fetchQuotes(symbols) {
  const out = await _fetchQuotesBase(symbols);
  try {
    const vols = await fetchCnbcVolumes(symbols);
    for (const s of Object.keys(vols)) {
      (out[s] || (out[s] = {})).regularMarketVolume = vols[s];
    }
  } catch (_) {}
  return out;
}

async function _fetchQuotesBase(symbols) {
  if (!symbols.length) return {};

  // Market hours: read from Quotes sheet; fetch anything missing from Yahoo
  if (isMarketOpen()) {
    const fresh = await fetchSheetQuotes();
    if (fresh) {
      _lastQuoteSource = { type: 'sheet', updatedAt: fresh.updatedAt };
      const out = {};
      const missingFromSheet = [];
      const needsStatic = []; // has Finnhub price but no 52W data cached yet
      symbols.forEach(s => {
        const live      = fresh.quotes[s];
        const validLive = live?.regularMarketPrice > 0 ? live : null; // null if Finnhub returned no data
        const stat      = _staticQuoteCache[s];
        if (validLive || stat) {
          out[s] = { ...stat, ...(validLive || {})};
          if (validLive && !stat) needsStatic.push(s);
        } else {
          missingFromSheet.push(s);
        }
      });
      const toYahoo = [...missingFromSheet, ...needsStatic];
      if (toYahoo.length) {
        const yahooData = await fetchYahooBatch(toYahoo);
        missingFromSheet.forEach(s => { if (yahooData[s]) out[s] = yahooData[s]; });
        // Merge only 52W/earnings fields into Finnhub-priced entries (Finnhub price/change takes precedence)
        needsStatic.forEach(s => {
          const stat = _staticQuoteCache[s]; // populated as side-effect of fetchYahooBatch
          if (stat && out[s]) out[s] = { ...stat, ...out[s] };
        });
        // v8/chart fallback: v7/quote failed for some needsStatic symbols — mirrors non-market fallback
        const still = needsStatic.filter(s => !_staticQuoteCache[s]);
        if (still.length) {
          const chartEntries = await Promise.all(still.map(s => fetchSingleQuoteFromChart(s)));
          chartEntries.forEach(([s, q]) => {
            const hi = q?.fiftyTwoWeekHigh, lo = q?.fiftyTwoWeekLow;
            if (hi && out[s]) {
              _staticQuoteCache[s] = { fiftyTwoWeekHigh: hi, fiftyTwoWeekLow: lo ?? null, earningsTimestamp: null, earningsTimestampEnd: null, exDividendDate: null };
              out[s] = { fiftyTwoWeekHigh: hi, fiftyTwoWeekLow: lo ?? null, ...out[s] };
            }
          });
        }
      }
      if (Object.keys(out).length) return out;
    }
  }

  _lastQuoteSource = { type: 'yahoo' };
  // Full Yahoo batch for all symbols (non-market hours or sheet unavailable)
  const out = await fetchYahooBatch(symbols);
  if (Object.keys(out).length) return out;

  // Fallback: intraday chart with includePrePost=true — extracts pre/post prices from candles
  const entries = await Promise.all(symbols.map(s => fetchSingleQuoteFromChart(s, yahooTicker(s))));
  const chartOut = {};
  entries.forEach(([s, q]) => { if (q) chartOut[s] = q; });
  return chartOut;
}

async function fetchSingleQuoteFromChart(symbol, yahooSym = yahooTicker(symbol)) {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(yahooSym)}?range=1d&interval=5m&includePrePost=true`;
  let data = null;
  for (const u of [url, `https://corsproxy.io/?url=${encodeURIComponent(url)}`]) {
    try { const r = await fetch(u); if (r.ok) { data = await r.json(); break; } } catch {}
  }
  if (!data) return [symbol, null];

  const result = data?.chart?.result?.[0];
  if (!result) return [symbol, null];

  const meta       = result.meta;
  const timestamps = result.timestamp || [];
  const closes     = result.indicators?.quote?.[0]?.close || [];
  const prevClose  = meta.chartPreviousClose ?? meta.previousClose;
  const regPrice   = meta.regularMarketPrice;
  if (!regPrice) return [symbol, null];

  const dayChange    = meta.regularMarketChange    ?? (prevClose ? regPrice - prevClose : null);
  const dayChangePct = meta.regularMarketChangePercent ?? (prevClose && dayChange != null ? dayChange / prevClose * 100 : null);

  // Determine market state and extract pre/post prices from candle timestamps
  const ctp = meta.currentTradingPeriod;
  const regStart = ctp?.regular?.start;
  const regEnd   = ctp?.regular?.end;
  const nowSec   = Date.now() / 1000;

  let marketState = 'REGULAR';
  let preMarketPrice = null, preMarketChangePercent = null;
  let postMarketPrice = null, postMarketChangePercent = null;

  if (regStart && regEnd) {
    if (nowSec < regStart) {
      marketState = 'PRE';
      for (let i = timestamps.length - 1; i >= 0; i--) {
        if (timestamps[i] < regStart && closes[i] != null) {
          preMarketPrice = closes[i];
          preMarketChangePercent = regPrice ? (preMarketPrice - regPrice) / regPrice * 100 : null;
          break;
        }
      }
    } else if (nowSec > regEnd) {
      marketState = 'POST';
      for (let i = timestamps.length - 1; i >= 0; i--) {
        if (timestamps[i] > regEnd && closes[i] != null) {
          postMarketPrice = closes[i];
          postMarketChangePercent = regPrice ? (postMarketPrice - regPrice) / regPrice * 100 : null;
          break;
        }
      }
    }
  }

  return [symbol, { regularMarketChange: dayChange, regularMarketChangePercent: dayChangePct,
    marketState, preMarketPrice, preMarketChangePercent, postMarketPrice, postMarketChangePercent,
    fiftyTwoWeekHigh: meta.fiftyTwoWeekHigh ?? null,
    fiftyTwoWeekLow:  meta.fiftyTwoWeekLow  ?? null }];
}

function attachQuotes(model, quotes) {
  const targets = [...model.positions, ...(model.sgovPos ? [model.sgovPos] : [])];
  targets.forEach(p => {
    const q = quotes[p.symbol]; if (!q) return;
    p.dayChange    = q.regularMarketChange        ?? null;
    p.dayChangePct = q.regularMarketChangePercent ?? null;
    p.marketState  = q.marketState ?? 'REGULAR';
    const reg      = q.regularMarketPrice ?? p.price;
    p.preMarketPrice  = q.preMarketPrice  ?? null;
    p.postMarketPrice = q.postMarketPrice ?? null;
    p.preMarketPct  = p.preMarketPrice  && reg ? (p.preMarketPrice  - reg) / reg * 100 : null;
    p.postMarketPct = p.postMarketPrice && reg ? (p.postMarketPrice - reg) / reg * 100 : null;
    // 52-week range
    p.week52High = q.fiftyTwoWeekHigh ?? null;
    p.week52Low  = q.fiftyTwoWeekLow  ?? null;
    p.volume           = q.regularMarketVolume          ?? null;
    p.expenseRatio     = q.netExpenseRatio              ?? null;
    p.netAssets        = q.netAssets                    ?? null;
    p.ytdReturnQ       = q.ytdReturn                    ?? null;
  });
  // Quotes + calendar for watchlist
  model.watchlist.forEach(w => {
    const q = quotes[w.symbol]; if (!q) return;
    const reg = q.regularMarketPrice ?? w.price;
    w.dayChange    = q.regularMarketChange        ?? null;
    w.dayChangePct = q.regularMarketChangePercent ?? null;
    w.marketState  = q.marketState ?? 'REGULAR';
    w.preMarketPrice  = q.preMarketPrice  ?? null;
    w.postMarketPrice = q.postMarketPrice ?? null;
    w.preMarketPct  = w.preMarketPrice  && reg ? (w.preMarketPrice  - reg) / reg * 100 : null;
    w.postMarketPct = w.postMarketPrice && reg ? (w.postMarketPrice - reg) / reg * 100 : null;
    w.volume           = q.regularMarketVolume          ?? null;
    w.expenseRatio     = q.netExpenseRatio              ?? null;
    w.netAssets        = q.netAssets                    ?? null;
    w.ytdReturnQ       = q.ytdReturn                    ?? null;
  });
}

const ETF_DATA_TTL = 24 * 60 * 60 * 1000;
const ETF_DATA_LS_KEY = 'etfData.v1';

function _readEtfLocalCache() {
  try { return JSON.parse(localStorage.getItem(ETF_DATA_LS_KEY)) || {}; }
  catch { return {}; }
}

function _writeEtfLocalCache(cache) {
  try { localStorage.setItem(ETF_DATA_LS_KEY, JSON.stringify(cache)); }
  catch {}
}

async function fetchEtfData(symbols) {
  const etfSyms = symbols.filter(s =>
    _allRows.some(r => r.symbol === s && (r.sector === 'ETF' || r.category === 'ETF' || r.portfolio === 'ETF'))
  );
  if (!etfSyms.length) return;

  const now = Date.now();

  // Restore from localStorage for symbols not yet in memory
  const localCache = _readEtfLocalCache();
  for (const s of etfSyms) {
    if (!_etfDataCache[s] && localCache[s] && now - localCache[s].fetchedAt < ETF_DATA_TTL) {
      _etfDataCache[s] = localCache[s];
    }
  }

  // Fetch symbols still missing or stale
  const needed = etfSyms.filter(s => {
    const cached = _etfDataCache[s];
    return !cached || now - cached.fetchedAt > ETF_DATA_TTL || !cached.topHoldings;
  });

  if (needed.length) {
    try {
      const resp = await recordFetch({ action: 'fetchHoldings', symbols: needed.join(',') }, true);
      if (resp?.ok && resp.etfData) {
        const ts = Date.now();
        for (const [sym, data] of Object.entries(resp.etfData)) {
          if (data) _etfDataCache[sym] = { ...data, fetchedAt: ts };
        }
        // Persist to localStorage, evict stale
        const updated = { ..._readEtfLocalCache() };
        for (const [sym, data] of Object.entries(_etfDataCache)) {
          updated[sym] = data;
        }
        for (const key of Object.keys(updated)) {
          if (ts - updated[key].fetchedAt > ETF_DATA_TTL) delete updated[key];
        }
        _writeEtfLocalCache(updated);
      }
    } catch {}
  }

  // Apply to positions
  if (!currentModel) return;
  for (const p of [...currentModel.positions, ...(currentModel.sgovPos ? [currentModel.sgovPos] : [])]) {
    const d = _etfDataCache[p.symbol];
    if (!d) continue;
    // volume now comes from CNBC via fetchQuotes/attachQuotes (always-fresh); ETF cache no longer sets it
    if (d.ytdReturn != null)           p.ytdReturnQ       = d.ytdReturn;
    if (d.expenseRatio != null)        p.expenseRatio     = d.expenseRatio;
    if (d.netAssets != null)           p.netAssets         = d.netAssets;
    if (d.fiftyDayAverage != null)     p.fiftyDayAvg      = d.fiftyDayAverage;
    if (d.twoHundredDayAverage != null) p.twoHundredDayAvg = d.twoHundredDayAverage;
    if (d.dividendYield != null)       p.dividendYield    = d.dividendYield;
    if (d.holdingsCount != null)       p.holdingsCount    = d.holdingsCount;
  }
  renderTable(currentModel);
  renderTopHoldings(currentModel);
  renderSectorDonut(currentModel);
  renderIndustryDonut(currentModel);
}

async function fetchStockReturns() {
  if (!RETURNS_URL) return;
  try {
    const res = await fetch(RETURNS_URL);
    if (!res.ok) return;
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('(') + 1, text.lastIndexOf(')')));
    const table = json?.table;
    if (!table?.rows?.length) return;
    const cols = table.cols.map(c => c.label?.trim() || '');
    const iSym = cols.indexOf('Symbol'), i1M = cols.indexOf('1M'), i3M = cols.indexOf('3M');
    const iYTD = cols.indexOf('YTD'), i1Y = cols.indexOf('1Y'), i3Y = cols.indexOf('3Y');
    const i5Y = cols.indexOf('5Y');
    if (iSym < 0) return;
    table.rows.forEach(row => {
      const c = row.c;
      const sym = c[iSym]?.v; if (!sym) return;
      const pct = i => i >= 0 && c[i]?.v != null ? c[i].v / 100 : null;
      _stockReturnsCache[sym] = {
        '1M': pct(i1M), '3M': pct(i3M), 'YTD': pct(iYTD),
        '1Y': pct(i1Y), '3Y': pct(i3Y), '5Y': pct(i5Y),
      };
    });
  } catch {}
  if (_posTab === 'performance' && currentModel) renderTable(currentModel);
}

let _topHoldingSectors = {};
let _sectorFetchInFlight = false;

function renderTopHoldings(model) {
  const card = document.getElementById('topHoldingsCard');
  const body = document.getElementById('topHoldingsBody');
  if (!card || !body) return;

  if (activePortfolio !== 'ETF') { card.style.display = 'none'; return; }

  const allPos = [...(model.positions || []), ...(model.sgovPos ? [model.sgovPos] : [])];
  const totalVal = allPos.reduce((s, p) => s + (p.currentValue || 0), 0);
  if (totalVal <= 0) { card.style.display = 'none'; return; }

  const agg = {};
  for (const p of allPos) {
    const d = _etfDataCache[p.symbol];
    if (!d?.topHoldings?.length) continue;
    const etfWeight = (p.currentValue || 0) / totalVal;
    for (const h of d.topHoldings) {
      if (!h.symbol || !h.weight) continue;
      if (!agg[h.symbol]) agg[h.symbol] = { symbol: h.symbol, name: h.name || h.symbol, blended: 0, sources: [] };
      agg[h.symbol].blended += h.weight * etfWeight;
      agg[h.symbol].sources.push({ ticker: p.symbol, weight: h.weight });
      if (h.name && h.name !== h.symbol) agg[h.symbol].name = h.name;
    }
  }

  const sorted = Object.values(agg).sort((a, b) => b.blended - a.blended).slice(0, 20);
  if (!sorted.length) { card.style.display = 'none'; return; }

  card.style.display = '';

  const needed = sorted.map(h => h.symbol).filter(s => s && !_topHoldingSectors[s]);
  if (needed.length && !_sectorFetchInFlight) {
    _sectorFetchInFlight = true;
    recordFetch({ action: 'fetchStockSectors', symbols: needed.join(',') }, true)
      .then(resp => {
        if (!resp?.ok || !resp.sectors) return;
        for (const [sym, info] of Object.entries(resp.sectors)) {
          _topHoldingSectors[sym] = info.sector || '—';
        }
        for (const s of needed) { if (!_topHoldingSectors[s]) _topHoldingSectors[s] = '—'; }
        _renderTopHoldingsTable(body, sorted);
        if (activePortfolio === 'ETF' && currentModel) renderSectorDonut(currentModel);
      })
      .catch(() => {})
      .finally(() => { _sectorFetchInFlight = false; });
  }

  _renderTopHoldingsTable(body, sorted);
}

function _renderTopHoldingsTable(body, sorted) {
  body.innerHTML = `<div class="table-scroll"><table class="pos-table top-holdings-tbl">
    <colgroup>
      <col style="width:2.5rem"><col style="width:4.5rem"><col><col style="width:6rem"><col><col style="width:6rem">
    </colgroup>
    <thead><tr>
      <th>#</th>
      <th>Symbol</th>
      <th>Stock Name</th>
      <th style="text-align:right">Weight</th>
      <th>Breakdown</th>
      <th>Sector</th>
    </tr></thead>
    <tbody>${sorted.map((h, i) => {
      const pct = (h.blended * 100).toFixed(2);
      const breakdown = h.sources.map(s => `${s.ticker} ${(s.weight * 100).toFixed(2)}%`).join(' · ');
      const sector = _topHoldingSectors[h.symbol] || '—';
      return `<tr>

  </table></div>`;
}

function slWarningBadge(sym, price) {
  const sl = getPlan(sym)?.sl;
  if (!sl || !price) return '';
  const pct = (price - sl) / sl * 100;
  if (pct <= 0) return `<span title="${t('sl_reached_tooltip')}" style="margin-left:3px;color:var(--loss);font-size:11px;font-weight:900;vertical-align:middle">🔴</span>`;
  if (pct <= 5) return `<span title="Near Stop Loss (${pct.toFixed(1)}%)" style="margin-left:3px;color:var(--honey);font-size:11px;vertical-align:middle">⚠</span>`;
  return '';
}

// Small pill badge shared by the entry-tranche and take-profit indicators.
function planBadge(label, title, bg, color) {
  return `<span title="${title}" style="margin-left:3px;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:${bg};color:${color};vertical-align:middle">${label}</span>`;
}

function trancheBadge(sym, price) {
  if (!price) return '';
  const tranches = getPlan(sym)?.tranches || [];
  let html = '';
  tranches.forEach((t, i) => {
    if (!t.price || t.price <= 0) return;
    const pct = (price - t.price) / t.price * 100;
    if (pct <= 0) {
      html += planBadge(`T${i+1}`, `T${i+1} entry reached! (${fmtCurr(t.price)})`, 'rgba(107,142,90,.2)', 'var(--gain)');
    } else if (pct <= 3) {
      html += planBadge(`T${i+1}`, `T${i+1} within ${pct.toFixed(1)}% (${fmtCurr(t.price)})`, 'rgba(199,144,56,.2)', 'var(--honey)');
    }
  });
  return html;
}

function tpBadge(sym, price) {
  if (!price) return '';
  const trims = getPlan(sym)?.trimTranches || [];
  let html = '';
  trims.forEach((t, i) => {
    if (!t.price || t.price <= 0) return;
    const pct = (price - t.price) / t.price * 100; // positive = price above TP level
    if (pct >= 0) {
      html += planBadge(`TP${i+1}`, `TP${i+1} reached! (${fmtCurr(t.price)})`, 'rgba(107,142,90,.25)', 'var(--gain)');
    } else if (pct >= -3) {
      html += planBadge(`TP${i+1}`, `TP${i+1} within ${Math.abs(pct).toFixed(1)}% (${fmtCurr(t.price)})`, 'rgba(199,144,56,.2)', 'var(--honey)');
    }
  });
  return html;
}

let sortKey = 'currentValue', sortDir = -1, searchTerm = '', categoryFilter = 'All', sectorFilter = 'All';

function weekRange52Bar(p) {
  const hi = p.week52High, lo = p.week52Low, cur = p.price;
  if (!hi || !lo || !cur || hi <= lo) return '<span class="cell-mut" style="font-size:10px">—</span>';
  const pct = Math.max(0, Math.min(100, (cur - lo) / (hi - lo) * 100));
  const fromHigh = (cur - hi) / hi * 100;
  const fromHighStr = fromHigh >= 0 ? `+${fromHigh.toFixed(1)}%` : `${fromHigh.toFixed(1)}%`;
  const barColor = pct >= 80 ? 'var(--gain)' : pct <= 20 ? 'var(--loss)' : 'var(--terracotta)';
  return `<div class="w52-wrap" title="52W Low: ${fmtCurr(lo)} · High: ${fmtCurr(hi)} · Current: ${pct.toFixed(0)}% of range">
    <div class="w52-track">
      <div class="w52-fill" style="width:${pct.toFixed(1)}%;background:${barColor}"></div>
      <div class="w52-dot" style="left:${pct.toFixed(1)}%;background:${barColor}"></div>
    </div>
    <div class="w52-labels">
      <span class="cell-mut">${fmtCurr(lo)}</span>
      <span style="color:${barColor};font-weight:600">${fromHighStr}</span>
      <span class="cell-mut">${fmtCurr(hi)}</span>
    </div>
  </div>`;
}

function allocSparkline(p, investable) {
  const curr = p.weightPct;
  const tgt  = p.target != null ? p.target * 100 : null;
  const targetAmt = p.target != null ? p.target * investable : null;
  const percentToTarget = (targetAmt && targetAmt > 0) ? (p.currentValue / targetAmt) * 100 : 0;

  if (tgt == null) {
    return `<div class="alloc-spark">
      <div class="spark-track"><div class="spark-fill" style="width:${Math.min(curr,100).toFixed(2)}%;background:${colorFor(p.symbol)}"></div></div>
      <div style="font-size:9px;color:var(--muted);margin-top:2px">${fmtCurr(p.currentValue)}</div>
    </div>`;
  }
  const scale = Math.max(percentToTarget, 100);
  const fillW = (percentToTarget / scale * 100).toFixed(2);
  const tickL = (100 / scale * 100).toFixed(2);
  const cls   = Math.abs(curr - tgt) <= 0.5 ? 'ok' : curr > tgt ? 'over' : 'under';
  return `<div class="alloc-spark">
    <div class="spark-track">
      <div class="spark-fill" style="width:${fillW}%;background:${colorFor(p.symbol)}"></div>
      <div class="spark-tick" style="left:${tickL}%"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:9px;margin-top:2px;white-space:nowrap">
      <span style="color:var(--muted)">/ ${fmtCurr(targetAmt)}</span>
      ${(() => { const d = targetAmt - p.currentValue; return `<span class="spark-diff ${cls}">${d>=0?'+':''}${fmtCurr(d)} (${percentToTarget.toFixed(0)}%)</span>`; })()}
    </div>
  </div>`;
}

function toAddCell(p, investable) {
  if (p.target == null || p.target <= 0) return `<span class="to-add none">—</span>`;
  const need = p.target * investable - p.currentValue;
  if (need >= 0) return `<span class="to-add buy">+${fmtCurr(need)}</span>`;
  return `<span class="to-add over">${fmtCurr(need)}</span>`;
}

function renderTable(model) {
  if (_posTab === 'performance') { renderPerformanceTable(model); return; }
  const titleEl = document.getElementById('posTitle');
  if (titleEl) titleEl.textContent = `${model.positions.length} ${t('positions_title')}`;

  const drEl = document.getElementById('posDayReturn');
  if (drEl) {
    const allP = [...model.positions, ...(model.sgovPos ? [model.sgovPos] : [])];
    const withData = allP.filter(p => p.dayChange != null);
    if (withData.length) {
      const totalDR  = withData.reduce((s, p) => s + p.dayChange * p.qty, 0);
      const totalVal = withData.reduce((s, p) => s + p.currentValue, 0);
      const pct = totalVal > 0 ? totalDR / totalVal * 100 : 0;
      const up  = totalDR >= 0;
      const col = `var(${up ? '--gain' : '--loss'})`;
      drEl.innerHTML = `${t('th_day_return')}: <span style="color:${col};font-weight:600">${up?'+':''}${fmtCurr(totalDR)} (${up?'+':''}${pct.toFixed(2)}%)</span>`;
    } else {
      drEl.textContent = '';
    }
  }
  const q = searchTerm.trim().toUpperCase();
  const showWatchlist = categoryFilter === t('Watchlist');
  let filtered;
  if (showWatchlist) {
    filtered = model.watchlist.filter(w => !q || w.symbol.toUpperCase().includes(q));
    if (titleEl) titleEl.textContent = `${filtered.length} ${t('Watchlist')}`;
    renderWeightBar([]);
    document.getElementById('posTable').innerHTML =
      `<table class="pos-table"><thead><tr>${
        [t('th_symbol'),t('th_last_price'),t('th_day_change'),t('th_day_return'),t('total_ret'),t('th_quantity'),t('th_avg_cost'),t('th_total_cost'),t('th_current_value'),t('allocation')].map(l=>`<th style="cursor:default">${l}</th>`).join('')
      }</tr></thead><tbody>${filtered.map(watchlistRow).join('')}</tbody></table>`;
    return;
  }
  filtered = model.positions;
  if (categoryFilter !== 'All') filtered = filtered.filter(p => (p.category || 'Other') === categoryFilter);
  if (sectorFilter   !== 'All') filtered = filtered.filter(p => (p.sector   || 'Other') === sectorFilter);
  if (q) filtered = filtered.filter(p => p.symbol.toUpperCase().includes(q));
  const sorted = [...filtered].sort((a, b) => {
    if (sortKey === 'symbol') return sortDir * a.symbol.localeCompare(b.symbol);
    if (sortKey === 'price') {
      const aPct = a.preMarketPct ?? a.postMarketPct ?? null;
      const bPct = b.preMarketPct ?? b.postMarketPct ?? null;
      if (aPct != null || bPct != null) return sortDir * ((aPct ?? 0) - (bPct ?? 0));
    }
    return sortDir * ((a[sortKey] || 0) - (b[sortKey] || 0));
  });
  renderWeightBar(sorted);

  const headers = [
    { key: 'symbol',       label: t('th_symbol'),        sort: true  },
    { key: 'price',        label: t('th_last_price'),    sort: true  },
    { key: 'dayChangePct', label: t('th_day_change'),    sort: true  },
    { key: 'dayChangePct', label: t('th_day_return'),    sort: true  },
    { key: 'pnlPct',       label: t('total_ret'),        sort: true  },
    { key: 'qty',          label: t('th_quantity'),      sort: true  },
    { key: 'avgPrice',     label: t('th_avg_cost'),      sort: true  },
    { key: 'costBasis',    label: t('th_total_cost'),    sort: true  },
    { key: 'currentValue', label: t('th_current_value'), sort: true  },
    { key: null,           label: t('allocation'),       sort: false },
    { key: null,           label: '52W Range',            sort: false },
    { key: 'category',    label: t('category_label'),   sort: false },
  ];
  const thHTML = headers.map(h => h.sort
    ? `<th onclick="sortTable('${h.key}')">${h.label}${sortKey===h.key ? ' '+(sortDir>0?'↑':'↓') : ''}</th>`
    : `<th style="cursor:default">${h.label}</th>`
  ).join('');

  // Two-line cell helper
  const dc = (main, sub, subCls='cell-mut') =>
    `<div class="cell-main">${main}</div>${sub != null ? `<div class="cell-sub ${subCls}">${sub}</div>` : ''}`;


  function stockRow(p, num) {
    const color = colorFor(p.symbol);
    const totalUp = p.pnl >= 0;

    // Last price + pre/post market
    let priceSub = null, priceSubCls = 'cell-mut';
    const ms = p.marketState;
    if (ms === 'PRE' && p.preMarketPrice) {
      priceSubCls = (p.preMarketPct||0) >= 0 ? 'cell-up' : 'cell-dn';
      priceSub = `☀︎ ${fmtCurr(p.preMarketPrice)} (${(p.preMarketPct||0)>=0?'+':''}${(p.preMarketPct||0).toFixed(2)}%)`;
    } else if ((ms === 'POST' || ms === 'CLOSED') && p.postMarketPrice) {

  const cashPct = model.totalCurrent > 0 ? model.rawCash / model.totalCurrent * 100 : 0;

      </div>
      <div><div class="asset-sym">Cash</div><div class="asset-name">Raw cash · not invested</div></div>
    </div></td>
    <td colspan="8"></td>
    <td>${dc(fmtCurr(model.rawCash), cashPct.toFixed(1)+'%', 'cell-mut')}</td>
    <td>${dc(fmtCurr(model.cashResPct * model.totalCurrent)+' reserved', (model.cashResPct*100).toFixed(0)+'% target', 'cell-mut')}</td>

  document.getElementById('posTable').innerHTML =
    `<table class="pos-table"><thead><tr>${thHTML}</tr></thead><tbody>${sorted.map((p,i) => stockRow(p,i+1)).join('')}${cashRow}</tbody></table>`;

function renderPerformanceTable(model) {
  const titleEl = document.getElementById('posTitle');
  const showWatchlist = categoryFilter === t('Watchlist');
  if (titleEl) titleEl.textContent = `${model.positions.length} ${t('positions_title')}`;
  const drEl = document.getElementById('posDayReturn');
  if (drEl && !showWatchlist) {
    const allP = [...model.positions, ...(model.sgovPos ? [model.sgovPos] : [])];
    const withData = allP.filter(p => p.dayChange != null);
    if (withData.length) {
      const totalDR  = withData.reduce((s, p) => s + p.dayChange * p.qty, 0);
      const totalVal = withData.reduce((s, p) => s + p.currentValue, 0);
      const pct = totalVal > 0 ? totalDR / totalVal * 100 : 0;
      const up  = totalDR >= 0;
      const col = `var(${up ? '--gain' : '--loss'})`;
      drEl.innerHTML = `${t('th_day_return')}: <span style="color:${col};font-weight:600">${up?'+':''}${fmtCurr(totalDR)} (${up?'+':''}${pct.toFixed(2)}%)</span>`;
    } else {
      drEl.textContent = '';
    }
  } else if (drEl) {
    drEl.textContent = '';
  }

  const q = searchTerm.trim().toUpperCase();
  let filtered = showWatchlist ? model.watchlist : model.positions;
  if (!showWatchlist) {
    if (categoryFilter !== 'All') filtered = filtered.filter(p => (p.category || 'Other') === categoryFilter);
    if (sectorFilter !== 'All') filtered = filtered.filter(p => (p.sector || 'Other') === sectorFilter);
  }
  if (q) filtered = filtered.filter(p => p.symbol.toUpperCase().includes(q));
  const sorted = [...filtered].sort((a, b) => {
    if (sortKey === 'symbol') return sortDir * a.symbol.localeCompare(b.symbol);
    return sortDir * ((a[sortKey] || 0) - (b[sortKey] || 0));
  });
  if (showWatchlist && titleEl) titleEl.textContent = `${sorted.length} ${t('Watchlist')}`;
  renderWeightBar(showWatchlist ? [] : sorted);

  const hasEtf = activePortfolio === 'ETF'
    || sorted.some(p => p.expenseRatio != null || p.netAssets != null || p.holdingsCount != null)
    || sorted.some(p => _etfDataCache[p.symbol]?.netAssets != null)
    || (activePortfolio === 'ALL' && _allRows.some(r => r.portfolio === 'ETF'));
  const isEtfView = activePortfolio === 'ETF';

  const retCell = (val) => {
    if (val == null) return `<span class="perf-muted">—</span>`;
    const cls = val > 0 ? 'up' : val < 0 ? 'dn' : 'flat';
    return `<span class="perf-ret ${cls}">${val > 0 ? '+' : ''}${val.toFixed(2)}%</span>`;
  };

  const headers = [
    { key: 'symbol', label: t('th_symbol'), align: 'left' },
    { key: 'price', label: t('th_last_price'), align: 'right' },
  ];
  if (!isEtfView) headers.push({ key: 'marketCap', label: 'Market Cap', align: 'right' });
  headers.push(
    { key: 'volume', label: 'Volume', align: 'right' },
    { key: 'ytdRet', label: 'YTD', align: 'right' },
    { key: '1M', label: '1-Mo', align: 'right' },
    { key: '3M', label: '3-Mo', align: 'right' },
    { key: '1Y', label: '1-Yr', align: 'right' },
    { key: '3Y', label: '3-Yr', align: 'right' },
    { key: '5Y', label: '5-Yr', align: 'right' },
  );
  if (hasEtf) {
    headers.push({ key: 'expenseRatio', label: 'Net ER', align: 'right' });
    headers.push({ key: 'netAssets', label: 'Net Assets', align: 'right' });
    headers.push({ key: 'holdingsCount', label: 'Holdings', align: 'right' });
  }
  headers.push(
    { key: null, label: 'Sector', align: 'left' },
    { key: null, label: 'Industry', align: 'left' },
    { key: null, label: '1Y', align: 'center' },
  );

  const thHTML = headers.map(h =>
    h.key ? `<th style="text-align:${h.align}" onclick="sortTable('${h.key}')">${h.label}${sortKey === h.key ? ' ' + (sortDir > 0 ? '↑' : '↓') : ''}</th>`
           : `<th style="text-align:${h.align};cursor:default">${h.label}</th>`
  ).join('');

  function perfRow(p) {
    const color = colorFor(p.symbol);
    const etf = _etfDataCache[p.symbol];
    const tr = etf?.trailingReturns;
    const sr = _stockReturnsCache[p.symbol];
    const computed = computePeriodReturns(p.symbol, p.price);
    const source = tr || sr;
    const pr = source ? {
      '1M': source['1M'] != null ? source['1M'] * 100 : computed['1M'],
      '3M': source['3M'] != null ? source['3M'] * 100 : computed['3M'],
      '1Y': source['1Y'] != null ? source['1Y'] * 100 : computed['1Y'],
      '3Y': source['3Y'] != null ? source['3Y'] * 100 : computed['3Y'],
      '5Y': source['5Y'] != null ? source['5Y'] * 100 : computed['5Y'],
    } : computed;
    // Read ETF quote fields from _etfDataCache (module-level, persisted) so they survive
    // portfolio-toggle model rebuilds + attachQuotes nulling — same pattern as trailingReturns
    // above. Fall back to any value applied onto the position object.
    const eYtd = etf?.ytdReturn    ?? p.ytdReturnQ;
    const eExp = etf?.expenseRatio ?? p.expenseRatio;
    const eNA  = etf?.netAssets    ?? p.netAssets;
    const eHC  = etf?.holdingsCount ?? p.holdingsCount;
    const ytdVal = eYtd != null ? eYtd * 100
      : (source?.YTD != null ? source.YTD * 100 : computed.YTD);

    let etfCols = '';
    if (hasEtf) {
      etfCols = `<td>${eExp != null ? `<span class="perf-num">${(eExp * 100).toFixed(2)}%</span>` : '<span class="perf-muted">—</span>'}</td>`
              + `<td>${eNA != null ? `<span class="perf-num">${fmtCompact(eNA)}</span>` : '<span class="perf-muted">—</span>'}</td>`
              + `<td>${eHC != null ? `<span class="perf-num">${Number(eHC).toLocaleString()}</span>` : '<span class="perf-muted">—</span>'}</td>`;
    }

    return `<tr onclick="openActionModal('${p.symbol}')" style="cursor:pointer">
      <td><div class="asset-cell">${logoCell(p.symbol, color)}
        <div><div class="asset-sym">${p.symbol}</div><div class="asset-name">${p.name}</div></div>
      </div></td>
      <td><span class="perf-num">${fmtCurr(p.price)}</span></td>
      ${isEtfView ? '' : `<td>${p.marketCap != null ? `<span class="perf-num">${fmtCompact(p.marketCap)}</span>` : '<span class="perf-muted">—</span>'}</td>`}
      <td><span class="perf-muted">${fmtVol(p.volume)}</span></td>
      <td>${retCell(ytdVal)}</td>
      <td>${retCell(pr['1M'])}</td>
      <td>${retCell(pr['3M'])}</td>
      <td>${retCell(pr['1Y'])}</td>
      <td>${retCell(pr['3Y'])}</td>
      <td>${retCell(pr['5Y'])}</td>
      ${etfCols}
      <td><span style="font-size:11px;color:var(--muted)">${etf?.topSector || p.sector || '—'}</span></td>
      <td><span style="font-size:11px;color:var(--muted)">${p.industry || '—'}</span></td>
      <td>${priceSpark(p.symbol)}</td>
    </tr>`;
  }

  const colCount = headers.length;
  const cashRow = `<tr style="background:var(--hover)">
    <td><div class="asset-cell">
      <div class="logo-wrap" style="background:var(--muted)">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="16" height="16"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      </div>
      <div><div class="asset-sym">Cash</div><div class="asset-name">Raw cash · not invested</div></div>
    </div></td>
    <td colspan="${colCount - 1}"></td>
  </tr>`;

  document.getElementById('posTable').innerHTML =
    `<table class="pos-table"><thead><tr>${thHTML}</tr></thead><tbody>${sorted.map(p => perfRow(p)).join('')}${showWatchlist ? '' : cashRow}</tbody></table>`;
}

// ── Render: donut ──────────────────────────────────────────────────────────
// Tweakable donut design — knobs read live from window.donutTweaks
const DONUT_DEFAULTS = /*EDITMODE-BEGIN*/{
  "cutout": 68,
  "spacing": 0,
  "borderWidth": 2,
  "borderRadius": 6,
  "hoverOffset": 8,
  "labelDistance": 8,
  "labelMinPct": 2,
  "showLabels": true,
  "showInnerRing": false,
  "showShadow": false,
  "animationMs": 650,
  "planBtnStyle": "compact",
  "gaugeLabels": "badge",
  "allocDonut": "cozy"
}/*EDITMODE-END*/;
window.donutTweaks = { ...DONUT_DEFAULTS };
document.body.dataset.planBtn = DONUT_DEFAULTS.planBtnStyle;

function donutDataset(data, colors) {
  const t = window.donutTweaks;
  return [{
    data,
    backgroundColor: colors,
    borderColor: css('--card'),
    borderWidth:  t.borderWidth,
    borderRadius: t.borderRadius,
    spacing:      t.spacing,
    hoverBorderWidth: 0,
    hoverOffset:  t.hoverOffset,
  }];
}
function donutBaseOptions(tooltipLabel) {
  const t = window.donutTweaks;
  return {
    responsive: true, maintainAspectRatio: false,
    cutout: t.cutout + '%',
    layout: { padding: 50 },
    animation: { duration: t.animationMs, easing: 'easeOutCubic' },
    plugins: {
      legend: { display: false },
      donutOuterLabels: {},
      tooltip: {
        callbacks: { label: tooltipLabel },
        backgroundColor: css('--tooltip-bg'), bodyColor: '#faf3e0',
        padding: 10, cornerRadius: 10,
        titleFont: { family: css('--font-display'), size: 12, weight: '600' },
        bodyFont:  { family: css('--font-ui'),      size: 11 }
      }
    }
  };
}

// Soft drop-shadow under the whole arc ring
const donutShadow = {
  id: 'donutShadow',
  beforeDatasetDraw(chart) {
    if (!window.donutTweaks?.showShadow) return;
    const ctx = chart.ctx;
    ctx.save();
    ctx.shadowColor = 'rgba(58,42,28,.14)';
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 4;
  },
  afterDatasetDraw(chart) {
    if (!window.donutTweaks?.showShadow) return;
    chart.ctx.restore();
  }
};

// Decorative dotted inner+outer ring
const donutInnerRing = {
  id: 'donutInnerRing',
  beforeDatasetDraw(chart) {
    if (!window.donutTweaks?.showInnerRing) return;
    const meta = chart.getDatasetMeta(0);
    if (!meta?.data?.length) return;
    const arc = meta.data[0];
    const ctx = chart.ctx;
    const cx = arc.x, cy = arc.y;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, arc.innerRadius - 6, 0, Math.PI * 2);
    ctx.strokeStyle = css('--line'); ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
    ctx.stroke();
    ctx.setLineDash([1, 5]);
    ctx.beginPath();
    ctx.arc(cx, cy, arc.outerRadius + 6, 0, Math.PI * 2);
    ctx.strokeStyle = css('--card-edge'); ctx.globalAlpha = 0.7;
    ctx.stroke();
    ctx.restore();
  }
};

// Outer labels — curved connector + serif symbol + mono percent
const donutOuterLabels = {
  id: 'donutOuterLabels',
  afterDatasetsDraw(chart) {
    if (!window.donutTweaks?.showLabels) return;
    const { ctx, data } = chart;
    const meta = chart.getDatasetMeta(0);
    if (!meta?.data?.length) return;
    const t = window.donutTweaks;
    const total = data.datasets[0].data.reduce((s, v) => s + (v || 0), 0);
    ctx.save();
    meta.data.forEach((arc, i) => {
      const val = data.datasets[0].data[i] || 0;
      const pct = total > 0 ? val / total * 100 : 0;
      if (pct < t.labelMinPct) return;
      const mid = (arc.startAngle + arc.endAngle) / 2;
      const cos = Math.cos(mid), sin = Math.sin(mid);
      const r = arc.outerRadius, cx = arc.x, cy = arc.y;
      const color = data.datasets[0].backgroundColor[i];

      const r1 = r + 6;
      const r2 = r + t.labelDistance;
      const x1 = cx + cos * r1,  y1 = cy + sin * r1;
      const x2 = cx + cos * r2,  y2 = cy + sin * r2;
      const hd = cos >= 0 ? 1 : -1;
      const x3 = x2 + hd * 10, y3 = y2;

      ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
      ctx.strokeStyle = color; ctx.lineWidth = 1.2;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
      ctx.beginPath(); ctx.arc(x3, y3, 2.2, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();

      const xL = x3 + hd * 5;
      ctx.textAlign = cos >= 0 ? 'left' : 'right';
      ctx.textBaseline = 'middle';
      ctx.font = '600 11px ' + (css('--font-display') || 'serif');
      ctx.fillStyle = css('--ink');
      ctx.fillText(data.labels[i], xL, y3 - 6);
      ctx.font = '500 9.5px ' + (css('--font-mono') || 'monospace');
      ctx.fillStyle = css('--muted');
      ctx.fillText(pct.toFixed(1) + '%', xL, y3 + 6);
    });
    ctx.restore();
  }
};

function _netWorthDonutData(model) {
  let positions = model.positions;
  if (categoryFilter !== 'All') positions = positions.filter(p => (p.category || 'Other') === categoryFilter);
  if (sectorFilter   !== 'All') positions = positions.filter(p => (p.sector   || 'Other') === sectorFilter);
  const noFilter = categoryFilter === 'All' && sectorFilter === 'All';
  const items = noFilter ? [...positions, { symbol: 'Cash', currentValue: model.totalCash }] : positions;
  const total  = items.reduce((s, p) => s + p.currentValue, 0);
  const labels = items.map(p => p.symbol);
  const data   = items.map(p => p.currentValue);
  return { labels, data, colors: labels.map(colorFor), total };
}
function renderDonut(model) {
  if (donutChartInst) { donutChartInst.destroy(); donutChartInst = null; }
  const { labels, data, colors, total } = _netWorthDonutData(model);
  const labelEl = document.getElementById('donut-label');
  const valueEl = document.getElementById('donut-value');
  const filterLabel = [categoryFilter !== 'All' ? t(categoryFilter) : '', sectorFilter !== 'All' ? t(sectorFilter) : ''].filter(Boolean).join(' · ');
  if (labelEl) labelEl.textContent = filterLabel || 'Total Net Worth';
  if (valueEl) valueEl.textContent = fmtCurr(total);
  donutChartInst = new Chart(document.getElementById('donutChart').getContext('2d'), {
    type: 'doughnut',
    data: { labels, datasets: donutDataset(data, colors) },
    options: donutBaseOptions(c => ` ${c.label}: ${fmtCurr(c.raw)} (${total > 0 ? (c.raw/total*100).toFixed(1) : 0}%)`),
    plugins: [donutInnerRing, donutShadow, donutOuterLabels]
  });
}

// ── Shared floating-tooltip mechanics (weight bar + holdings perf) ────────────
// Lazily create a body-level tip element styled by the .float-tip CSS class.
function ensureTip(id) {
  let el = document.getElementById(id);
  if (!el) { el = document.createElement('div'); el.id = id; el.className = 'float-tip'; document.body.appendChild(el); }
  return el;
}
// Position a pointer-following tip near the cursor/touch, clamped to the viewport.
// dx/dy are the desired horizontal/vertical offsets from the pointer.
function positionTip(el, e, dx, dy) {
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  el.style.left = Math.min(x + dx, window.innerWidth - el.offsetWidth - 8) + 'px';
  el.style.top  = (y - el.offsetHeight - dy < 0 ? y + dy + 4 : y - el.offsetHeight - dy) + 'px';
}

// ── Render: weight bar ────────────────────────────────────────────────────────
(function() {
  const getOrCreateTip = () => ensureTip('wbTip');
  function showTip(e, html) {
    const t = getOrCreateTip();
    t.innerHTML = html;
    t.style.opacity = '1';
    moveTip(e);
  }
  function moveTip(e) { positionTip(getOrCreateTip(), e, 12, 10); }
  function hideTip() { getOrCreateTip().style.opacity = '0'; }

  window.tpShow = showTip;
  window.tpMove = moveTip;
  window.tpHide = hideTip;

  window.renderWeightBar = function(positions) {
    const el = document.getElementById('weightBar');
    if (!el || !positions.length) { if (el) el.innerHTML = ''; return; }
    const total = positions.reduce((s, p) => s + p.currentValue, 0);
    const items = positions.map(p => ({ symbol: p.symbol, currentValue: p.currentValue, pct: total > 0 ? p.currentValue / total * 100 : 0, color: colorFor(p.symbol) }));
    const bar = document.createElement('div');
    bar.style.cssText = 'display:flex;height:22px;border-radius:6px;overflow:hidden;gap:1px';
    items.forEach(p => {
      const seg = document.createElement('div');
      seg.style.cssText = `width:${p.pct.toFixed(4)}%;height:100%;background:${p.color};display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;cursor:default`;
      seg.innerHTML = p.pct >= 5 ? `<span style="font-size:9px;font-weight:700;color:#fff;white-space:nowrap;padding:0 3px;text-shadow:0 1px 2px rgba(0,0,0,.4)">${p.symbol}</span>` : '';
      const html = `<strong>${p.symbol}</strong><br>${fmtCurr(p.currentValue)}&nbsp;&nbsp;<span style="opacity:.7">${p.pct.toFixed(1)}%</span>`;
      seg.addEventListener('mouseenter', e => showTip(e, html));
      seg.addEventListener('mousemove',  e => moveTip(e));
      seg.addEventListener('mouseleave', hideTip);
      seg.addEventListener('touchstart', e => { showTip(e, html); e.preventDefault(); }, { passive: false });
      seg.addEventListener('touchmove',  e => moveTip(e));
      seg.addEventListener('touchend',   hideTip);
      bar.appendChild(seg);
    });
    el.innerHTML = '';
    el.appendChild(bar);
  };
})();

// ── Render: sector donut ─────────────────────────────────────────────────────
let sectorDonutInst = null, sectorDrilldown = null;
let etfSectorDonutInst = null, etfHoldingDonutInst = null;
// One config-driven renderer backs three near-identical donuts (sector,
// industry, category). Each config supplies the grouping field, element id,
// drilldown-state accessors, and the post-drill side effects. The drilldown/
// instance state stays in module-level vars (read by setSectorFilter,
// setCategoryFilter, rerenderDonuts, rerenderAllCharts).
function renderGroupedDonut(cfg, model) {
  const el = document.getElementById(cfg.elId);
  if (!el) return;
  if (cfg.getInst()) { cfg.getInst().destroy(); cfg.setInst(null); }
  if (cfg.beforeRender) cfg.beforeRender();

  const map = {};
  for (const p of model.positions) { const k = p[cfg.field] || 'Other'; map[k] = (map[k] || 0) + p.currentValue; }
  const grandTotal = Object.values(map).reduce((s, v) => s + v, 0);
  const keys = Object.keys(map).sort((a, b) => map[b] - map[a]);

  const drilled = cfg.getDrill();
  let labels, data, colors, drillTotal;
  if (drilled) {
    const stocks = model.positions.filter(p => (p[cfg.field] || 'Other') === drilled);
    drillTotal = stocks.reduce((s, p) => s + p.currentValue, 0);
    labels = stocks.map(p => p.symbol);
    data   = stocks.map(p => p.currentValue);
    colors = stocks.map(p => colorFor(p.symbol));
  } else {
    drillTotal = grandTotal;
    labels = keys.map(k => t(k));
    data   = keys.map(k => map[k]);
    colors = keys.map(cfg.color);
  }

  const centerPlugin = {
    id: cfg.elId + 'Center',
    afterDatasetsDraw(chart) {
      if (!drilled) return;
      const meta = chart.getDatasetMeta(0);
      if (!meta?.data?.length) return;
      const arc = meta.data[0];
      const { ctx } = chart;
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `500 9px ${css('--font-mono')||'monospace'}`;
      ctx.fillStyle = css('--muted');
      ctx.fillText(cfg.translateCenter ? t(drilled) : drilled, arc.x, arc.y - 16);
      ctx.font = `600 14px ${css('--font-display')||'serif'}`;
      ctx.fillStyle = css('--ink');
      ctx.fillText(fmtCurr(drillTotal), arc.x, arc.y + 1);
      ctx.font = `400 9px ${css('--font-ui')||'sans-serif'}`;
      ctx.fillStyle = css('--muted'); ctx.globalAlpha = .7;
      ctx.fillText(t('tap_back_hint'), arc.x, arc.y + 17);
      ctx.restore();
    }
  };

  const tooltipFn = drilled
    ? c => ` ${c.label}: ${fmtCurr(c.raw)} (${drillTotal>0?(c.raw/drillTotal*100).toFixed(1):0}% of ${cfg.noun})`
    : c => ` ${c.label}: ${fmtCurr(c.raw)} (${grandTotal>0?(c.raw/grandTotal*100).toFixed(1):0}%)`;

  el.style.cursor = 'pointer';
  cfg.setInst(new Chart(el.getContext('2d'), {
    type: 'doughnut',
    data: { labels, datasets: donutDataset(data, colors) },
    options: {
      ...donutBaseOptions(tooltipFn),
      layout: { padding: drilled ? 50 : cfg.topPadding },
      onClick(event, elements, chart) {
        const meta = chart.getDatasetMeta(0);
        if (!meta?.data?.length) return;
        const arc = meta.data[0];
        const dx = event.x - arc.x, dy = event.y - arc.y;
        if (Math.sqrt(dx*dx + dy*dy) < arc.innerRadius) {
          if (cfg.getDrill()) { cfg.setDrill(null); cfg.afterChange(); }
          return;
        }
        if (!elements.length || cfg.getDrill()) return;
        cfg.setDrill(keys[elements[0].index]);
        cfg.afterChange();
      }
    },
    plugins: [donutInnerRing, donutShadow, donutOuterLabels, centerPlugin]
  }));
  return { labels, data, colors, total: drilled ? drillTotal : grandTotal, drilled: !!drilled };
}

// Shared post-drill sync for the filter-coupled donuts (sector + category).
function _syncDonutFilters() {
  renderCategoryFilters(currentModel); renderSectorFilters(currentModel);
  renderTable(currentModel); renderDonut(currentModel);
}

const SECTOR_DONUT = {
  elId: 'sectorDonutChart', field: 'sector', noun: 'sector',
  topPadding: 65, translateCenter: true, color: colorFor,
  getInst: () => sectorDonutInst, setInst: v => { sectorDonutInst = v; },
  getDrill: () => sectorDrilldown, setDrill: v => { sectorDrilldown = v; },
  afterChange() {
    sectorFilter = sectorDrilldown || 'All';
    renderSectorDonut(currentModel);
    _syncDonutFilters();
  }
};
function renderSectorDonut(model) {
  if (activePortfolio === 'ETF') { renderEtfSectorDonut(model); return; }
  _setDonutNote('sectorDonutNote', '');
  renderGroupedDonut(SECTOR_DONUT, model);
}

// ── Render: industry donut ───────────────────────────────────────────────────
let industryDonutInst = null, industryDrilldown = null;
const INDUSTRY_DONUT = {
  elId: 'industryDonutChart', field: 'industry', noun: 'industry',
  topPadding: 65, translateCenter: false, color: colorFor,
  getInst: () => industryDonutInst, setInst: v => { industryDonutInst = v; },
  getDrill: () => industryDrilldown, setDrill: v => { industryDrilldown = v; },
  afterChange() { renderIndustryDonut(currentModel); }
};
function renderIndustryDonut(model) {
  // Update only the text span, not the whole title (siblings = expand button + collapse chevron).
  const titleTextEl = document.getElementById('industryBreakdownTitleText');
  if (titleTextEl) titleTextEl.textContent = activePortfolio === 'ETF' ? t('top_holding_breakdown_title') : t('industry_breakdown_title');
  if (activePortfolio === 'ETF') { renderEtfTopHoldingDonut(model); return; }
  _setDonutNote('industryDonutNote', '');
  renderGroupedDonut(INDUSTRY_DONUT, model);
}

// ── ETF portfolio: blended top-holdings donuts (Sector Breakdown + Top Holding Breakdown) ────
// Both are static (no click/drill-down) since an ETF fractionally belongs to multiple
// sectors/symbols here, unlike the single-value-per-position model the generic donut assumes.
function _blendedEtfHoldings(model) {
  const allPos = [...(model.positions || []), ...(model.sgovPos ? [model.sgovPos] : [])];
  const totalVal = allPos.reduce((s, p) => s + (p.currentValue || 0), 0);
  const agg = {};
  if (totalVal > 0) {
    for (const p of allPos) {
      const d = _etfDataCache[p.symbol];
      if (!d?.topHoldings?.length) continue;
      const etfWeight = (p.currentValue || 0) / totalVal;
      for (const h of d.topHoldings) {
        if (!h.symbol || !h.weight) continue;
        if (!agg[h.symbol]) agg[h.symbol] = { symbol: h.symbol, name: h.name || h.symbol, blended: 0 };
        agg[h.symbol].blended += h.weight * etfWeight;
        if (h.name && h.name !== h.symbol) agg[h.symbol].name = h.name;
      }
    }
  }
  return { agg, totalVal };
}

function _setDonutNote(id, text) {
  const el = document.getElementById(id);
  if (el) el.textContent = text;
}

function _renderEtfStaticDonut(elId, getInst, setInst, labels, data, colors, noun, totalOverride) {
  if (getInst()) { getInst().destroy(); setInst(null); }
  const el = document.getElementById(elId);
  if (!el) return;
  const grandTotal = totalOverride != null ? totalOverride : data.reduce((s, v) => s + v, 0);
  const centerPlugin = {
    id: elId + 'Center',
    afterDatasetsDraw(chart) {
      const meta = chart.getDatasetMeta(0);
      if (!meta?.data?.length) return;
      const arc = meta.data[0];
      const { ctx } = chart;
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `600 14px ${css('--font-display')||'serif'}`;
      ctx.fillStyle = css('--ink');
      ctx.fillText(fmtCurr(grandTotal), arc.x, arc.y);
      ctx.restore();
    }
  };
  const tooltipFn = c => ` ${c.label}: ${fmtCurr(c.raw)} (${grandTotal>0?(c.raw/grandTotal*100).toFixed(1):0}% of ${noun})`;
  el.style.cursor = 'default';
  setInst(new Chart(el.getContext('2d'), {
    type: 'doughnut',
    data: { labels, datasets: donutDataset(data, colors) },
    options: { ...donutBaseOptions(tooltipFn), layout: { padding: 65 } },
    plugins: [donutInnerRing, donutShadow, donutOuterLabels, centerPlugin]
  }));
}

// Blended-holdings → sector map. `total` is the whole ETF-portfolio value; slice
// values only cover classified holdings, so `total - sum(data)` is the residual.
function _etfSectorDonutData(model) {
  const { agg, totalVal } = _blendedEtfHoldings(model);
  const map = {};
  for (const h of Object.values(agg)) {
    const sector = _topHoldingSectors[h.symbol];
    if (!sector || sector === '—') continue;
    map[sector] = (map[sector] || 0) + h.blended * totalVal;
  }
  const keys = Object.keys(map).sort((a, b) => map[b] - map[a]);
  return { labels: keys, data: keys.map(k => map[k]), colors: keys.map(colorFor), total: totalVal };
}

function _etfHoldingDonutData(model) {
  const { agg, totalVal } = _blendedEtfHoldings(model);
  const entries = Object.values(agg).map(h => ({ label: h.symbol, value: h.blended * totalVal }));
  entries.sort((a, b) => b.value - a.value);
  return { labels: entries.map(e => e.label), data: entries.map(e => e.value), colors: entries.map(e => colorFor(e.label)), total: totalVal };
}

function renderEtfSectorDonut(model) {
  const { labels, data, colors, total } = _etfSectorDonutData(model);
  const residual = total - data.reduce((s, v) => s + v, 0);
  _renderEtfStaticDonut('sectorDonutChart', () => etfSectorDonutInst, v => { etfSectorDonutInst = v; },
    labels, data, colors, 'sector');
  _setDonutNote('sectorDonutNote', residual > 0.5
    ? `${t('other_unclassified_label')}: ${fmtCurr(residual)} (${(residual/total*100).toFixed(1)}%)` : '');
}

function renderEtfTopHoldingDonut(model) {
  const { labels, data, colors, total } = _etfHoldingDonutData(model);
  const residual = total - data.reduce((s, v) => s + v, 0);
  _renderEtfStaticDonut('industryDonutChart', () => etfHoldingDonutInst, v => { etfHoldingDonutInst = v; },
    labels, data, colors, 'holding');
  _setDonutNote('industryDonutNote', residual > 0.5
    ? `${t('other_unclassified_label')}: ${fmtCurr(residual)} (${(residual/total*100).toFixed(1)}%)` : '');
}

// ── Full-screen donut modal (expand icon on each donut card) ─────────────────
let _donutModalKind = null, _donutModalInst = null, _donutModalDrill = null;

function donutExpandBtn(kind) {
  return `<button class="card-expand-btn" onclick="event.stopPropagation();openDonutModal('${kind}')" aria-label="${t('expand_chart')}" title="${t('expand_chart')}"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>`;
}

function _donutModalTitleFor(kind) {
  if (kind === 'networth') return t('total_net_worth_label');
  if (kind === 'category') return t('category_breakdown_title');
  if (kind === 'sector')   return t('sector_breakdown_title');
  if (kind === 'industry') return activePortfolio === 'ETF' ? t('top_holding_breakdown_title') : t('industry_breakdown_title');
  return '';
}

// Modal-scoped clone of a grouped-donut config: same field/colour, but its own
// chart instance + drilldown state (independent of the page) and a modal re-render.
function _donutModalCfg(kind) {
  const base = kind === 'sector' ? SECTOR_DONUT : kind === 'industry' ? INDUSTRY_DONUT : CATEGORY_DONUT;
  return {
    ...base,
    elId: 'donutModalCanvas',
    beforeRender: null,
    getInst: () => _donutModalInst, setInst: v => { _donutModalInst = v; },
    getDrill: () => _donutModalDrill, setDrill: v => { _donutModalDrill = v; },
    afterChange() { renderDonutModal(); }
  };
}

window.openDonutModal = function(kind) {
  if (!currentModel) return;
  _donutModalKind = kind;
  _donutModalDrill = null;
  const titleEl = document.getElementById('donutModalTitle');
  if (titleEl) titleEl.textContent = _donutModalTitleFor(kind);
  const ov = document.getElementById('donutModal');
  if (ov) ov.classList.add('open');
  requestAnimationFrame(() => renderDonutModal());
};

window.closeDonutModal = function() {
  const ov = document.getElementById('donutModal');
  if (ov) ov.classList.remove('open');
  if (_donutModalInst) { _donutModalInst.destroy(); _donutModalInst = null; }
  _donutModalKind = null; _donutModalDrill = null;
};

function renderDonutModal() {
  const kind = _donutModalKind, model = currentModel;
  if (!kind || !model) return;
  const isEtf = activePortfolio === 'ETF' && (kind === 'sector' || kind === 'industry');
  let res, showResidual = false;
  if (kind === 'networth') {
    res = _netWorthDonutData(model);
    _renderEtfStaticDonut('donutModalCanvas', () => _donutModalInst, v => { _donutModalInst = v; },
      res.labels, res.data, res.colors, 'portfolio', res.total);
  } else if (isEtf) {
    res = kind === 'sector' ? _etfSectorDonutData(model) : _etfHoldingDonutData(model);
    showResidual = true;
    _renderEtfStaticDonut('donutModalCanvas', () => _donutModalInst, v => { _donutModalInst = v; },
      res.labels, res.data, res.colors, kind === 'sector' ? 'sector' : 'holding', res.total);
  } else {
    res = renderGroupedDonut(_donutModalCfg(kind), model);
  }
  _buildDonutLegend(res.labels, res.data, res.colors, res.total, showResidual);
}

function _buildDonutLegend(labels, data, colors, total, showResidual) {
  const el = document.getElementById('donutModalLegend');
  if (!el) return;
  const rows = labels.map((lab, i) => ({ label: lab, value: data[i] || 0, color: colors[i], idx: i }))
    .sort((a, b) => b.value - a.value);
  let html = rows.map(r => {
    const pct = total > 0 ? r.value / total * 100 : 0;
    return `<div class="dm-legend-row" onclick="_highlightDonutSlice(this, ${r.idx})">
      <span class="dm-swatch" style="background:${r.color}"></span>
      <span class="dm-label">${r.label}</span>
      <span class="dm-val">${fmtCurr(r.value)}</span>
      <span class="dm-pct">${pct.toFixed(1)}%</span>
    </div>`;
  }).join('');
  if (showResidual) {
    const residual = total - data.reduce((s, v) => s + (v || 0), 0);
    if (residual > 0.5) {
      const pct = total > 0 ? residual / total * 100 : 0;

}

function computePeriodReturns(sym, currentPrice) {
  const pm = historyCache?.prices?.[sym];
  if (!pm || currentPrice == null) return {};
  const today = new Date();
  const fmt = d => d.toISOString().slice(0, 10);
  const periods = { '1M': 1, '3M': 3, '1Y': 12, '3Y': 36, '5Y': 60 };
  const ret = {};
  for (const [key, months] of Object.entries(periods)) {
    const d = new Date(today);
    d.setMonth(d.getMonth() - months);
    const p0 = nearestPrice(pm, fmt(d));
    ret[key] = p0 ? (currentPrice - p0) / p0 * 100 : null;
  }
  const jan1 = new Date(today.getFullYear(), 0, 1);
  const p0ytd = nearestPrice(pm, fmt(jan1));
  ret.YTD = p0ytd ? (currentPrice - p0ytd) / p0ytd * 100 : null;
  return ret;
}

function priceSpark(sym, width, height) {
  width = width || 64; height = height || 20;
  const pm = historyCache?.prices?.[sym];
  if (!pm) return '';
  const entries = Object.entries(pm).sort((a, b) => a[0].localeCompare(b[0]));
  if (entries.length < 2) return '';
  const now = new Date();
  const oneYearAgo = new Date(now); oneYearAgo.setFullYear(now.getFullYear() - 1);
  const recent = entries.filter(([d]) => d >= oneYearAgo.toISOString().slice(0, 10));
  if (recent.length < 2) return '';
  const step = Math.max(1, Math.floor(recent.length / 12));
  const pts = [];
  for (let i = 0; i < recent.length; i += step) pts.push(recent[i][1]);
  if (pts.length < 2) return '';
  const min = Math.min(...pts), max = Math.max(...pts), range = max - min || 1;
  const pad = 2, iW = width - pad * 2, iH = height - pad * 2;
  const points = pts.map((v, i) => `${pad + (i / (pts.length - 1)) * iW},${pad + iH - ((v - min) / range) * iH}`);
  const color = colorFor(sym);
  return `<svg class="perf-spark" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="1Y price trend">
    <path class="perf-spark-line" style="stroke:${color}" d="M${points.join(' L')}" />
  </svg>`;
}

function buildHpBaseData() {
  const map = {};
  if (currentModel?.positions) {
    for (const p of currentModel.positions) {
      map[p.symbol] = { name: p.name || p.symbol, unrealizedPnl: p.pnl || 0, realizedPnl: 0, currentValue: p.currentValue || 0, totalCost: 0, _costBasisFallback: p.costBasis || 0 };
    }
  }
  if (pnlData?.length) {
    for (const t of pnlData) {
      if (!map[t.ticker]) map[t.ticker] = { name: t.ticker, unrealizedPnl: 0, realizedPnl: 0, currentValue: 0, totalCost: 0, _costBasisFallback: 0 };
      map[t.ticker].realizedPnl += t.pnl;
    }
  }
  if (txCache?.length) {
    for (const tx of txCache) {
      if (tx.type !== 'Buy') continue;
      if (map[tx.ticker])
        map[tx.ticker].totalCost += tx.tradeValue || (tx.shares * tx.price) || 0;
    }
  }
  // Fallback: if txCache has no buys for an active position (incomplete history), use costBasis
  for (const sym of Object.keys(map)) {
    if (map[sym].totalCost === 0 && map[sym]._costBasisFallback > 0)
      map[sym].totalCost = map[sym]._costBasisFallback;
  }
  return Object.entries(map)
    .map(([symbol, d]) => {
      const totalPnl = d.unrealizedPnl + d.realizedPnl;
      const pnlPct   = d.totalCost > 0 ? totalPnl / d.totalCost * 100 : 0;
      return { symbol, name: d.name, totalPnl, pnlPct, unrealizedPnl: d.unrealizedPnl, realizedPnl: d.realizedPnl, currentValue: d.currentValue, totalCost: d.totalCost };
    })
    .filter(i => i.totalCost > 0 || i.totalPnl !== 0)
    .sort((a, b) => b.pnlPct - a.pnlPct);
}

function buildHpDivData() {
  if (!txCache?.length) return [];
  const divData = historyCache?.dividends || {};
  const items = [];
  for (const [ticker, events] of Object.entries(divData)) {
    let net = 0;
    for (const [dateStr, amount] of Object.entries(events)) {
      const held = sharesHeldAt(txCache, ticker, dateStr);
      if (held > 0) net += held * amount * (1 - withholdingRate(ticker));
    }
    if (net > 0) {
      const pos = currentModel?.positions.find(p => p.symbol === ticker);
      items.push({ symbol: ticker, name: pos?.name || ticker, dividendNet: net, currentValue: pos?.currentValue || 0 });
    }
  }
  return items.sort((a, b) => b.dividendNet - a.dividendNet);
}

function hpRow(item, barW, barColor, rightLabel, sym) {

    onmouseenter="showHpTip(event,'${sym}')"
