    <div class="hp-bar-wrap">
      <div class="hp-bar-fill" style="width:${barW};background:${barColor}"></div>
      <div class="hp-ref" style="left:33.33%"></div>
      <div class="hp-ref" style="left:66.66%"></div>
    </div>
    <div class="hp-pct" style="color:${barColor}">${rightLabel}</div>
  </div>`;
}

function renderHoldingsPerformance() {
  const el = document.getElementById('holdingsPerf');
  if (!el) return;

  _hpData    = buildHpBaseData();
  _hpDivData = buildHpDivData();

  // ── Dividends tab ──────────────────────────────────────────────────────────
  if (_hpTab === 'dividends') {
    if (!_hpDivData.length) {
      el.innerHTML = `<div style="color:var(--muted);font-size:12px;text-align:center;padding:16px 0">${t('no_div_data')}</div>`;
      return;
    }
    const maxDiv = Math.max(..._hpDivData.map(i => i.dividendNet), 0.01);
    const axisVals = [0, maxDiv / 3, (maxDiv / 3) * 2, maxDiv];
    const axisHtml = `<div class="hp-axis">${axisVals.map((v, i) => `<span class="hp-axis-label" style="left:${(i/3*100).toFixed(1)}%">${v.toFixed(2)}</span>`).join('')}</div>`;
    el.innerHTML = _hpDivData.map(item => {
      const barW = (item.dividendNet / maxDiv * 100).toFixed(2) + '%';
      return hpRow(item, barW, 'var(--gain)', '+' + item.dividendNet.toFixed(2), item.symbol);
    }).join('') + axisHtml;
    return;
  }

  // ── All / Gainers / Losers tabs ────────────────────────────────────────────
  let items = _hpData;
  if (_hpShowDollar) {
    if (_hpTab === 'gainers') items = _hpData.filter(i => i.totalPnl > 0).sort((a, b) => b.totalPnl - a.totalPnl);
    else if (_hpTab === 'losers') items = _hpData.filter(i => i.totalPnl < 0).sort((a, b) => a.totalPnl - b.totalPnl);
    else items = [..._hpData].sort((a, b) => b.totalPnl - a.totalPnl);
  } else {
    if (_hpTab === 'gainers') items = _hpData.filter(i => i.pnlPct > 0);
    else if (_hpTab === 'losers') items = _hpData.filter(i => i.pnlPct < 0).sort((a, b) => a.pnlPct - b.pnlPct);
  }

  if (!items.length) {
    el.innerHTML = `<div style="color:var(--muted);font-size:12px;text-align:center;padding:16px 0">No ${_hpTab} found</div>`;
    return;
  }
  if (_hpShowDollar) {
    const maxAbs = Math.max(...items.map(i => Math.abs(i.totalPnl)), 1);
    el.innerHTML = items.map(item => {
      const isGain   = item.totalPnl >= 0;
      const barW     = (Math.abs(item.totalPnl) / maxAbs * 100).toFixed(2) + '%';
      const barColor = isGain ? 'var(--gain)' : 'var(--loss)';
      const sign     = isGain ? '+' : '';
      return hpRow(item, barW, barColor, (isGain ? '+' : '') + fmtCurr(item.totalPnl), item.symbol);
    }).join('');
  } else {
    const maxPct = Math.max(...items.map(i => Math.abs(i.pnlPct)), 1);
    el.innerHTML = items.map(item => {
      const isGain   = item.pnlPct >= 0;
      const barW     = (Math.abs(item.pnlPct) / maxPct * 100).toFixed(2) + '%';
      const barColor = isGain ? 'var(--gain)' : 'var(--loss)';
      return hpRow(item, barW, barColor, (isGain ? '+' : '') + item.pnlPct.toFixed(2) + '%', item.symbol);
    }).join('');
  }
}

// ── Plan Watch — compact alert feed ──────────────────────────────────────────
let _planAlertSigs = new Set();
let _planAlertInitDone = false;

function renderPlanWatch() {
  const card = document.getElementById('planWatchCard');
  const el   = document.getElementById('planWatchPanel');
  if (!card || !el || !currentModel) return;

  const alerts = [];
  // Single view → that port's plans; ALL → union across all ports (key + badge carry the port).
  const _ports = activePortfolio === 'ALL' ? Object.keys(planCache) : [activePortfolio];
  const _multi = activePortfolio === 'ALL' && _ports.length > 1;
  _ports.forEach(port => {
    const portPlans = planCache[port] || {};
    const pmodel = modelForPort(port);
    Object.entries(portPlans).forEach(([sym, d]) => {
      const pos = findPosIn(pmodel, sym) || findPos(sym) || currentModel.watchlist?.find(w => w.symbol === sym);
      const price = pos?.price ?? null;
      if (!price) return;
      const kp = `${port}:`;
      const pt = _multi ? ` · ${port}` : '';
      const { sl, tranches = [], trimTranches = [] } = d;

      if (sl) {
        const pct = (price - sl) / sl * 100;
        if (pct <= 0)   alerts.push({ sym, port, key:`${kp}${sym}:SL_HIT`,  label:'SL hit',  detail:`${fmtCurr(price)} ≤ SL ${fmtCurr(sl)}${pt}`,                       urgency:5, color:'var(--loss)',  bg:'rgba(187,77,60,.14)'  });
        else if(pct<=5) alerts.push({ sym, port, key:`${kp}${sym}:SL_NEAR`, label:'Near SL', detail:`${pct.toFixed(1)}% above SL ${fmtCurr(sl)}${pt}`,                   urgency:4, color:'var(--honey)', bg:'rgba(199,144,56,.14)' });
      }
      trimTranches.forEach((t, i) => {
        if (!t.price) return;
        const pct = (price - t.price) / t.price * 100;
        if (pct >= 0)    alerts.push({ sym, port, key:`${kp}${sym}:TP${i+1}_HIT`,  label:`TP${i+1} hit`,  detail:`${fmtCurr(t.price)} target reached${pt}`,                urgency:3, color:'var(--gain)',  bg:'rgba(107,142,90,.14)' });
        else if(pct>=-3) alerts.push({ sym, port, key:`${kp}${sym}:TP${i+1}_NEAR`, label:`TP${i+1} near`, detail:`${Math.abs(pct).toFixed(1)}% below TP ${fmtCurr(t.price)}${pt}`, urgency:2, color:'var(--honey)', bg:'rgba(199,144,56,.14)' });
      });
      const td      = getTargetDollar(pos, pmodel);
      const currPct = getCurrentPct(pos, pmodel);
      tranches.forEach((t, i) => {
        if (!t.price) return;
        const pct    = (price - t.price) / t.price * 100;
        const dollar = getTrancheDollar(i, tranches, currPct, td);
        if (pct <= 0)    alerts.push({ sym, port, key:`${kp}${sym}:T${i+1}_HIT`,  label:`T${i+1} entry`, detail:`${fmtCurr(t.price)} entry reached${pt}`,                  urgency:1,   color:'var(--peri)',  bg:'rgba(107,126,184,.14)', tPrice:t.price, dollar });
        else if(pct<=3)  alerts.push({ sym, port, key:`${kp}${sym}:T${i+1}_NEAR`, label:`T${i+1} near`,  detail:`${pct.toFixed(1)}% above T${i+1} ${fmtCurr(t.price)}${pt}`, urgency:0.5, color:'var(--honey)', bg:'rgba(199,144,56,.14)', tPrice:t.price, dollar });
      });
    });
  });

  alerts.sort((a, b) => b.urgency - a.urgency);

  // Notify only when price reaches a level (SL hit=5, TP hit=3, entry hit=1) — not for "near" alerts
  const HIT_URGENCIES = new Set([5, 3, 1]);
  const currentSigs = new Set(alerts.filter(a => HIT_URGENCIES.has(a.urgency)).map(a => a.key));
  if (_planAlertInitDone) {
    const newAlerts = alerts.filter(a => HIT_URGENCIES.has(a.urgency) && !_planAlertSigs.has(a.key));
    if (newAlerts.length) _firePlanNotifications(newAlerts);
  }
  _planAlertSigs = currentSigs;
  _planAlertInitDone = true;

  if (!alerts.length) { card.style.display = 'none'; return; }
  card.style.display = '';

  el.innerHTML = alerts.map(a => {
    const isHit    = HIT_URGENCIES.has(a.urgency);
    const isTranche = a.tPrice != null;
    const badgeBase = isHit
      ? `font-size:10px;font-weight:800;padding:3px 9px;border-radius:4px;background:${a.color};color:#fff;white-space:nowrap;flex-shrink:0;letter-spacing:.2px`
      : `font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;background:${a.bg};color:${a.color};white-space:nowrap;flex-shrink:0`;
    const tagClick  = isTranche && a.dollar > 0
      ? `onclick="event.stopPropagation();window.open('https://imjnoenter.github.io/dimebuy/?sym=${a.sym}&val=${a.dollar.toFixed(2)}&price=${a.tPrice}','_blank')" style="${badgeBase};cursor:pointer;text-decoration:underline dotted"`
      : `style="${badgeBase}"`;
    return `
    <div style="display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid var(--line-soft);cursor:pointer;border-radius:6px;background:${isHit ? a.bg : 'transparent'}" onclick="openActionModal('${a.sym}','${a.port}')">
      <div style="width:${isHit ? '4px' : '3px'};min-height:34px;border-radius:2px;background:${a.color};flex-shrink:0"></div>
      ${logoCell(a.sym, colorFor(a.sym))}
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:${isHit ? '13px' : '12px'}">${a.sym}</div>
        <div style="font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.detail}</div>
      </div>
      <span ${tagClick}>${a.label}</span>
    </div>`;
  }).join('');
}

async function _firePlanNotifications(alerts) {
  if (!('Notification' in window)) return;
  let perm = Notification.permission;
  if (perm === 'default') perm = await Notification.requestPermission();
  if (perm !== 'granted') return;
  alerts.forEach(a => new Notification(`Plan Watch: ${a.sym}`, {
    body: `${a.label} — ${a.detail}`,
    icon: './icon.png',
    tag:  a.key,
  }));
}

function renderPlansPanel() {
  const el = document.getElementById('plansPanel');
  if (!el) return;
  destroyPlanExpandCharts();
  // Flatten nested planCache for the active view (single port, or all ports in ALL).
  const _ports = activePortfolio === 'ALL' ? Object.keys(planCache) : [activePortfolio];
  const _multi = activePortfolio === 'ALL' && _ports.length > 1;
  const _pm = {};
  const pmodel = port => (_pm[port] = _pm[port] || modelForPort(port));
  const rawPlans = [];
  for (const port of _ports) {
    for (const [sym, d] of Object.entries(planCache[port] || {})) {
      if (d.tranches?.length || d.sl || d.note || d.trimTranches?.some(t => t.price > 0)) rawPlans.push([sym, d, port]);
    }
  }
  if (!rawPlans.length) { el.innerHTML = `<div style="color:var(--muted);font-size:12px">${t('no_plans_saved')}</div>`; return; }

  // ── Score each plan for alert urgency ────────────────────────────────────
  const scored = rawPlans.map(([sym, d, port]) => {
    const m = pmodel(port);
    const pos = findPosIn(m, sym);
    const uid = `${port}__${sym}`;
    const price = pos?.price ?? null;
    const { tranches=[], sl, note, trimTranches=[] } = d;
    const realTps = trimTranches.filter(t => t.price > 0);

    // SL status
    let slStatus = 'none';
    if (sl && price != null) {
      const pct = (price - sl) / sl * 100;
      slStatus = pct <= 0 ? 'hit' : pct <= 5 ? 'near' : 'none';
    }
    // Per-tranche status (hit = price ≤ entry, near = within 3%)
    const tStatus = tranches.map(t => {
      if (!t.price || price == null) return 'none';
      const pct = (price - t.price) / t.price * 100;
      return pct <= 0 ? 'hit' : pct <= 3 ? 'near' : 'above';
    });
    // Per-TP status (hit = price ≥ TP, near = within 3% below)
    const tpStatus = realTps.map(t => {
      if (!t.price || price == null) return 'none';
      const pct = (price - t.price) / t.price * 100;
      return pct >= 0 ? 'hit' : pct >= -3 ? 'near' : 'below';
    });

    const urgency = slStatus === 'hit' ? 5
                  : slStatus === 'near' ? 4
                  : tpStatus.some(s => s === 'hit')  ? 3
                  : tpStatus.some(s => s === 'near') ? 2
                  : tStatus.some(s => s === 'hit')   ? 1
                  : 0;

    // "near" tranche — not urgent enough for Alerts but should top "All Plans"
    const hasNearT = tStatus.some(s => s === 'near');
    // Secondary sort key: how complete the plan is (SL > TP > T with price > note)
    const richness = (sl ? 8 : 0) + (realTps.length * 2) + (tranches.filter(t => t.price).length) + (note ? 1 : 0);
    return { sym, d, port, uid, m, pos, price, tranches, sl, note, realTps, slStatus, tStatus, tpStatus, urgency, hasNearT, richness };
  }).sort((a, b) =>
    b.urgency - a.urgency ||
    (b.hasNearT ? 1 : 0) - (a.hasNearT ? 1 : 0) ||
    b.richness - a.richness ||
    a.sym.localeCompare(b.sym)
  );

  // ── Chip builders ────────────────────────────────────────────────────────
  const chip = (label, status, hitBg, hitFg, nearBg, nearFg, suffix='') => {
    const bg = status==='hit'  ? hitBg  : status==='near' ? nearBg : 'var(--track)';
    const fg = status==='hit'  ? hitFg  : status==='near' ? nearFg : 'var(--muted)';
    const badge = status==='hit' ? suffix : status==='near' ? ' ≈' : '';
    return `<span style="padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;background:${bg};color:${fg};white-space:nowrap">${label}${badge}</span>`;
  };

  const triggeredCount = scored.filter(s => s.urgency > 0).length;
  el.innerHTML = scored.map(({ sym, d, port, uid, m, pos, price, tranches, sl, note, realTps, slStatus, tStatus, tpStatus, urgency }, _idx) => {
    const sectionHeader =
      _idx === 0 && triggeredCount > 0
        ? `<div style="font-size:9px;font-weight:800;color:var(--loss);text-transform:uppercase;letter-spacing:.9px;padding:2px 0 6px;display:flex;align-items:center;gap:5px">🔔 Alerts (${triggeredCount})</div>`
        : _idx === triggeredCount && triggeredCount > 0 && triggeredCount < scored.length
        ? `<div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:10px 0 5px;border-top:1px dashed var(--line-soft)">All Plans</div>`
        : '';
    const color = colorFor(sym);
    const td      = pos ? getTargetDollar(pos, m) : 0;
    const currPct = pos ? getCurrentPct(pos, m)   : 0;

    // Row accent border based on top alert
    const accentBorder = slStatus==='hit'  ? '3px solid var(--loss)'
                       : slStatus==='near' ? '3px solid var(--honey)'
                       : tpStatus.some(s=>s==='hit')  ? '3px solid var(--gain)'
                       : tStatus.some(s=>s==='hit')   ? '3px solid var(--peri)'
                       : 'none';
    const rowBg = slStatus==='hit'               ? 'rgba(187,77,60,.05)'
                : slStatus==='near'              ? 'rgba(199,144,56,.04)'
                : tpStatus.some(s=>s==='hit')    ? 'rgba(107,142,90,.05)'
                : tStatus.some(s=>s==='hit')     ? 'rgba(107,126,184,.04)'
                : 'transparent';

    // Price + day change line
    const dayPct  = pos?.dayChangePct;
    const priceEl = price != null
      ? `<span style="font-size:10px;color:var(--muted)">${fmtCurr(price)}</span>`
        + (dayPct != null ? `<span style="font-size:9px;font-weight:700;color:var(${dayPct>=0?'--gain':'--loss'})">${dayPct>=0?'+':''}${dayPct.toFixed(2)}%</span>` : '')
      : '';

    // Tranche chips — only tranches that have a price
    const tChips = tranches.map((t, i) => {
      if (!t.price) return '';
      return chip(`T${i+1} ${fmtCurr(t.price)}`, tStatus[i],
        'rgba(107,126,184,.25)', 'var(--peri)',
        'rgba(199,144,56,.2)',   'var(--honey)', ' ↓');
    }).join('');

    // SL chip
    const slChip = sl
      ? chip(`SL ${fmtCurr(sl)}`, slStatus,
          'rgba(187,77,60,.22)', 'var(--loss)',
          'rgba(199,144,56,.2)', 'var(--honey)', ' 🔴')
      : '';

    // TP chips
    const tpChips = realTps.map((t, i) =>
      chip(`TP${i+1} ${fmtCurr(t.price)}`, tpStatus[i],
        'rgba(107,142,90,.25)', 'var(--gain)',
        'rgba(199,144,56,.2)',  'var(--honey)', ' ✓')
    ).join('');

    const hasChips = tChips || slChip || tpChips;

    // Expand section (unchanged)
    const trancheRows = tranches.map((t, i) => {
      const dollar = getTrancheDollar(i, tranches, currPct, td);
      const triggered = tStatus[i] === 'hit' || tStatus[i] === 'near';
      return `<tr style="border-bottom:1px solid var(--line-soft)${triggered?';background:rgba(107,126,184,.06)':''}">
        <td style="padding:5px 8px;font-weight:700;color:${trancheColor(i)}">T${i+1}</td>
        <td style="padding:5px 8px;text-align:right;${tStatus[i]==='hit'?'color:var(--peri);font-weight:700':''}">${t.price ? fmtCurr(t.price) : '—'}</td>
        <td style="padding:5px 8px;text-align:right">${(t.cumPct??0).toFixed(1)}%</td>
        <td style="padding:5px 8px;text-align:right">${dollar > 0 ? fmtCurr(dollar) : '—'}</td>
      </tr>`;
    }).join('');

    return sectionHeader + `<div style="border-bottom:1px solid var(--line-soft);border-left:${accentBorder};background:${rowBg};border-radius:${accentBorder!=='none'?'0 var(--radius-sm) var(--radius-sm) 0':'0'};margin-bottom:1px">
      <div onclick="togglePlanExpand('${uid}','${sym}','${port}')" style="display:flex;align-items:flex-start;gap:8px;padding:8px 8px 6px ${accentBorder!=='none'?'10':'8'}px;cursor:pointer">
        <div style="flex-shrink:0;margin-top:1px">${logoCell(sym, color)}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px">
            <span style="font-weight:700;font-size:13px">${sym}</span>
            ${_multi ? `<span style="font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;background:var(--track);color:var(--muted)">${port}</span>` : ''}
            ${priceEl}
            ${urgency >= 3 && tpStatus.some(s=>s==='hit') ? `<span style="font-size:9px;font-weight:800;color:var(--gain);background:rgba(107,142,90,.15);padding:1px 5px;border-radius:3px">${t('tp_hit_badge')}</span>` : ''}
            ${slStatus==='hit' ? `<span style="font-size:9px;font-weight:800;color:var(--loss);background:rgba(187,77,60,.15);padding:1px 5px;border-radius:3px">${t('sl_hit_badge')}</span>` : ''}
          </div>
          ${note ? `<div style="font-size:10px;color:var(--muted);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📝 ${note}</div>` : ''}
          ${hasChips ? `<div style="display:flex;flex-wrap:wrap;gap:3px">${tChips}${slChip}${tpChips}</div>` : ''}
        </div>
        <button class="plan-btn saved" onclick="event.stopPropagation();openActionModal('${sym}','${port}')" title="${t('actions_tooltip')}" style="flex-shrink:0;margin-top:2px">${ACTION_ICON}</button>
      </div>
      <div id="planExpand_${uid}" style="display:none;padding:0 8px 12px 10px">
        <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin-bottom:8px;padding:8px 10px;background:var(--track);border-radius:var(--radius-sm)">
          ${pos?.price  != null  ? `<span style="color:var(--muted)">Last <strong style="color:var(--ink)">${fmtCurr(pos.price)}</strong></span>` : ''}
          ${(pos?.qty||0) > 0    ? `<span style="color:var(--muted)">Qty <strong style="color:var(--ink)">${pos.qty.toFixed(4)}</strong></span>` : ''}
          ${(pos?.avgPrice||0)>0 ? `<span style="color:var(--muted)">Avg <strong style="color:var(--ink)">${fmtCurr(pos.avgPrice)}</strong></span>` : ''}
          ${pos?.sector          ? `<span style="color:var(--muted)">${t('sector_label')} <strong style="color:var(--ink)">${t(pos.sector)}</strong></span>` : ''}
          ${pos?.category        ? `<span style="color:var(--muted)">${t('category_label')} <strong style="color:var(--ink)">${t(pos.category)}</strong></span>` : ''}
          ${sl                   ? `<span style="color:var(--muted)">SL <strong style="color:var(${slStatus==='hit'?'--loss':slStatus==='near'?'--honey':'--loss'})">${fmtCurr(sl)}${slStatus==='hit'?' 🔴':slStatus==='near'?' ⚠':''}</strong></span>` : ''}
        </div>
        ${tranches.length ? `<table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px">
          <thead><tr style="border-bottom:1px solid var(--line)">
            <th style="text-align:left;padding:3px 8px;color:var(--muted);font-weight:500">#</th>
            <th style="text-align:right;padding:3px 8px;color:var(--muted);font-weight:500">Entry</th>
            <th style="text-align:right;padding:3px 8px;color:var(--muted);font-weight:500">% of Target</th>
            <th style="text-align:right;padding:3px 8px;color:var(--muted);font-weight:500">Amount</th>
          </tr></thead>
          <tbody>${trancheRows}</tbody>
        </table>` : ''}
        ${realTps.length ? (() => {
          const pos2 = m?.positions.find(p => p.symbol === sym);
          const avg  = pos2?.avgPrice || 0;
          const inv  = m?.investable || 0;
          const tgt  = (pos2?.target || 0) * inv;
          const TPCOLORS = ['#6b8e5a','#c79038','#6b7eb8'];
          let qtyRem = pos2?.qty || 0;
          return `<table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px">
          <thead><tr style="border-bottom:1px solid var(--line)">
            <th style="text-align:left;padding:3px 8px;color:var(--muted);font-weight:500">#</th>
            <th style="text-align:right;padding:3px 8px;color:var(--muted);font-weight:500">Exit Price</th>
            <th style="text-align:right;padding:3px 8px;color:var(--muted);font-weight:500">% Trim</th>
            <th style="text-align:right;padding:3px 8px;color:var(--muted);font-weight:500">Est. P&L</th>
          </tr></thead>
          <tbody>${realTps.map((t, i) => {
            const sharesSold = (t.price > 0 && t.pct > 0 && tgt > 0) ? Math.min(qtyRem, (t.pct / 100 * tgt) / t.price) : 0;
            const sharesAfter = Math.max(0, qtyRem - sharesSold);
            const pnl = sharesSold > 0 && avg > 0 ? (t.price - avg) * sharesSold : null;
            qtyRem = Math.max(0, sharesAfter);
            const ts = tpStatus[i];
            return `<tr style="border-bottom:1px solid var(--line-soft)${ts==='hit'?';background:rgba(107,142,90,.07)':ts==='near'?';background:rgba(199,144,56,.06)':''}">
              <td style="padding:5px 8px;font-weight:700;color:${TPCOLORS[i % 3]}">TP${i+1}${ts==='hit'?' ✓':ts==='near'?' ≈':''}</td>
              <td style="padding:5px 8px;text-align:right;${ts==='hit'?'color:var(--gain);font-weight:700':''}">${fmtCurr(t.price)}</td>
              <td style="padding:5px 8px;text-align:right">${(t.pct||0).toFixed(1)}%</td>
              <td style="padding:5px 8px;text-align:right;color:var(${pnl != null && pnl >= 0 ? '--gain' : '--muted'})">${pnl != null ? (pnl >= 0 ? '+' : '') + fmtCurr(pnl) : '—'}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>`;
        })() : ''}
        <div class="action-charts-grid" style="margin-bottom:0">
          <div style="background:var(--track);border-radius:var(--radius-sm);padding:8px">
            <div style="font-size:9px;color:var(--muted);text-align:center;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">${t('all_stocks_label')}</div>
            <div style="position:relative;height:110px"><canvas id="planC1_${uid}"></canvas></div>
          </div>
          <div style="background:var(--track);border-radius:var(--radius-sm);padding:8px">
            <div style="font-size:9px;color:var(--muted);text-align:center;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">${pos?.category||'Category'}</div>
            <div style="position:relative;height:110px"><canvas id="planC2_${uid}"></canvas></div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

window.togglePlanExpand = function(uid, sym, port) {
  const el = document.getElementById(`planExpand_${uid}`);
  if (!el) return;
  const isOpen = el.style.display !== 'none';
  document.querySelectorAll('[id^="planExpand_"]').forEach(e => { e.style.display = 'none'; });
  destroyPlanExpandCharts();
  if (!isOpen) { el.style.display = 'block'; renderPlanExpandCharts(uid, sym, port); }
};

function renderPlanExpandCharts(uid, sym, port) {
  const m = modelForPort(port || activePortfolio);
  if (!m) return;
  const pos = findPosIn(m, sym);
  const positions = m.positions;
  const category  = pos?.category || 'Other';
  const catPos    = positions.filter(p => (p.category||'Other') === category);

  const mkChart = (id, items) => {
    const el = document.getElementById(id);
    if (!el || !items.length) return null;
    const total  = items.reduce((s, p) => s + (p.currentValue||0), 0);
    const labels = items.map(p => p.symbol);
    const data   = items.map(p => p.currentValue || 0);
    const bg     = items.map(p => p.symbol === sym ? colorFor(p.symbol) : colorFor(p.symbol) + '55');
    const border = items.map(p => p.symbol === sym ? '#fff' : 'transparent');
    const bw     = items.map(p => p.symbol === sym ? 2 : 0);
    return new Chart(el.getContext('2d'), {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: bg, borderColor: border, borderWidth: bw, hoverBorderWidth: 0 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '65%', animation: false,
        plugins: { legend: { display: false },
          tooltip: { callbacks: { label: c => ` ${c.label}: ${total>0?(c.raw/total*100).toFixed(1):0}%` },
            backgroundColor: css('--tooltip-bg'), bodyColor: '#faf3e0', padding: 8, cornerRadius: 8 }}
      }
    });
  };

  const c1 = mkChart(`planC1_${uid}`, positions);
  const c2 = mkChart(`planC2_${uid}`, catPos.length ? catPos : positions);
  planExpandCharts[uid] = [c1, c2].filter(Boolean);
}

// ── Render: P&L by Sector accordion panel ────────────────────────────────────
function _bindPnlSectorEvents() {
  const el = document.getElementById('pnlSectorPanel');
  if (!el || el._bound) return;
  el._bound = true;
  el.addEventListener('click', e => {
    const indEl = e.target.closest('.pnlsec-ind');
    if (indEl) {
      if (e.target.closest('.pnlsec-tbl')) return;
      const key = indEl.dataset.sec + '␀' + indEl.dataset.ind;
      _industryExpanded.has(key) ? _industryExpanded.delete(key) : _industryExpanded.add(key);
      renderPnLBySector(currentModel);
      return;
    }
    const secEl = e.target.closest('.pnlsec-row');
    if (secEl) {
      const sec = secEl.dataset.sec;
      _sectorExpanded.has(sec) ? _sectorExpanded.delete(sec) : _sectorExpanded.add(sec);
      renderPnLBySector(currentModel);
    }
  });
}

function renderPnLBySector(model) {
  const el = document.getElementById('pnlSectorPanel');
  if (!el || !model) return;
  _bindPnlSectorEvents();
  const pos = model.positions || [];
  if (!pos.length) {
    el.innerHTML = `<div style="color:var(--muted);font-size:12px;text-align:center;padding:8px 0">${t('loading_msg')}</div>`;
    return;
  }

  // aggregate: sector → { pnl, cost, inds: { industry → { pnl, cost, syms[] } } }
  const secMap = {};
  for (const p of pos) {
    const sec = p.sector || 'Other';
    const ind = p.industry || 'Other';
    const s = secMap[sec] || (secMap[sec] = { pnl: 0, cost: 0, inds: {} });
    s.pnl  += p.pnl || 0;
    s.cost += p.costBasis || 0;
    const i = s.inds[ind] || (s.inds[ind] = { pnl: 0, cost: 0, syms: [] });
    i.pnl  += p.pnl || 0;
    i.cost += p.costBasis || 0;
    i.syms.push(p);
  }

  const esc = s => String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const sectors = Object.keys(secMap).sort((a, b) => secMap[b].pnl - secMap[a].pnl);
  const maxAbs  = Math.max(1, ...sectors.map(s => Math.abs(secMap[s].pnl)));

  const totTone = model.totalPnl >= 0 ? 'gain' : 'loss';
  let html = `<div class="pnlsec-summary">
    <span class="pnlsec-sum-label">${t('total_unrealized')}</span>
    <span class="pnlsec-sum-val ${totTone}">${fmtCurr(model.totalPnl)} <small>(${model.totalPnlPct.toFixed(2)}%)</small></span>
  </div>`;

  for (const sec of sectors) {
    const s     = secMap[sec];
    const tone  = s.pnl >= 0 ? 'gain' : 'loss';
    const pct   = s.cost ? s.pnl / s.cost * 100 : 0;
    const w     = (Math.abs(s.pnl) / maxAbs * 100).toFixed(1);
    const open  = _sectorExpanded.has(sec);
    const inds  = Object.keys(s.inds).sort((a, b) => s.inds[b].pnl - s.inds[a].pnl);
    const maxInd = Math.max(1, ...inds.map(i => Math.abs(s.inds[i].pnl)));

    html += `<div class="pnlsec-row" data-sec="${esc(sec)}">
      <div class="pnlsec-row-head">
        <span class="pnlsec-caret">${open ? '▾' : '▸'}</span>
        <span class="pnlsec-name">${t(sec)}</span>
        <span class="pnlsec-amt ${tone}">${fmtCurr(s.pnl)} <small>${pct.toFixed(2)}%</small></span>
      </div>
      <div class="pnlsec-bar-track"><div class="pnlsec-bar-fill" style="transform:scaleX(${(Math.abs(s.pnl)/maxAbs).toFixed(4)});background:var(--${tone})"></div></div>`;

    if (open) {
      for (const ind of inds) {
        const i    = s.inds[ind];
        const it   = i.pnl >= 0 ? 'gain' : 'loss';
        const ipct = i.cost ? i.pnl / i.cost * 100 : 0;
        const iw   = (Math.abs(i.pnl) / maxInd * 100).toFixed(1);
        const ikey = sec + '␀' + ind;
        const iopen = _industryExpanded.has(ikey);
        html += `<div class="pnlsec-ind" data-sec="${esc(sec)}" data-ind="${esc(ind)}">
          <div class="pnlsec-row-head">
            <span class="pnlsec-caret">${iopen ? '▾' : '▸'}</span>
            <span class="pnlsec-name">${t(ind)}</span>
            <span class="pnlsec-amt ${it}">${fmtCurr(i.pnl)} <small>${ipct.toFixed(2)}%</small></span>
          </div>
          <div class="pnlsec-bar-track"><div class="pnlsec-bar-fill" style="transform:scaleX(${(Math.abs(i.pnl)/maxInd).toFixed(4)});background:var(--${it})"></div></div>`;
        if (iopen) {
          const syms = [...i.syms].sort((a, b) => (b.pnl || 0) - (a.pnl || 0));
          html += `<table class="pnlsec-tbl"><thead><tr>
            <th>Symbol</th><th>${t('th_value')}</th><th>P&L</th><th>%</th>
          </tr></thead><tbody>`;
          for (const p of syms) {
            const pt = (p.pnl || 0) >= 0 ? 'gain' : 'loss';
            html += `<tr>
              <td>${p.symbol}</td>
              <td>${fmtCurr(p.currentValue || 0)}</td>
              <td class="${pt}">${fmtCurr(p.pnl || 0)}</td>
              <td class="${pt}">${(p.pnlPct || 0).toFixed(2)}%</td>
            </tr>`;
          }
          html += `</tbody></table>`;
        }
        html += `</div>`;
      }
    }
    html += `</div>`;
  }

  el.innerHTML = html;
}

// ── Render: Risk & Concentration panel ───────────────────────────────────────
function renderRiskPanel(model) {
  const el = document.getElementById('riskPanel');
  if (!el || !model) return;
  const pos = model.positions || [];
  if (!pos.length) {
    el.innerHTML = `<div style="color:var(--muted);font-size:12px;text-align:center;padding:8px 0">${t('loading_msg')}</div>`;
    return;
  }

  const toneColor = tn =>
    tn === 'gain'  ? 'var(--gain)'  :
    tn === 'honey' ? 'var(--honey)' :
    tn === 'loss'  ? 'var(--loss)'  : 'var(--ink)';
  const row = (label, valueHtml, tone, sub) =>
    `<div class="risk-row">
       <div class="risk-row-label">${label}${sub ? `<span class="risk-row-sub">${sub}</span>` : ''}</div>
       <div class="risk-row-value" style="color:${toneColor(tone)}">${valueHtml}</div>
     </div>`;
  const minibar = (frac, tone) =>
    `<div class="risk-bar-track"><div class="risk-bar-fill" style="transform:scaleX(${Math.max(0,Math.min(1,frac)).toFixed(4)});background:${toneColor(tone)}"></div></div>`;

  // ── Concentration (stock-only weights) ──────────────────────────────────────
  const byStockW = [...pos].sort((a,b) => (b.stockWeightPct||0) - (a.stockWeightPct||0));
  const top3 = byStockW.slice(0,3).reduce((s,p) => s + (p.stockWeightPct||0), 0);
  const top3Tone = top3 > 60 ? 'loss' : top3 > 45 ? 'honey' : 'gain';
  const hhi = pos.reduce((s,p) => { const w = (p.stockWeightPct||0)/100; return s + w*w; }, 0);
  const hhiTone  = hhi > 0.25 ? 'loss' : hhi > 0.15 ? 'honey' : 'gain';
  const hhiLabel = hhi > 0.25 ? t('risk_concentrated') : hhi > 0.15 ? t('risk_moderate') : t('risk_diversified');
  const cashPct  = model.totalCurrent > 0 ? model.totalCash / model.totalCurrent * 100 : 0;
  const big = byStockW[0];
  const bigTone = (big.stockWeightPct||0) > 30 ? 'loss' : (big.stockWeightPct||0) > 20 ? 'honey' : 'gain';

  // ── Sector diversification ──────────────────────────────────────────────────
  const secMap = {};
  for (const p of pos) { const s = p.sector||'Other'; secMap[s] = (secMap[s]||0) + (p.currentValue||0); }
  const stockTotal = pos.reduce((s,p) => s + (p.currentValue||0), 0);
  const secEntries = Object.entries(secMap).sort((a,b) => b[1]-a[1]);
  const topSecPct  = stockTotal > 0 && secEntries.length ? secEntries[0][1] / stockTotal * 100 : 0;
  const topSecName = secEntries.length ? t(secEntries[0][0]) : '—';
  const topSecTone = topSecPct > 50 ? 'loss' : topSecPct > 35 ? 'honey' : 'gain';
  const secCount   = secEntries.length;

  // ── Stop-Loss coverage ──────────────────────────────────────────────────────
  let protectedVal = 0, unprotectedVal = 0, maxLossToSl = 0;
  for (const p of pos) {
    const sl = getPlan(p.symbol)?.sl;
    const v  = p.currentValue || 0;
    if (sl && sl > 0) {
      protectedVal += v;
      if (p.price && p.price > sl) maxLossToSl += (p.price - sl) * (p.qty || 0);
    } else {
      unprotectedVal += v;
    }
  }
  const covPct  = stockTotal > 0 ? protectedVal / stockTotal * 100 : 0;
  const covTone = covPct >= 70 ? 'gain' : covPct >= 40 ? 'honey' : 'loss';

  // ── 52-Week range stress ────────────────────────────────────────────────────
  const w52 = pos.filter(p => p.week52High && p.week52Low && p.price && p.week52High > p.week52Low);
  let distHighSum = 0, nearLowCount = 0;
  for (const p of w52) {
    distHighSum += (p.price / p.week52High - 1);
    if ((p.price - p.week52Low) / p.week52Low <= 0.10) nearLowCount++;
  }
  const hasW52 = w52.length > 0;
  const avgDistHigh = hasW52 ? distHighSum / w52.length * 100 : null;
  const distTone    = !hasW52 ? null : avgDistHigh <= -25 ? 'loss' : avgDistHigh <= -12 ? 'honey' : 'gain';
  const nearLowTone = nearLowCount === 0 ? 'gain' : nearLowCount <= 2 ? 'honey' : 'loss';

  el.innerHTML = `
    ${row(t('risk_largest'), `${big.symbol} · ${(big.stockWeightPct||0).toFixed(1)}%`, bigTone)}
    ${row(t('risk_top3'), top3.toFixed(1) + '%', top3Tone, `${t('of_target_label')} equity`)}
    ${row(t('risk_hhi'),
      `<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
         <span>${hhi.toFixed(3)} · ${hhiLabel}</span>${minibar(hhi/0.4, hhiTone)}
       </div>`, hhiTone)}
    ${row(t('risk_cash_alloc'), cashPct.toFixed(1) + '%', cashPct < 5 ? 'honey' : null)}
    <div class="risk-divider"></div>
    ${row(t('risk_top_sector'), `${topSecName} · ${topSecPct.toFixed(1)}%`, topSecTone)}
    ${row(t('risk_sectors'), String(secCount), secCount <= 2 ? 'honey' : 'gain')}
    <div class="risk-divider"></div>
    ${row(t('risk_sl_coverage'), covPct.toFixed(0) + '%', covTone, t('risk_by_value'))}
    ${row(t('risk_max_loss_sl'), maxLossToSl > 0 ? '−' + fmtCurr(maxLossToSl) : '—', maxLossToSl > 0 ? 'loss' : null)}
    ${row(t('risk_unprotected'), unprotectedVal > 0 ? fmtCurr(unprotectedVal) : '—',
        unprotectedVal > stockTotal * 0.5 ? 'loss' : unprotectedVal > 0 ? 'honey' : 'gain')}
    <div class="risk-divider"></div>
    ${row(t('risk_dist_high'),
        hasW52 ? (avgDistHigh >= 0 ? '+' : '') + avgDistHigh.toFixed(1) + '%' : '—', distTone)}
    ${row(t('risk_near_low'),
        hasW52 ? String(nearLowCount) : '—', nearLowTone, hasW52 ? t('risk_within_10') : '')}
  `;
}

// ── Render: dividend breakdown ────────────────────────────────────────────────
function renderDividendBreakdown(txs) {
  const el = document.getElementById('divBreakdown');
  if (!el) return;
  const divData = historyCache?.dividends || {};
  if (!Object.keys(divData).length) {
    el.innerHTML = `<div style="color:var(--muted);font-size:12px;text-align:center;padding:12px 0">${t('no_div_data')}</div>`;
    return;
  }
  const rows = [];
  for (const [ticker, events] of Object.entries(divData)) {
    let gross = 0; let payments = 0;
    for (const [dateStr, amount] of Object.entries(events)) {
      const held = sharesHeldAt(txs, ticker, dateStr);
      if (held <= 0) continue;
      gross += held * amount;
      payments++;
    }
    if (gross <= 0) continue;
    const rate = withholdingRate(ticker);
    const net  = gross * (1 - rate);
    rows.push({ ticker, gross, net, rate, payments });
  }
  if (!rows.length) { el.innerHTML = `<div style="color:var(--muted);font-size:12px;text-align:center;padding:12px 0">${t('no_div_received')}</div>`; return; }
  rows.sort((a, b) => b.net - a.net);
  const totalGross = rows.reduce((s, r) => s + r.gross, 0);
  const totalNet   = rows.reduce((s, r) => s + r.net,   0);
  const color = colorFor;
  el.innerHTML = `
    <table style="width:100%;border-collapse:collapse;font-size:11px">
      <thead><tr style="color:var(--muted);font-weight:500">
        <th style="text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)">${t('ticker_label')}</th>
        <th style="text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)">${t('pmts_label')}</th>
        <th style="text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)">${t('gross')}</th>
        <th style="text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)">${t('tax_label')}</th>
        <th style="text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)">${t('net_label')}</th>
      </tr></thead>
      <tbody>
        ${rows.map(r => `<tr style="border-bottom:1px solid var(--line)">
          <td style="padding:5px 6px">
            <div style="display:flex;align-items:center;gap:5px">
              ${logoCell(r.ticker, colorFor(r.ticker))}
              <span style="font-weight:600">${r.ticker}</span>
            </div>
          </td>
          <td style="text-align:right;padding:5px 6px;color:var(--muted)">${r.payments}</td>
          <td style="text-align:right;padding:5px 6px;color:var(--muted)">${fmtCurr(r.gross)}</td>
          <td style="text-align:right;padding:5px 6px;color:var(--muted)">${(r.rate*100).toFixed(0)}%</td>
          <td style="text-align:right;padding:5px 6px;font-weight:600;color:var(--gain)">${fmtCurr(r.net)}</td>
        </tr>`).join('')}
        <tr style="font-weight:700;background:var(--track)">
          <td colspan="2" style="padding:5px 6px">${t('Total')}</td>
          <td style="text-align:right;padding:5px 6px;color:var(--muted)">${fmtCurr(totalGross)}</td>
          <td style="padding:5px 6px"></td>
          <td style="text-align:right;padding:5px 6px;color:var(--gain)">${fmtCurr(totalNet)}</td>
        </tr>
      </tbody>

// ── Render: calendar ─────────────────────────────────────────────────────────
async function readCalendarSheet() {
  try {
    const res  = await fetch(CALENDAR_URL);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('(') + 1, text.lastIndexOf(')')));
    const table = json.table;
    if (!table?.rows?.length) return null;
    const parseD = raw => {
      if (!raw) return null;
      if (typeof raw === 'string' && raw.startsWith('Date(')) {
        const pts = raw.slice(5,-1).split(',').map(Number);
        return new Date(Date.UTC(pts[0],pts[1],pts[2])).toISOString().slice(0,10);
      }
      if (typeof raw === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
      const m = typeof raw === 'string' && raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
      return null;
    };
    // Columns written by Apps Script's refreshCalendarAction: Symbol, EarningsDate,
    // EarningsDateEnd, Time, ExDivDate, UpdatedAt.
    const events = [];
    for (const row of table.rows) {
      const c = row.c || [];
      const symbol  = c[0]?.v || null;
      if (!symbol || symbol === 'Symbol') continue;  // skip header row
      const earningsDate    = parseD(c[1]?.v);
      const earningsDateEnd = parseD(c[2]?.v);
      const timeStr         = c[3]?.v || null;
      const exDivDate       = parseD(c[4]?.v);
      if (earningsDate) {
        const time = timeStr?.toLowerCase().includes('before') ? t('before_market_open') : t('after_market_close');
        events.push({ symbol, type: 'Earnings', date: earningsDate, dateEnd: earningsDateEnd, time });
      }
      if (exDivDate) {
        events.push({ symbol, type: 'ExDiv', date: exDivDate });
      }
    }
    return events;
  } catch(e) { console.error('readCalendarSheet:', e); return null; }
}

function renderCalendarFromEvents(events) {
  const el = document.getElementById('calendarPanel');
  if (!el) return;
  const today     = new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Bangkok'});
  const tomorrow  = new Date(Date.now() + 86400000).toLocaleDateString('en-CA', {timeZone:'Asia/Bangkok'});
  const yesterday = new Date(Date.now() - 86400000).toLocaleDateString('en-CA', {timeZone:'Asia/Bangkok'});
  const cap       = new Date(Date.now() + 30*86400000).toLocaleDateString('en-CA', {timeZone:'Asia/Bangkok'});
  // AMC events happen after midnight Bangkok time → shift +1 day for Bangkok display
  const bkkDate = e => {
    if (e.type === 'Earnings' && e.time === t('after_market_close')) {
      const d = new Date(e.date + 'T12:00:00Z');
      d.setUTCDate(d.getUTCDate() + 1);
      return d.toISOString().slice(0, 10);
    }
    return e.date;
  };
  const upcoming = events
    .map(e => ({ ...e, bkk: bkkDate(e) }))
    .filter(e => e.bkk >= yesterday && e.bkk <= cap)
    .sort((a, b) => a.bkk.localeCompare(b.bkk));
  if (!upcoming.length) {
    el.innerHTML = `<div style="color:var(--muted);font-size:12px;text-align:center;padding:8px 0">${t('no_upcoming_events')}</div>`;
    return;
  }
  const dateLabel = d => d === today ? t('today_label') : d === tomorrow ? t('tomorrow_label') : fmtDate(d);
  el.innerHTML = upcoming.map(e => {
    const isE  = e.type === 'Earnings';
    const badge = isE
      ? `<span style="padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;background:rgba(138,90,126,.15);color:var(--plum);white-space:nowrap">${t('earnings_badge')}</span>`
      : `<span style="padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;background:rgba(107,142,90,.15);color:var(--sage);white-space:nowrap">${t('exdiv_badge')}</span>`;
    // Most earnings dates are exact (dateEnd === date); only show a range when Yahoo's estimate
    // spans multiple days.
    const dateText = (isE && e.dateEnd && e.dateEnd !== e.date)
      ? `${dateLabel(e.bkk)}–${fmtDate(e.dateEnd)}`
      : dateLabel(e.bkk);
    const subLabel = isE && e.time
      ? `${dateText} · ${e.time}`
      : dateText;
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);gap:8px">
      <div style="display:flex;align-items:center;gap:7px;min-width:0">
        ${logoCell(e.symbol, colorFor(e.symbol))}
        <div style="min-width:0">
          <div style="font-weight:600;font-size:12px">${e.symbol}</div>
          <div style="font-size:10px;color:var(--muted)">${subLabel}</div>
        </div>
      </div>${badge}
    </div>`;
  }).join('');
}

const SUN  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

// ── Market clock ──────────────────────────────────────────────────────────────
let _clockTimer = null;
function drawClock() {
  const canvas = document.getElementById('marketClock');
  if (!canvas) { clearInterval(_clockTimer); _clockTimer = null; return; }

  const sz  = 72, dpr = window.devicePixelRatio || 1;
  if (canvas.width !== sz * dpr) {
    canvas.width = sz * dpr; canvas.height = sz * dpr;
    canvas.style.width = sz + 'px'; canvas.style.height = sz + 'px';
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const now = new Date();
  const bkk = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Bangkok' }));
  const et  = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const h = bkk.getHours(), m = bkk.getMinutes(), s = bkk.getSeconds();
  const etMin      = et.getHours() * 60 + et.getMinutes() + et.getSeconds() / 60;
  const etMinFloor = Math.floor(etMin);
  const isWeekend  = et.getDay() === 0 || et.getDay() === 6;

  let status, statusColor;
  if (isWeekend || etMinFloor < 240 || etMinFloor >= 1200) {
    status = isWeekend ? t('weekend_status') : t('closed_status'); statusColor = '#8a7458';
  } else if (etMinFloor < 570) {
    status = t('pre_market_status'); statusColor = '#c79038';
  } else if (etMinFloor < 960) {
    status = t('market_open_status'); statusColor = '#6b8e5a';
  } else {
    status = t('after_hours_status'); statusColor = '#6b7eb8';
  }

  const stEl = document.getElementById('marketStatusText');
  if (stEl) { stEl.textContent = status; stEl.style.color = statusColor; }
  const timeEl = document.getElementById('marketClockTime');
  const dateEl = document.getElementById('marketClockDate');
  if (timeEl || dateEl) {
    const timeStr = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
    const wd  = bkk.toLocaleDateString('en-US', { weekday: 'short' });
    const dd  = String(bkk.getDate()).padStart(2, '0');
    const mon = bkk.toLocaleDateString('en-US', { month: 'short' });
    const yr  = String(bkk.getFullYear() % 100).padStart(2, '0');
    if (timeEl) timeEl.innerHTML = '<span style="font-weight:600;font-size:11px;color:var(--ink-soft)">' + timeStr + '<\/span>';
    if (dateEl) dateEl.textContent = wd + '. ' + dd + ' ' + mon + " '" + yr;
  }

  const cx = sz / 2, cy = sz / 2;
  const arcT  = 7;
  const R     = sz / 2 - 2;
  const faceR = R - arcT - 2;

  ctx.clearRect(0, 0, sz, sz);

  // Arc zone pre-computation (DST-aware: all offsets derived from live BKK vs ET times)
  const bkkNow   = h * 60 + m + s / 60;
  const tzOffset = (bkkNow - etMin + 1440) % 1440;
  const bkkOf    = etM => (etM + tzOffset) % 1440;
  const clockAngle = bm => ((bm % 720) / 720) * 2 * Math.PI - Math.PI / 2;
  const A_PM     = clockAngle(bkkOf(240));
  const A_OP     = clockAngle(bkkOf(570));
  const A_AH_END = clockAngle(bkkOf(1200));
  const isAM     = h < 12;
  const rOuter   = R - arcT / 2;
  const arcT2    = Math.max(2, Math.round(arcT * 0.38));
  const rInner   = faceR * 0.60;

  // 1. Face background (light theme always)
  const inkC = _isDark ? '#1a1a1a' : (css('--ink') || '#3a2a1c');
  const g = ctx.createRadialGradient(cx, cy - faceR*.1, 1, cx, cy+4, faceR);
  g.addColorStop(0, '#fdf8ee'); g.addColorStop(1, '#ecddb8');
  ctx.beginPath(); ctx.arc(cx, cy, faceR, 0, 2*Math.PI); ctx.fillStyle = g; ctx.fill();

  // 2. Inner arc ring — AM: yellow pre-market, PM: blue after-hours
  const innerColor = isAM ? 'rgba(199,144,56,.45)' : 'rgba(107,126,184,.48)';
  const innerEnd   = isAM ? A_OP : A_AH_END;
  ctx.lineWidth = arcT2; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.arc(cx, cy, rInner, 0, 2*Math.PI, false);
  ctx.strokeStyle = 'rgba(200,185,155,.30)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, rInner, A_PM, innerEnd, false);
  ctx.strokeStyle = innerColor; ctx.stroke();

  // 3. Hour tick marks
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * 2 * Math.PI - Math.PI / 2;
    const isMain = i % 3 === 0;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * (faceR - 1), cy + Math.sin(a) * (faceR - 1));
    ctx.lineTo(cx + Math.cos(a) * (faceR - 1 - (isMain ? 5 : 2.5)),
               cy + Math.sin(a) * (faceR - 1 - (isMain ? 5 : 2.5)));
    ctx.strokeStyle = isMain ? 'rgba(58,42,28,.52)' : 'rgba(58,42,28,.18)';
    ctx.lineWidth = isMain ? 1.6 : 0.8; ctx.lineCap = 'butt'; ctx.stroke();
  }

  // 4. Hands with shadows
  ctx.lineCap = 'round';
  const hA = ((h % 12 + m/60 + s/3600) / 12) * 2 * Math.PI - Math.PI / 2;
  const mA = ((m + s/60) / 60) * 2 * Math.PI - Math.PI / 2;
  const sA = (s / 60) * 2 * Math.PI - Math.PI / 2;
  ctx.shadowColor = 'rgba(58,42,28,.18)';
  ctx.shadowBlur = 3; ctx.shadowOffsetY = 1.2;
  ctx.beginPath(); ctx.moveTo(cx - Math.cos(hA)*3, cy - Math.sin(hA)*3);
  ctx.lineTo(cx + Math.cos(hA)*faceR*.46, cy + Math.sin(hA)*faceR*.46);
  ctx.strokeStyle = inkC; ctx.lineWidth = 2.8; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - Math.cos(mA)*3, cy - Math.sin(mA)*3);
  ctx.lineTo(cx + Math.cos(mA)*faceR*.69, cy + Math.sin(mA)*faceR*.69);
  ctx.strokeStyle = inkC; ctx.lineWidth = 1.9; ctx.stroke();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  const sLen = faceR * .75;
  ctx.beginPath(); ctx.moveTo(cx - Math.cos(sA)*6, cy - Math.sin(sA)*6);
  ctx.lineTo(cx + Math.cos(sA)*sLen, cy + Math.sin(sA)*sLen);
  ctx.strokeStyle = '#c46a4a'; ctx.lineWidth = 1.1; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + Math.cos(sA)*sLen, cy + Math.sin(sA)*sLen, 2.8, 0, 2*Math.PI);
  ctx.fillStyle = '#c46a4a'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, 3.2, 0, 2*Math.PI); ctx.fillStyle = '#c46a4a'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, 1.6, 0, 2*Math.PI);
  ctx.fillStyle = '#fdf8ee'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, faceR, 0, 2*Math.PI);
  ctx.strokeStyle = 'rgba(58,42,28,.07)';
  ctx.lineWidth = 0.5; ctx.lineCap = 'butt'; ctx.stroke();

  // 5. Outer arc ring — green open, yellow pre-market (PM) / blue after-hours (AM)
  ctx.lineWidth = arcT; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.arc(cx, cy, rOuter, 0, 2*Math.PI, false);
  ctx.strokeStyle = '#e0d4b8'; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, rOuter, A_OP, A_PM + 2*Math.PI, false);
  ctx.strokeStyle = 'rgba(107,142,90,.78)'; ctx.stroke();
  if (isAM) {
    ctx.beginPath(); ctx.arc(cx, cy, rOuter, A_PM, A_AH_END, false);
    ctx.strokeStyle = 'rgba(107,126,184,.78)'; ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(cx, cy, rOuter, A_PM, A_OP, false);
    ctx.strokeStyle = 'rgba(199,144,56,.74)'; ctx.stroke();
  }
  // Zone divider ticks
  (isAM ? [A_PM, A_AH_END, A_OP] : [A_PM, A_OP]).forEach(a => {
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a)*(rOuter-arcT/2+.5), cy + Math.sin(a)*(rOuter-arcT/2+.5));
    ctx.lineTo(cx + Math.cos(a)*(rOuter+arcT/2-.5), cy + Math.sin(a)*(rOuter+arcT/2-.5));
    ctx.strokeStyle = '#fdf8ee'; ctx.lineWidth = 1.4; ctx.lineCap = 'butt'; ctx.stroke();
  });
  // Glowing bead tracks current time on the outer ring
  if (!isWeekend) {
    const ba = clockAngle(bkkNow);
    const bx = cx + Math.cos(ba)*rOuter, by = cy + Math.sin(ba)*rOuter;
    const gr = arcT / 2 + 1.5;
    const glow = ctx.createRadialGradient(bx, by, 0, bx, by, gr+4);
    glow.addColorStop(0, statusColor+'cc'); glow.addColorStop(1, statusColor+'00');
    ctx.beginPath(); ctx.arc(bx, by, gr+4, 0, 2*Math.PI); ctx.fillStyle = glow; ctx.fill();
    ctx.beginPath(); ctx.arc(bx, by, gr, 0, 2*Math.PI); ctx.fillStyle = statusColor; ctx.fill();
    ctx.beginPath(); ctx.arc(bx, by, gr-2, 0, 2*Math.PI); ctx.fillStyle = '#fff'; ctx.fill();
  }
  // Status ring border
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2*Math.PI);
  ctx.strokeStyle = statusColor; ctx.lineWidth = 1.8; ctx.lineCap = 'butt'; ctx.stroke();
}

async function fetchTransactions() {
  const url = TRANSACTION_URL;
  if (!url) return null;
  const res  = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.substring(text.indexOf('(') + 1, text.lastIndexOf(')')));
  const table = json.table;
  const idx = {};
  table.cols.forEach((c, i) => { if (c.label) idx[c.label] = i; });
  const cell = (row, label) => { const i = idx[label]; if (i == null) return null; const c = row.c[i]; return c == null ? null : c.v; };
  return table.rows.map(r => {
    let raw = cell(r, 'Date'), dateStr = null;
    if (raw) {
      if (typeof raw === 'string' && raw.startsWith('Date(')) {
        const p = raw.slice(5,-1).split(',').map(Number);
        dateStr = new Date(Date.UTC(p[0], p[1], p[2])).toISOString().slice(0,10);
      } else { dateStr = new Date(raw).toISOString().slice(0,10); }
    }
    return { dateStr, type: cell(r,'Type'), ticker: cell(r,'Ticker'),
             shares: cell(r,'Shares'), price: cell(r,'Price_Per_Share'),
             tradeValue: cell(r,'Trade_Value'),
             portfolio: cell(r,'Portfolio') || DEFAULT_PORT };
  }).filter(r => r.dateStr && r.type && r.ticker);
}

async function fetchYahooPrices(ticker, p1, p2) {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(yahooTicker(ticker))}?period1=${p1}&period2=${p2}&interval=1d`;  const parse = d => {
    const r = d?.chart?.result?.[0]; if (!r?.timestamp) return null;

    r.timestamp.forEach((ts,i) => { if (cls[i]!=null) out[new Date(ts*1000).toISOString().slice(0,10)] = cls[i]; });

function nearestPrice(map, date) {
  if (!map) return null;
  if (map[date]) return map[date];
  const k = Object.keys(map).filter(d => d <= date).sort();
  return k.length ? map[k[k.length-1]] : null;
}

function computeBenchmark(txs, prices) {
  const days = Object.keys(prices['SPY'] || {}).sort();
  if (!days.length) return null;
  const sorted = [...txs].sort((a,b) => a.dateStr.localeCompare(b.dateStr));
  const firstBuyDate = sorted.find(t => t.type === 'Buy')?.dateStr;
  if (!firstBuyDate) return null;

  const tradingDays = days.filter(d => d >= firstBuyDate);
  const holdings = {};
  let spySh = 0, qqqSh = 0;
  let totalBuys = 0, totalSells = 0;  // tracked separately so realized gains aren't lost
  let txIdx = 0;
  const labels = [], portLine = [], spyLine = [], qqqLine = [];

  for (const day of tradingDays) {
    while (txIdx < sorted.length && sorted[txIdx].dateStr <= day) {
      const tx = sorted[txIdx++];
      const amt  = tx.shares * tx.price;
      const spyP = nearestPrice(prices['SPY'], tx.dateStr);
      const qqqP = nearestPrice(prices['QQQ'], tx.dateStr);
      if (tx.type === 'Buy') {
        holdings[tx.ticker] = (holdings[tx.ticker] || 0) + tx.shares;
        totalBuys += amt;
        if (spyP) spySh += amt / spyP;
        if (qqqP) qqqSh += amt / qqqP;
      } else {
        holdings[tx.ticker] = (holdings[tx.ticker] || 0) - tx.shares;
        if ((holdings[tx.ticker] || 0) < 1e-9) delete holdings[tx.ticker];
        totalSells += amt;                              // realized proceeds kept
        if (spyP) spySh = Math.max(0, spySh - amt / spyP);
        if (qqqP) qqqSh = Math.max(0, qqqSh - amt / qqqP);
      }
    }
    if (totalBuys <= 0) continue;

    // Unrealized value of open positions
    let portVal = 0;
    for (const [tk, sh] of Object.entries(holdings)) {
      if (sh < 1e-9) continue;
      const p = nearestPrice(prices[tk], day);
      if (p) portVal += sh * p;
    }
    const spyVal = spySh * (nearestPrice(prices['SPY'], day) || 0);
    const qqqVal = qqqSh * (nearestPrice(prices['QQQ'], day) || 0);

    // Total wealth = open positions + all sell proceeds (realized gains included)
    // SPY/QQQ mirrors returned the same dollars on each sell, so totalSells applies equally
    const portWealth = portVal + totalSells;
    const spyWealth  = spyVal  + totalSells;
    const qqqWealth  = qqqVal  + totalSells;

    labels.push(day);
    portLine.push(+((portWealth / totalBuys - 1) * 100).toFixed(2));
    spyLine.push( +((spyWealth  / totalBuys - 1) * 100).toFixed(2));
    qqqLine.push( +((qqqWealth  / totalBuys - 1) * 100).toFixed(2));
  }
  return labels.length ? { labels, portLine, spyLine, qqqLine } : null;
}

// ── Price history: read / trigger / wait ─────────────────────────────────────
async function readHistory() {
  try {
    const res  = await fetch(HISTORY_URL);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('(') + 1, text.lastIndexOf(')')));
    const table = json.table;
    if (!table?.rows?.length) return { prices: {}, dividends: {} };
    const idx = {};
    table.cols.forEach((c, i) => { if (c.label) idx[c.label] = i; });
    const cell = (row, label) => { const i = idx[label]; if (i == null) return null; const c = row.c[i]; return c == null ? null : c.v; };
    const prices = {}, dividends = {};
    for (const row of table.rows) {
      const rawDate = cell(row, 'Date');
      const ticker  = cell(row, 'Ticker');
      if (!rawDate || !ticker) continue;
      let dateStr;
      if (typeof rawDate === 'string' && rawDate.startsWith('Date(')) {
        const pts = rawDate.slice(5,-1).split(',').map(Number);
        dateStr = new Date(Date.UTC(pts[0], pts[1], pts[2])).toISOString().slice(0,10);
      } else { dateStr = new Date(rawDate).toISOString().slice(0,10); }
      const close = cell(row, 'Close'), div = cell(row, 'Dividend');
      if (close != null && close !== '') { if (!prices[ticker]) prices[ticker] = {}; prices[ticker][dateStr] = close; }
      if (div   != null && div   !== '' && Number(div) > 0) { if (!dividends[ticker]) dividends[ticker] = {}; dividends[ticker][dateStr] = Number(div); }
    }
    return { prices, dividends };
  } catch(e) { console.error('readHistory:', e); return { prices: {}, dividends: {} }; }
}

async function triggerHistoryFetch(tickers, fromDate) {
  const params = new URLSearchParams({ action: 'fetchHistory', tickers: tickers.join(','), from: fromDate });
  return await recordFetch(params, true);
}

async function loadBenchmark(retry = 0) {
  const MAX_RETRY = 4;
  const setStatus = msg => { const el = document.getElementById('benchmarkStatus'); if (el) el.textContent = msg; };
  const showChart = () => {
    const s = document.getElementById('benchmarkStatus');
    const w = document.getElementById('benchmarkChartWrap');
    if (s) s.style.display = 'none';
    if (w) w.style.display = 'block';
  };

  try {
    setStatus(retry > 0 ? `Retrying… (attempt ${retry + 1}/${MAX_RETRY + 1})` : t('fetching_tx_msg'));
    _allTxCache = _allTxCache || await fetchTransactions();
    const txs = filterTxForView(_allTxCache, activePortfolio);
    if (!txs?.length) { setStatus(t('no_tx_available')); return; }

    const sorted = [...txs].sort((a,b) => a.dateStr.localeCompare(b.dateStr));
    const firstBuy = sorted.find(t => t.type === 'Buy');
    if (!firstBuy) { setStatus(t('no_buy_tx')); return; }

    const tickers = [...new Set(txs.map(t => t.ticker)), 'SPY', 'QQQ'];

    // Phase 1: render immediately with whatever is already in the History sheet
    setStatus(t('reading_history_msg'));
    let hist = await readHistory();
    historyCache = hist;

    const applyHist = h => {
      const data = computeBenchmark(txs, h.prices);
      if (data) {
        showChart();
        benchmarkData = data;
        renderBenchmarkChartFiltered(data, chartTimeFilter);
        benchmarkLoaded = true;
      }
      if (txCache?.length && currentModel) {
        const dividends = computeDividends(txCache);
        renderStatCards(currentModel, { ...lastTxData, dividends });
        renderDividendBreakdown(txCache);
        const card = document.getElementById('divBreakdownCard');
        if (card && dividends.gross > 0) card.style.display = '';
        renderHoldingsPerformance();
      }
      loadNetWorthChart();
      return !!data;
    };

    applyHist(hist);

    // Phase 2: fetch only missing/stale tickers in background, then quietly re-render
    const targetDate = new Date(Date.now() - 86400000).toISOString().slice(0,10);

    // Sold-out tickers only need history through their last transaction date, not today.
    const _netQty = {}, _lastTxDate = {};
    for (const tx of txs) {
      _netQty[tx.ticker] = (_netQty[tx.ticker] || 0) + (tx.type === 'Buy' ? tx.shares : -tx.shares);
      if (!_lastTxDate[tx.ticker] || tx.dateStr > _lastTxDate[tx.ticker]) _lastTxDate[tx.ticker] = tx.dateStr;
    }

    // Trim any post-sell history already in the sheet so it doesn't pollute the cache
    for (const tk of Object.keys(hist.prices)) {
      if ((_netQty[tk] ?? 1) < 1e-9 && _lastTxDate[tk]) {
        const sellDate = _lastTxDate[tk];
        for (const d of Object.keys(hist.prices[tk])) {
          if (d > sellDate) delete hist.prices[tk][d];
        }
      }
    }

    const missing = tickers.filter(tk => {
      const dates = hist.prices[tk];
      if (!dates || !Object.keys(dates).length) return true;
      if ((_netQty[tk] ?? 1) < 1e-9)
        return !nearestPrice(dates, _lastTxDate[tk]); // sold out: any price on/before sell date is enough
      return Object.keys(dates).sort().pop() < targetDate;
    });

    if (missing.length > 0) {
      if (!benchmarkLoaded) setStatus(`Fetching ${missing.length} ticker(s) via Apps Script… (this may take ~30s first time)`);
      await triggerHistoryFetch(missing, firstBuy.dateStr);
      const deadline = Date.now() + 120000;
      while (Date.now() < deadline) {
        await new Promise(r => setTimeout(r, 4000));
        hist = await readHistory();
        historyCache = hist;
        applyHist(hist);
        const still = missing.filter(tk => !hist.prices[tk] || !Object.keys(hist.prices[tk]).length);
        if (!still.length) break;
        if (!benchmarkLoaded) setStatus(`Waiting for history data… (${still.length} ticker(s) remaining)`);
      }
    }

    if (!benchmarkLoaded) {
      if (retry < MAX_RETRY) {
        const wait = (retry + 1) * 4;
        setStatus(`Not enough price data — retrying in ${wait}s…`);
        setTimeout(() => loadBenchmark(retry + 1), wait * 1000);
      } else {
        setStatus(t('not_enough_data_msg'));
      }
    }
  } catch(e) {
    if (retry < MAX_RETRY) {
      const wait = (retry + 1) * 4;
      setStatus(`Error: ${e.message} — retrying in ${wait}s…`);
      setTimeout(() => loadBenchmark(retry + 1), wait * 1000);
    } else {
      setStatus(`${t('benchmark_error_msg')} ${e.message}`);
    }
    console.error(e);
  }
}

// ── Realized P&L chart ───────────────────────────────────────────────────────
function computePnLTimeline(txs) {
  const holdings = {};
  const trades   = [];
  const sorted   = [...txs].sort((a, b) => {
    const d = a.dateStr.localeCompare(b.dateStr);
    return d !== 0 ? d : (a.time || '').localeCompare(b.time || '');
  });
  for (const tx of sorted) {
    if (!tx.ticker) continue;
    if (tx.type === 'Dividend') continue;
    if (!holdings[tx.ticker]) holdings[tx.ticker] = { shares: 0, avgCost: 0 };
    const h = holdings[tx.ticker];
    if (tx.type === 'Buy' || tx.type === 'Transfer-In') {
      // Transfer-In carries the source avg cost (tx.price) → buy-like, no realized P&L
      const newShares = h.shares + tx.shares;
      h.avgCost  = newShares > 0 ? (h.shares * h.avgCost + tx.shares * tx.price) / newShares : tx.price;
      h.shares   = newShares;
    } else if (tx.type === 'Sell') {
      const pnl = (tx.price - h.avgCost) * tx.shares;
      trades.push({ date: tx.dateStr, ticker: tx.ticker, pnl });
      h.shares = Math.max(0, h.shares - tx.shares);
    } else if (tx.type === 'Transfer-Out') {
      h.shares = Math.max(0, h.shares - tx.shares); // share reduction only, no realized P&L
    }
  }
  return trades;
}

function computeClosedTrades(txs) {
  const open   = {};
  const closed = [];
  const sorted = [...txs].sort((a, b) => a.dateStr.localeCompare(b.dateStr));
  for (const tx of sorted) {
    if (!tx.ticker || tx.type === 'Dividend') continue;
    const sh = tx.shares || 0, px = tx.price || 0;
    const tv = tx.tradeValue != null ? tx.tradeValue : sh * px;
    if (!open[tx.ticker]) open[tx.ticker] = { shares: 0, totalCost: 0, fees: 0, realized: 0, soldQty: 0, firstBuy: null };
    const h = open[tx.ticker];
    if (tx.type === 'Buy' || tx.type === 'Transfer-In') {
      h.shares    += sh;
      h.totalCost += sh * px;
      if (tx.type === 'Buy') h.fees += Math.abs(tv - sh * px);
      if (!h.firstBuy) h.firstBuy = tx.dateStr;
    } else if (tx.type === 'Transfer-Out') {
      // Move shares out at carried avg — no realized P&L, no closed-trade record
      const avgEntry = h.shares > 1e-9 ? h.totalCost / h.shares : px;
      const moved    = Math.min(sh, h.shares);
      h.totalCost -= avgEntry * moved;
      h.shares    -= moved;
      if (h.shares < 0.001) open[tx.ticker] = { shares: 0, totalCost: 0, fees: 0, realized: 0, soldQty: 0, firstBuy: null };
    } else if (tx.type === 'Sell') {
      const avgEntry  = h.shares > 1e-9 ? h.totalCost / h.shares : px;
      const sold      = Math.min(sh, h.shares);
      const grossPnl  = (px - avgEntry) * sold;
      const sellFee   = Math.abs(tv - sh * px);
      h.totalCost -= avgEntry * sold;
      h.shares    -= sold;
      h.fees      += sellFee;
      h.realized  += grossPnl;
      h.soldQty   += sold;
      if (h.shares < 0.001) {
        const totalFees = h.fees;
        const netPnl    = h.realized - totalFees;
        const costBasis = avgEntry * h.soldQty;
        closed.push({
          ticker:    tx.ticker,
          openDate:  h.firstBuy,
          closeDate: tx.dateStr,
          holdDays:  h.firstBuy ? Math.round((new Date(tx.dateStr) - new Date(h.firstBuy)) / 86400000) : 0,
          avgEntry,
          avgExit:   px,
          shares:    h.soldQty,
          grossPnl:  h.realized,
          fees:      totalFees,
          netPnl,
          netPnlPct: costBasis > 0 ? netPnl / costBasis * 100 : 0,
        });
        open[tx.ticker] = { shares: 0, totalCost: 0, fees: 0, realized: 0, soldQty: 0, firstBuy: null };
      }
    }
  }
  return closed.sort((a, b) => b.closeDate.localeCompare(a.closeDate));
}

// ── Net Worth Over Time ───────────────────────────────────────────────────────
function computeNetWorth(txs) {
  if (!txs?.length || !historyCache?.prices) return null;
  const prices = historyCache.prices;
  const dateSet = new Set();
  Object.values(prices).forEach(p => Object.keys(p).forEach(d => dateSet.add(d)));

  const sorted = [...txs]
    .filter(tx => tx.type === 'Buy' || tx.type === 'Sell')
    .sort((a, b) => a.dateStr.localeCompare(b.dateStr));
  const firstBuyDate = sorted.find(tx => tx.type === 'Buy')?.dateStr;
  if (!firstBuyDate) return null;

  const days = [...dateSet].filter(d => d >= firstBuyDate).sort();
  if (!days.length) return null;

  const holdings = {};
  let totalBuys = 0, totalSells = 0, txIdx = 0;
  const labels = [], netWorthLine = [], netInvestedLine = [];

  for (const day of days) {
    while (txIdx < sorted.length && sorted[txIdx].dateStr <= day) {
      const tx = sorted[txIdx++];
      const amt = (tx.shares || 0) * (tx.price || 0);
      if (tx.type === 'Buy') {
        holdings[tx.ticker] = (holdings[tx.ticker] || 0) + tx.shares;
        totalBuys += amt;
      } else {
        holdings[tx.ticker] = Math.max(0, (holdings[tx.ticker] || 0) - tx.shares);
        if ((holdings[tx.ticker] || 0) < 1e-9) delete holdings[tx.ticker];
        totalSells += amt;
      }
    }
    if (totalBuys === 0) continue;

    let portVal = 0, hasPrices = false;
    for (const [sym, sh] of Object.entries(holdings)) {
      if (sh < 1e-9) continue;
      const p = nearestPrice(prices[sym], day);
      if (p != null) { portVal += sh * p; hasPrices = true; }
    }
    if (Object.keys(holdings).length > 0 && !hasPrices) continue;

    labels.push(day);
    netWorthLine.push(+portVal.toFixed(2));
    netInvestedLine.push(+(totalBuys - totalSells).toFixed(2));
  }
  return labels.length >= 2 ? { labels, netWorthLine, netInvestedLine } : null;
}

function renderNetWorthChart(data) {
  if (nwChartInst) { nwChartInst.destroy(); nwChartInst = null; }
  const el = document.getElementById('nwChart');
  if (!el || !data) return;
  let { labels, netWorthLine, netInvestedLine } = data;
  const start = periodStart(nwTimeFilter);
  if (start) {
    const idx = labels.findIndex(d => d >= start);
    if (idx > 0) {
      labels = labels.slice(idx);
      netWorthLine = netWorthLine.slice(idx);
      netInvestedLine = netInvestedLine.slice(idx);
    }
  }
  const latest   = netWorthLine[netWorthLine.length - 1];
  const invested = netInvestedLine[netInvestedLine.length - 1];
  const gain = latest - invested;
  const te = document.getElementById('nwTotal');
  if (te) {
    te.textContent = `${fmtCurr(latest)}  ${gain >= 0 ? '+' : ''}${fmtCurr(gain)}`;
    te.style.color = `var(${gain >= 0 ? '--gain' : '--loss'})`;
  }
  nwChartInst = new Chart(el.getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [
      { label: 'Net Worth', data: netWorthLine,
        borderColor: css('--terracotta'), borderWidth: 2.5, tension: 0.3,
        pointRadius: 0, pointHoverRadius: 4,
        fill: '+1', backgroundColor: 'rgba(196,106,74,.09)' },
      { label: 'Net Invested', data: netInvestedLine,
        borderColor: css('--peri'), borderWidth: 1.8, tension: 0,
        borderDash: [4, 3], pointRadius: 0, pointHoverRadius: 4, fill: false },
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { grid: { display: false }, ticks: { maxTicksLimit: 8, color: css('--muted'), font: { size: 10 } } },
        y: { grid: { color: css('--grid') }, border: { display: false },
          ticks: { color: css('--muted'), font: { size: 10 }, callback: v => fmtCurr(v) } }
      },
      plugins: {
        legend: { display: true, position: 'top', align: 'start',
          labels: { boxWidth: 20, boxHeight: 2, color: css('--muted'), font: { size: 11 }, padding: 14 } },
        tooltip: {
          callbacks: {
            label: c => ` ${c.dataset.label}: ${fmtCurr(c.parsed.y)}`,
            afterBody: ctx => {
              const i = ctx[0]?.dataIndex;
              if (i == null) return [];
              const nw = netWorthLine[i], ni = netInvestedLine[i];
              const g = nw - ni;
              return ['', ` Total P&L: ${g >= 0 ? '+' : ''}${fmtCurr(g)} (${ni > 0 ? ((g/ni)*100).toFixed(1) : 0}%)`];
            }
          },
          backgroundColor: css('--tooltip-bg'), titleColor: '#c8b890', bodyColor: '#faf3e0', padding: 10, cornerRadius: 10
        }
      }
    }
  });
}

function loadNetWorthChart() {
  const statusEl = document.getElementById('nwStatus');
  const wrap     = document.getElementById('nwChartWrap');
  if (!statusEl) return;
  const txs = txCache;
  if (!txs?.length) { statusEl.textContent = 'No transaction data.'; statusEl.style.display = ''; return; }
  if (!historyCache?.prices || !Object.keys(historyCache.prices).length) {
    statusEl.textContent = 'Waiting for price history to load…'; statusEl.style.display = ''; return;
  }
  const data = computeNetWorth(txs);
  if (!data) {
    statusEl.textContent = 'Not enough price history to compute.'; statusEl.style.display = ''; return;
  }
  nwData = data;
  statusEl.style.display = 'none';
  if (wrap) wrap.style.display = 'block';
  renderNetWorthChart(data);
}

// ── Shared chart time filter ──────────────────────────────────────────────────
function periodStart(filter) {
  const n = Date.now();
  switch(filter) {
    case '7D':  return new Date(n - 7*86400000).toISOString().slice(0,10);
    case '1M':  return new Date(n - 30*86400000).toISOString().slice(0,10);
    case '3M':  return new Date(n - 90*86400000).toISOString().slice(0,10);
    case 'YTD': return new Date().getFullYear() + '-01-01';
    case '1Y':  return new Date(n - 365*86400000).toISOString().slice(0,10);
    default:    return null;
  }
}

function renderBenchmarkChartFiltered(data, filter) {
  let { labels, portLine, spyLine, qqqLine } = data;
  const start = periodStart(filter);
  if (start) {
    let i = labels.findIndex(d => d >= start);
    if (i < 0) i = Math.max(0, labels.length - 1);
    labels   = labels.slice(i);
    portLine = portLine.slice(i);
    spyLine  = spyLine.slice(i);
    qqqLine  = qqqLine.slice(i);
    if (labels.length) {
      const [pb, sb, qb] = [portLine[0]||0, spyLine[0]||0, qqqLine[0]||0];
      portLine = portLine.map(v => +(v-pb).toFixed(2));
      spyLine  = spyLine.map( v => +(v-sb).toFixed(2));
      qqqLine  = qqqLine.map( v => +(v-qb).toFixed(2));
    }
  }
  renderBenchmarkChart({ labels, portLine, spyLine, qqqLine });
}

  const html = `

        </div>
      </div>
      <div class="tx-field">
        <label class="tx-label">Profile name</label>
        <input class="tx-input" id="setupName" placeholder="e.g. Joe" autocomplete="off" value="${cur?.profileName || ''}">
      </div>
      <div class="tx-field">
        <label class="tx-label">Google Sheet ID *</label>
        <input class="tx-input" id="setupSheetId" placeholder="11pdwfY3j…" autocomplete="off" value="${cur?.sheetId || ''}">
        <div style="font-size:10px;color:var(--muted);margin-top:4px">From the sheet URL: /spreadsheets/d/<strong style="color:var(--terracotta)">THIS_PART</strong>/edit</div>

        <strong style="color:var(--ink)">Level 1 (view only)</strong> — Sheet ID only.<br>
        <strong style="color:var(--ink)">Level 2 (full access)</strong> — add Apps Script URL + Write key below.
      </div>
      <div class="tx-field">
        <label class="tx-label">Apps Script URL <span style="font-weight:400;color:var(--muted)">(Level 2)</span></label>
        <input class="tx-input" id="setupRecordUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" value="${cur?.recordUrl || ''}">

      <div class="tx-field">
        <label class="tx-label">Write key <span style="font-weight:400;color:var(--muted)">(Level 2${isEdit ? ' · blank = keep current' : ''})</span></label>
        <input class="tx-input" id="setupWriteKey" type="password" placeholder="${keyHint}" autocomplete="new-password">
        <div style="font-size:10px;color:var(--muted);margin-top:4px">Protects all write operations. Never stored in code.</div>
